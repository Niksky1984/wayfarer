/* Settings is shown as a modal so it works from both the home screen
   and the in-journey menu. Pin size, animations: global preferences. */
function showSettings(){
  const size = App.settings.pinSize || 'medium';
  const animOn = App.settings.pathsAnimated !== false;
  const tl = App.settings.timeline || 'off';
  openModal({
    title:'Settings',
    body:`
      <div class="toggle-row">
        <div>
          <div class="lbl">Pin size</div>
          <div class="sub">size of stops on every map</div>
        </div>
      </div>
      <div class="size-row" style="margin:0 0 18px;">
        <button class="${size==='compact'?'active':''}" onclick="setPinSize('compact', this)">Compact</button>
        <button class="${size==='medium'?'active':''}" onclick="setPinSize('medium', this)">Medium</button>
        <button class="${size==='large'?'active':''}" onclick="setPinSize('large', this)">Large</button>
      </div>
      <div class="toggle-row">
        <div>
          <div class="lbl">Animate paths</div>
          <div class="sub">flowing dashes along each route</div>
        </div>
        <div class="tog ${animOn?'on':''}" id="tog-anim" onclick="toggleAnim()"></div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="lbl">Time axis</div>
          <div class="sub">vertical timeline with dates &amp; hours</div>
        </div>
      </div>
      <div class="size-row" style="margin:0 0 18px;">
        <button class="${tl==='off'?'active':''}"   onclick="setTimeline('off', this)">Off</button>
        <button class="${tl==='left'?'active':''}"  onclick="setTimeline('left', this)">Left</button>
        <button class="${tl==='right'?'active':''}" onclick="setTimeline('right', this)">Right</button>
      </div>
      <div class="toggle-row" style="border-bottom:none;padding-bottom:0;">
        <div>
          <div class="lbl">Libraries</div>
          <div class="sub">your saved airlines &amp; hotels</div>
        </div>
      </div>
      <div class="picker-menu" style="margin-top:6px;">
        <button onclick="closeModal();openAirlinesLibrary();">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-.7 0-1.1.5-1.1 1.2v6L3 13v1.6l7.9-2.3v3.5L9 17v1.2l3-.8 3 .8V17l-1.9-1.2v-3.5L21 14.6V13l-7.9-3.8v-6C13.1 2.5 12.7 2 12 2z"/></svg>
          Airlines
        </button>
        <button onclick="closeModal();openHotelsLibrary();">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 21V8h11v13"/><path d="M15 14h5v7"/><path d="M3 21h18"/></svg>
          Hotels
        </button>
      </div>
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:18px 0 0;font-size:13px;text-align:center;">
        Settings apply to every journey, current and future.
      </p>
    `,
    actions:[{label:'Close',cls:'primary',onClick:closeModal}]
  });
}

async function setTimeline(mode, btn){
  App.settings.timeline = mode;
  await saveSettings();
  // Highlight the new active button (only within the timeline row)
  if(btn){
    const row = btn.parentElement;
    row.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  if(App.active){
    sizeStage();
    renderCanvas();
  }
}

async function toggleAnim(){
  App.settings.pathsAnimated = App.settings.pathsAnimated === false ? true : false;
  await saveSettings();
  const t = document.getElementById('tog-anim');
  if(t) t.classList.toggle('on', App.settings.pathsAnimated !== false);
  if(App.active) renderCanvas();
}

async function setPinSize(size, btn){
  App.settings.pinSize = size;
  await saveSettings();
  document.querySelectorAll('.size-row button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(App.active) renderCanvas();
}

function renameActive(){
  closeModal();
  const j=App.active;
  openModal({
    title:'Rename Journey',
    body:`<label>New Name</label><input type="text" id="ra-name" value="${escapeHtml(j.name)}" maxlength="80">`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Save',cls:'primary',onClick:async()=>{
        j.name=document.getElementById('ra-name').value.trim()||j.name;
        await saveActive();
        document.getElementById('journey-title').textContent=j.name;
        closeModal();
        toast('Renamed');
      }}
    ]
  });
  setTimeout(()=>{const el=document.getElementById('ra-name');el.focus();el.select();},100);
}

/* =========================================================
   MODAL FRAMEWORK
   ========================================================= */
let _modalClose=null;
function openModal({title,body,actions,onClose}){
  const back=document.getElementById('modal-back');
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body scrollarea">${body}</div>
    <div class="modal-foot" id="modal-actions"></div>`;
  const acts=document.getElementById('modal-actions');
  actions.forEach((a,i)=>{
    // Allow either a normal action object {label, cls?, onClick}
    // or a raw HTMLElement to drop in as-is (used for the Type chip).
    if(a instanceof HTMLElement){
      acts.appendChild(a);
      return;
    }
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'');
    b.textContent=a.label;
    b.onclick=a.onClick;
    acts.appendChild(b);
  });
  _modalClose=onClose||null;
  back.classList.add('active');
}

function closeModal(){
  document.getElementById('modal-back').classList.remove('active');
  if(_modalClose){_modalClose();_modalClose=null;}
}

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener('resize',()=>{
  if(App.active){
    sizeStage();
    renderCanvas();
  }
});

/* Single boot function so we can run it from either DOMContentLoaded
   or immediately if the DOM is already ready, without duplicating
   the try/catch. Storage failures (e.g. in restricted iframes) are
   logged but never block the UI from rendering. */
async function boot(){
  try { await openDB(); }
  catch(e){ console.warn('openDB failed:', e); toast('Storage unavailable — data won\'t persist'); }
  try { await loadSettings(); } catch(e){ console.warn('loadSettings failed:', e); }
  try { await loadCustomIcons(); } catch(e){ console.warn('loadCustomIcons failed:', e); }
  try { await loadLibraries(); } catch(e){ console.warn('loadLibraries failed:', e); }
  try { await refreshHome(); } catch(e){ console.warn('refreshHome failed:', e); }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

// Register service worker for offline support and PWA install.
// Failure is non-fatal — the app still runs without offline support.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
