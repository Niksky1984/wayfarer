/* =========================================================
   JOURNEY CANVAS — vertical-scroll model (mobile-first)

   Coordinate system: every node and note has
     fx  — fraction of stage width (0..1, may slightly exceed bounds)
     y   — pixels from top of stage
   Stage width = canvas-wrap clientWidth.
   Stage height = max(wrap clientHeight, image height when scaled to width).

   No zoom. Pan is native vertical scroll on canvas-wrap.
   ========================================================= */
async function openJourney(j){
  App.active=j;
  if(!j.notes) j.notes = [];
  // migrate old absolute (x,y) pixel coords to (fx,y)
  migrateLegacyCoords(j);

  App.connectMode=false;
  App.connectFrom=null;
  App.connectTo=null;
  App.noteMode=false;
  App.selectedNode=null;
  App.selectedNote=null;
  document.getElementById('journey-title').textContent=j.name;
  showScreen('journey');
  await loadBackground();
  await sizeStage();
  renderCanvas();
  attachCanvasGestures();
  // reset scroll to top
  document.getElementById('canvas-wrap').scrollTop = 0;
}

function migrateLegacyCoords(j){
  const ASSUMED_OLD_WIDTH = 400; // most users were on ~400px when old data was created
  let migrated = false;
  for(const n of j.nodes){
    if(typeof n.fx !== 'number'){
      const px = (typeof n.x === 'number') ? n.x : ASSUMED_OLD_WIDTH/2;
      n.fx = Math.max(0.05, Math.min(0.95, px / ASSUMED_OLD_WIDTH));
      delete n.x;
      migrated = true;
    }
    if(typeof n.y !== 'number') n.y = 100;
  }
  for(const note of (j.notes||[])){
    if(typeof note.fx !== 'number'){
      const px = (typeof note.x === 'number') ? note.x : ASSUMED_OLD_WIDTH/2;
      note.fx = Math.max(0.05, Math.min(0.95, px / ASSUMED_OLD_WIDTH));
      delete note.x;
      migrated = true;
    }
    if(typeof note.y !== 'number') note.y = 200;
  }
  if(migrated){
    // save quietly in background
    dbPut('journeys', j);
  }
}

function exitJourney(){
  App.active=null;
  if(App.bgUrl){URL.revokeObjectURL(App.bgUrl);App.bgUrl=null;}
  document.getElementById('canvas-bg').src='';
  document.getElementById('canvas-bg').style.display='none';
}

async function saveActive(){
  if(!App.active)return;
  App.active.updatedAt=new Date().toISOString();
  await dbPut('journeys',App.active);
}

async function loadBackground(){
  const j=App.active;
  const bg=document.getElementById('canvas-bg');
  if(App.bgUrl){URL.revokeObjectURL(App.bgUrl);App.bgUrl=null;}
  if(!j.backgroundFileId){
    bg.src='';
    bg.style.display='none';
    j._bgRatio = null;
    return;
  }
  const f=await dbGet('files',j.backgroundFileId);
  if(!f){
    bg.src='';
    bg.style.display='none';
    j._bgRatio = null;
    return;
  }
  App.bgUrl=URL.createObjectURL(f.blob);
  bg.src=App.bgUrl;
  bg.style.display='block';
  // compute and cache ratio = naturalHeight / naturalWidth so we can size stage
  await new Promise(res => {
    if(bg.complete && bg.naturalWidth){
      j._bgRatio = bg.naturalHeight / bg.naturalWidth;
      res();
    } else {
      bg.onload = () => {
        j._bgRatio = bg.naturalHeight / bg.naturalWidth;
        res();
      };
      bg.onerror = () => { j._bgRatio = null; res(); };
    }
  });
}

/* Set the stage element's height. With image: scale image to width, stage
   height = image height. Without image: stage = exactly one screen tall. */
function sizeStage(){
  const j = App.active;
  if(!j) return;
  const wrap = document.getElementById('canvas-wrap');
  const stage = document.getElementById('canvas-stage');
  const wrapH = wrap.clientHeight;
  const stageW = wrap.clientWidth;
  let stageH;
  if(j._bgRatio && stageW > 0){
    stageH = stageW * j._bgRatio;
    if(stageH < wrapH) stageH = wrapH;
  } else {
    stageH = wrapH;
  }
  stage.style.setProperty('--stage-h', stageH + 'px');
  App._stageW = stageW;
  App._stageH = stageH;
  App._wrapH = wrapH;
}

function renderCanvas(){
  const j=App.active;
  if(!j)return;
  if(!j.notes) j.notes = [];
  const stage=document.getElementById('canvas-stage');
  // pin size — read from global settings, not from the journey
  stage.dataset.pinSize = App.settings.pinSize || 'medium';

  const W = App._stageW || stage.clientWidth || 1;
  const H = App._stageH || stage.clientHeight || 1;

  const animated = App.settings.pathsAnimated !== false;

  // ---- TIME AXIS ----
  // ---- EDGES ----
  // Stops always use their stored fx/y — no auto-snapping by time anymore.
  const svg=document.getElementById('canvas-svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let svgHtml='';
  for(const e of j.edges){
    const a=j.nodes.find(n=>n.id===e.from);
    const b=j.nodes.find(n=>n.id===e.to);
    if(!a||!b)continue;
    const ax=a.fx*W, ay=a.y;
    const bx=b.fx*W, by=b.y;
    const dx=bx-ax, dy=by-ay;
    const len=Math.hypot(dx,dy)||1;
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const nx=-dy/len, ny=dx/len;
    const bend = Math.min(60, len*0.18);
    const sign = (hashStr(e.from + e.to) & 1) ? 1 : -1;
    const cx=mx + nx*bend*sign;
    const cy=my + ny*bend*sign;
    const dpath=`M${ax},${ay} Q${cx},${cy} ${bx},${by}`;
    const cls=e.type||'walk';
    const animCls = animated ? ' animated' : '';
    svgHtml+=`<path class="canvas-edge-hit" d="${dpath}" data-edge="${e.from}|${e.to}"/>`;
    svgHtml+=`<path class="canvas-edge ${cls}${animCls}" d="${dpath}"/>`;
    // Mode label at curve midpoint (kept; duration moved out of the path
    // and into the side-chain of ovals on connected timed legs).
    const lmx = 0.25*ax + 0.5*cx + 0.25*bx;
    const lmy = 0.25*ay + 0.5*cy + 0.25*by;
    const lab=(TRAVEL_MODES[cls]?TRAVEL_MODES[cls].label:'').toUpperCase();
    const labW=Math.max(28, lab.length*6 + 10);
    svgHtml+=`<rect class="edge-label-bg" x="${lmx-labW/2}" y="${lmy-7}" width="${labW}" height="14" rx="2" pointer-events="none"/>`;
    svgHtml+=`<text class="edge-label" x="${lmx}" y="${lmy+3}" pointer-events="none">${lab}</text>`;
  }
  svg.innerHTML=svgHtml;
  svg.querySelectorAll('.canvas-edge-hit').forEach(p=>{
    p.addEventListener('click',ev=>{
      ev.stopPropagation();
      const [from,to]=p.dataset.edge.split('|');
      editEdge(from,to);
    });
  });

  // ---- NODES ----
  const nc=document.getElementById('canvas-nodes');
  nc.innerHTML='';
  j.nodes.forEach((n,i)=>{
    const el=document.createElement('div');
    el.className='canvas-node';
    if(App.connectFrom===n.id || App.connectTo===n.id) el.classList.add('connecting');
    if(App.selectedNode===n.id) el.classList.add('selected');
    el.style.left=(n.fx*W)+'px';
    el.style.top=(n.y)+'px';
    el.dataset.id=n.id;
    const hasFiles=(n.files||[]).length>0;
    const type=n.type||'stop';
    const info = getNodePinInfo(type, i+1);
    el.innerHTML=`
      <div class="node-pin ${info.pinClass} ${hasFiles?'has-files':''}">${info.innerHtml}</div>
      <div class="node-label">${escapeHtml(n.name)}</div>`;
    nc.appendChild(el);
    attachNodeHandlers(el,n);
  });

  // ---- NOTES ----
  for(const note of j.notes){
    const el=document.createElement('div');
    el.className='canvas-note-pin';
    if(App.selectedNote===note.id) el.classList.add('selected');
    el.style.left=(note.fx*W)+'px';
    el.style.top=(note.y)+'px';
    el.dataset.id=note.id;
    const filled = note.text && note.text.trim().length>0;
    if(filled){
      el.innerHTML=`<div class="note-shape filled">
        <svg viewBox="0 0 36 36">
          <path class="tri" d="M18 4 L33 30 L3 30 Z"/>
          <rect class="bang" x="16.6" y="13" width="2.8" height="9" rx="1.2"/>
          <circle class="bang" cx="18" cy="26" r="1.6"/>
        </svg>
      </div>`;
    } else {
      el.innerHTML=`<div class="note-shape empty">
        <svg viewBox="0 0 36 36">
          <path class="note-paper" d="M9 5 L23 5 L29 11 L29 31 L9 31 Z"/>
          <path class="note-paper" d="M23 5 L23 11 L29 11" fill="none"/>
          <rect class="note-pencil" x="13" y="16" width="11" height="1.4" rx=".7"/>
          <rect class="note-pencil" x="13" y="20" width="13" height="1.4" rx=".7"/>
          <rect class="note-pencil" x="13" y="24" width="8" height="1.4" rx=".7"/>
        </svg>
      </div>`;
    }
    nc.appendChild(el);
    attachNotePinHandlers(el, note);
  }

  // ---- TIME OVAL CHAIN (replaces the old time axis) ----
  renderTimeOvals(j, W, H);

  // ---- TOPBAR TRIP STATS ----
  updateTripStats(j);
}

/* Render the side-chain of time and duration ovals.
   - Each stop with a time → one oval at the stop's Y, on the configured side
   - Each EDGE between two TIMED stops → a duration oval at the midpoint Y
     between the two stops (uses edge.duration if set, otherwise computes
     from the date+time difference)
   - When an edge crosses a date boundary → a small day label appears in
     the chain showing the new date
   The chain is positioned absolutely at a fixed X near the chosen edge
   of the screen so it reads as a clean column even when stops are scattered.
*/
function renderTimeOvals(j, W, H){
  const container = document.getElementById('canvas-times');
  if(!container) return;
  container.innerHTML = '';
  const mode = App.settings.timeline || 'off';
  if(mode === 'off') return;

  const side = mode === 'right' ? 'right' : 'left';
  // X position of the oval column: 12px from the chosen screen edge
  const styleEdge = (side === 'left') ? 'left:12px;' : 'right:12px;';

  // 1. One oval per stop that has a time set
  for(const n of j.nodes){
    if(!n.time) continue;
    const oval = document.createElement('div');
    oval.className = 'time-oval';
    oval.style.cssText = `${styleEdge} top:${n.y}px;`;
    oval.textContent = n.time;
    container.appendChild(oval);
  }

  // 2. For each EDGE between two stops that both have date+time → duration oval
  // at the midpoint Y. Also add a day-label divider if the dates differ.
  for(const e of j.edges){
    const a = j.nodes.find(n => n.id === e.from);
    const b = j.nodes.find(n => n.id === e.to);
    if(!a || !b) continue;
    if(!a.time || !b.time) continue; // both endpoints need times
    // Compute duration — explicit edge.duration wins, else compute from dates
    let dur = (e.duration && e.duration > 0) ? e.duration : null;
    if(dur == null){
      // edgeDurationMinutes needs both dates to compute correctly; if either
      // is missing fall back to "today" assumption (so single-day trips work)
      const aWithDate = Object.assign({}, a, { date: a.date || '1970-01-01' });
      const bWithDate = Object.assign({}, b, { date: b.date || a.date || '1970-01-01' });
      dur = edgeDurationMinutes(aWithDate, bWithDate);
    }
    if(!dur || dur <= 0) continue;
    const midY = (a.y + b.y) / 2;
    const oval = document.createElement('div');
    oval.className = 'time-oval duration';
    oval.style.cssText = `${styleEdge} top:${midY}px;`;
    oval.textContent = formatDuration(dur);
    container.appendChild(oval);

    // Day label only if both endpoints have explicit dates and they differ.
    if(a.date && b.date && a.date !== b.date){
      // Decide which date to show: the date "you're entering" along the path.
      // Since bottom = earliest, we show the date of whichever endpoint sits
      // higher up the screen (later in time visually).
      const upperNode = a.y < b.y ? a : b;
      const dayEl = document.createElement('div');
      dayEl.className = 'time-day';
      const dObj = parseISODate(upperNode.date);
      dayEl.style.cssText = `${styleEdge} top:${midY + 18}px;`;
      dayEl.textContent = dObj ? `${dObj.getDate()} ${fmtMonthShort(dObj)}` : upperNode.date;
      container.appendChild(dayEl);
    }
  }
}

function updateTripStats(j){
  const title = document.getElementById('journey-title');
  if(!title) return;
  // Remove any existing stats line
  const existing = title.querySelector('.trip-stats');
  if(existing) existing.remove();
  const range = getTimelineRange(j);
  const stops = j.nodes.length;
  if(!range && stops === 0) return;

  // Sum costs by currency across all stops and edges
  const totals = {};
  const add = (amt, cur) => {
    if(!amt || amt <= 0) return;
    const c = cur || App.settings.defaultCurrency || 'USD';
    totals[c] = (totals[c] || 0) + Number(amt);
  };
  for(const n of j.nodes){
    add(n.cost, n.costCurrency);                  // hotel cost
    add(n.arrivalCost, n.arrivalCostCurrency);    // arrival flight
    add(n.departureCost, n.departureCostCurrency);// departure flight
  }
  for(const e of (j.edges||[])){
    add(e.cost, e.costCurrency);
  }
  const costParts = Object.entries(totals).map(([cur, amt]) => formatCost(amt, cur));

  const sub = document.createElement('span');
  sub.className = 'trip-stats';
  const parts = [];
  if(range) parts.push(`${range.dayCount} day${range.dayCount===1?'':'s'}`);
  parts.push(`${stops} stop${stops===1?'':'s'}`);
  if(costParts.length) parts.push(costParts.join(' + '));
  sub.textContent = parts.join(' · ');
  title.appendChild(sub);
}

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; }
  return h;
}




/* =========================================================
   NODE INTERACTIONS
   ========================================================= */
function attachNodeHandlers(el, node){
  let pressing=false, dragging=false;
  let startX=0, startY=0, startFx=0, startNodeY=0, startTime=0;
  const MOVE_THRESH=10;          // ignore small finger jitter
  const CONNECT_MOVE_TOLERANCE=40; // in connect mode allow much more wobble
  const TAP_MAX_MS=350;

  const onDown=ev=>{
    ev.stopPropagation();
    // In connect mode, never let a touch start a drag — treat the
    // whole gesture as a single-tap selection. This means even a
    // slightly jittery finger reliably registers as a node tap.
    if(App.connectMode){
      const t=ev.touches?ev.touches[0]:ev;
      startX=t.clientX; startY=t.clientY;
      startTime=Date.now();
      pressing=true; dragging=false;
      return;
    }
    const t=ev.touches?ev.touches[0]:ev;
    startX=t.clientX; startY=t.clientY;
    startFx=node.fx;
    // Dragging only moves the node visually. It never changes the
    // stop's time or date — ovals just follow the dragged Y position
    // along the side chain.
    startNodeY=node.y;
    startTime=Date.now();
    pressing=true; dragging=false;
  };
  const onMove=ev=>{
    if(!pressing)return;
    // In connect mode, ignore movement entirely. The user is trying
    // to tap; finger jitter or slight slide should not cancel that.
    if(App.connectMode) return;
    const t=ev.touches?ev.touches[0]:ev;
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(!dragging && Math.hypot(dx,dy)>MOVE_THRESH){
      dragging=true;
      el.classList.add('dragging');
      navigator.vibrate&&navigator.vibrate(15);
    }
    if(dragging){
      ev.preventDefault();
      const W = App._stageW || 1;
      const H = App._stageH || 1;
      let newFx = startFx + dx / W;
      newFx = Math.max(0.05, Math.min(0.95, newFx));
      let newY = startNodeY + dy;
      newY = Math.max(0, Math.min(H - 1, newY));
      node.fx = newFx;
      node.y = newY;
      renderCanvas();
    }
  };
  const onUp=async ev=>{
    if(!pressing)return;
    pressing=false;
    el.classList.remove('dragging');
    // Connect mode: any release on this node is a selection tap.
    // We accept it as long as the finger didn't travel ridiculously
    // far (e.g. user accidentally hit this node while panning to
    // some other node).
    if(App.connectMode){
      const t = (ev.changedTouches && ev.changedTouches[0]) || ev;
      const dx = (t.clientX||0) - startX;
      const dy = (t.clientY||0) - startY;
      if(Math.hypot(dx,dy) <= CONNECT_MOVE_TOLERANCE){
        handleConnectTap(node.id);
      }
      return;
    }
    if(dragging){
      dragging=false;
      await saveActive();
    }else{
      const dur=Date.now()-startTime;
      if(dur<=TAP_MAX_MS+250){
        openNodeDetail(node.id);
      }
    }
  };

  el.addEventListener('mousedown',onDown);
  el.addEventListener('touchstart',onDown,{passive:true});
  el.addEventListener('mousemove',onMove);
  el.addEventListener('touchmove',onMove,{passive:false});
  el.addEventListener('mouseup',onUp);
  el.addEventListener('touchend',onUp);
  el.addEventListener('mouseleave',()=>{if(pressing && !dragging){pressing=false;}});
  el.addEventListener('touchcancel',()=>{
    pressing=false; dragging=false;
    el.classList.remove('dragging');
  });
}

/* =========================================================
   NOTE PIN INTERACTIONS — drag to move, tap to edit
   ========================================================= */
function attachNotePinHandlers(el, note){
  let pressing=false, dragging=false;
  let startX=0, startY=0, startFx=0, startNoteY=0, startTime=0;
  const MOVE_THRESH=6;

  const onDown = ev => {
    ev.stopPropagation();
    const t = ev.touches ? ev.touches[0] : ev;
    startX=t.clientX; startY=t.clientY;
    startFx=note.fx; startNoteY=note.y;
    startTime=Date.now();
    pressing=true; dragging=false;
  };
  const onMove = ev => {
    if(!pressing) return;
    const t = ev.touches ? ev.touches[0] : ev;
    const dx = t.clientX-startX, dy = t.clientY-startY;
    if(!dragging && Math.hypot(dx,dy) > MOVE_THRESH){
      dragging=true;
      el.classList.add('dragging');
      navigator.vibrate && navigator.vibrate(15);
    }
    if(dragging){
      ev.preventDefault();
      const W = App._stageW || 1;
      let newFx = startFx + dx / W;
      newFx = Math.max(0.04, Math.min(0.96, newFx));
      let newY = startNoteY + dy;
      newY = Math.max(0, Math.min((App._stageH || 1) - 1, newY));
      note.fx = newFx;
      note.y = newY;
      renderCanvas();
    }
  };
  const onUp = async ev => {
    if(!pressing) return;
    pressing=false;
    el.classList.remove('dragging');
    if(dragging){
      dragging=false;
      await saveActive();
    } else {
      openNoteEditor(note.id);
    }
  };

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, {passive:true});
  el.addEventListener('mousemove', onMove);
  el.addEventListener('touchmove', onMove, {passive:false});
  el.addEventListener('mouseup', onUp);
  el.addEventListener('touchend', onUp);
  el.addEventListener('mouseleave', () => { if(pressing && !dragging) pressing=false; });
  el.addEventListener('touchcancel', () => {
    pressing=false; dragging=false;
    el.classList.remove('dragging');
  });
}

/* =========================================================
   CANVAS GESTURES — only one job left: detect a tap on empty
   canvas to drop a note when in note-mode. Native scroll handles
   panning, and there is no zoom.
   ========================================================= */
function attachCanvasGestures(){
  const wrap=document.getElementById('canvas-wrap');
  const stage=document.getElementById('canvas-stage');
  let tapStartX=0, tapStartY=0, tapStartTime=0, tapMoved=false, tapActive=false;
  const TAP_MAX_MS=400;
  const TAP_MOVE_THRESH=10;

  const isInteractive = el => el.closest('.canvas-node, .canvas-note-pin, .canvas-edge-hit');

  // We attach to the stage so we get coordinates relative to it (not the
  // wrap) — that way scrolling doesn't change our reference frame.
  stage.ontouchstart=ev=>{
    if(ev.touches.length!==1 || isInteractive(ev.target)) {
      tapActive=false; return;
    }
    tapStartX=ev.touches[0].clientX;
    tapStartY=ev.touches[0].clientY;
    tapStartTime=Date.now();
    tapMoved=false; tapActive=true;
  };
  stage.ontouchmove=ev=>{
    if(!tapActive || ev.touches.length!==1) return;
    const t=ev.touches[0];
    if(Math.hypot(t.clientX-tapStartX, t.clientY-tapStartY)>TAP_MOVE_THRESH){
      tapMoved=true;
    }
  };
  stage.ontouchend=ev=>{
    if(!tapActive) return;
    if(!tapMoved && (Date.now()-tapStartTime)<TAP_MAX_MS && App.noteMode){
      // convert client coordinates to stage coordinates
      const r=stage.getBoundingClientRect();
      placeNoteAt(tapStartX - r.left, tapStartY - r.top);
    }
    tapActive=false;
  };

  // mouse fallback
  stage.onmousedown=ev=>{
    if(isInteractive(ev.target)) {tapActive=false; return;}
    tapStartX=ev.clientX; tapStartY=ev.clientY;
    tapStartTime=Date.now();
    tapMoved=false; tapActive=true;
  };
  stage.onmousemove=ev=>{
    if(!tapActive) return;
    if(Math.hypot(ev.clientX-tapStartX, ev.clientY-tapStartY)>TAP_MOVE_THRESH){
      tapMoved=true;
    }
  };
  stage.onmouseup=ev=>{
    if(!tapActive) return;
    if(!tapMoved && (Date.now()-tapStartTime)<TAP_MAX_MS && App.noteMode){
      const r=stage.getBoundingClientRect();
      placeNoteAt(tapStartX - r.left, tapStartY - r.top);
    }
    tapActive=false;
  };
  stage.onmouseleave=()=>{tapActive=false;};
}

/* =========================================================
   ADD NODE — new stops drop near the top of the visible area
   ========================================================= */
function addNodeAtCenter(){
  // Debug logging — visible in Chrome DevTools so we can trace failures
  try { console.log('addNodeAtCenter: invoked'); } catch(_) {}
  if(!App.active){
    toast('No active journey — open or create one first');
    return;
  }
  openModal({
    title:'New Stop',
    body:`<label>Name this stop</label>
          <input type="text" id="nn-name" placeholder="e.g. Hotel · Hanoi" maxlength="60">`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Place',cls:'primary',onClick:async()=>{
        try {
          const inp = document.getElementById('nn-name');
          const name = inp ? inp.value.trim() : '';
          if(!name){toast('Name required');return;}
          const wrap=document.getElementById('canvas-wrap');
          const stage=document.getElementById('canvas-stage');
          // Multiple fallbacks so the node creation works even if
          // the stage hasn't reported a size yet for some reason.
          const stageW = (stage && stage.clientWidth) || App._stageW || (wrap && wrap.clientWidth) || 412;
          const stageH = App._stageH || (stage && stage.clientHeight) || (wrap && wrap.clientHeight) || 600;
          const wrapH = wrap ? wrap.clientHeight : 600;
          const scrollTop = wrap ? wrap.scrollTop : 0;
          // Place near the center of the currently visible area
          const visibleCenterY = scrollTop + wrapH / 2;
          const i = App.active.nodes.length;
          const offset = i * 22;
          const fxRaw = 0.5 + ((i % 2 === 0) ? 0 : 0.04) * (i % 4 < 2 ? 1 : -1);
          const fx = Math.max(0.1, Math.min(0.9, fxRaw));
          const y = Math.max(40, Math.min(stageH-40, visibleCenterY + offset - 100));
          App.active.nodes.push({
            id:uuid(), name,
            type:'stop',
            fx,
            y,
            description:'', files:[]
          });
          await saveActive();
          closeModal();
          renderCanvas();
          toast('Stop placed');
        } catch(e){
          console.error('addNodeAtCenter save failed:', e);
          toast('Could not place stop — see console');
        }
      }}
    ]
  });
  setTimeout(()=>{
    const el = document.getElementById('nn-name');
    if(el) el.focus();
  },100);
}

/* screenX/screenY are coordinates relative to the canvas-stage */
async function placeNoteAt(stageX, stageY){
  if(!App.active) return;
  const W = App._stageW || 1;
  const H = App._stageH || 1;
  const fx = Math.max(0.04, Math.min(0.96, stageX / W));
  const y  = Math.max(0, Math.min(H - 1, stageY));
  const note = {
    id: uuid(),
    fx, y,
    text: '',
    createdAt: new Date().toISOString()
  };
  if(!App.active.notes) App.active.notes = [];
  App.active.notes.push(note);
  await saveActive();
  setNoteMode(false);
  renderCanvas();
  openNoteEditor(note.id);
}

async function handleConnectTap(nodeId){
  if(!App.connectFrom){
    App.connectFrom=nodeId;
    showHint('Now tap the destination');
    renderCanvas();
    return;
  }
  if(App.connectFrom===nodeId){
    App.connectFrom=null;
    showHint('Tap two stops to link them');
    renderCanvas();
    return;
  }
  // about to create edge — verify it doesn't exist
  const from=App.connectFrom, to=nodeId;
  const exists=App.active.edges.some(e=>
    (e.from===from && e.to===to)||(e.from===to && e.to===from));
  if(exists){
    toast('Already linked');
    App.connectFrom=null;
    showHint('Tap two stops to link them');
    renderCanvas();
    return;
  }
  // Briefly highlight BOTH nodes (source + destination) so the user
  // sees confirmation of their second tap, then open the mode picker.
  App.connectTo = to;
  showHint(null);
  renderCanvas();
  // Short delay so the glow on the second node is visible before the
  // modal covers the canvas. 220ms is enough to register visually
  // without feeling laggy.
  await new Promise(r => setTimeout(r, 220));
  App.connectFrom=null;
  App.connectTo=null;
  App.connectMode=false;
  document.getElementById('tb-connect').classList.remove('active');
  pickTravelMode(null, async (mode, dur, cost, curr)=>{
    if(mode===null){renderCanvas();return;}  // cancelled
    const edge = {from, to, type: mode};
    if(dur && dur > 0) edge.duration = dur;
    if(cost != null && cost > 0){
      edge.cost = cost;
      edge.costCurrency = curr || App.settings.defaultCurrency || 'USD';
    }
    App.active.edges.push(edge);
    await saveActive();
    toast('Path drawn');
    renderCanvas();
  });
}

function pickTravelMode(currentMode, onPick, currentDuration, currentCost, currentCostCurrency){
  const optsHtml=Object.entries(TRAVEL_MODES).map(([k,v])=>{
    const sel=currentMode===k?'selected':'';
    // preview svg line matching the actual edge style
    const prev=`<svg class="preview" viewBox="0 0 48 14"><line x1="3" y1="7" x2="45" y2="7" stroke="${v.prevColor}" stroke-width="${v.prevWidth}" stroke-dasharray="${v.prevDash==='0'?'':v.prevDash}" stroke-linecap="${k==='walk'||k==='bus'?'round':'butt'}"/></svg>`;
    return `<div class="mode-opt ${sel}" data-mode="${k}" onclick="window._modePicked='${k}';document.querySelectorAll('.mode-opt').forEach(e=>e.classList.toggle('selected',e.dataset.mode==='${k}'));">
      <div class="micon">${v.icon}</div>
      <div class="mtxt"><div class="nm">${v.label}</div></div>
      ${prev}
    </div>`;
  }).join('');
  window._modePicked=currentMode;
  // Default duration form values
  const durVal = nodeDurValue(currentDuration);
  const durUnit = nodeDurUnit(currentDuration);
  openModal({
    title:'Travel Mode',
    body:`<p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:0 0 4px;font-size:14px;">How is this leg of the journey travelled?</p>
          <div class="mode-list">${optsHtml}</div>
          <label style="display:flex;align-items:center;justify-content:space-between;">
            <span>Travel time <span style="font-style:italic;font-family:'Cormorant Garamond',serif;text-transform:none;letter-spacing:0;color:var(--ink-muted);">(optional)</span></span>
            <button class="tiny-clear" onclick="document.getElementById('edge-dur').value='';">Clear</button>
          </label>
          <div class="duration-row">
            <input type="number" id="edge-dur" min="0" placeholder="0" value="${durVal}">
            <select id="edge-dur-unit">
              <option value="m" ${durUnit==='m'?'selected':''}>minutes</option>
              <option value="h" ${durUnit==='h'?'selected':''}>hours</option>
              <option value="d" ${durUnit==='d'?'selected':''}>days</option>
            </select>
          </div>
          <label>Cost</label>
          ${renderCostRow('edge-cost', currentCost, currentCostCurrency, null)}
          <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:6px 0 0;font-size:13px;">
            If travel time is empty and both stops have times, it's computed automatically.
          </p>`,
    actions:[
      {label:'Cancel',onClick:()=>{closeModal();onPick(null, null, null, null);}},
      {label:'Save',cls:'primary',onClick:()=>{
        const dEl = document.getElementById('edge-dur');
        const uEl = document.getElementById('edge-dur-unit');
        const dur = (dEl && uEl) ? durToMinutes(dEl.value, uEl.value) : 0;
        const cost = readCostRow('edge-cost');
        closeModal();
        onPick(window._modePicked||'walk', dur, cost.amount, cost.currency);
      }}
    ]
  });
}

function editEdge(from,to){
  const e=App.active.edges.find(x=>x.from===from && x.to===to);
  if(!e)return;
  const a=App.active.nodes.find(n=>n.id===from);
  const b=App.active.nodes.find(n=>n.id===to);
  pickTravelMode(e.type||'walk', async (mode, dur, cost, curr)=>{
    if(mode===null){renderCanvas();return;}
    e.type=mode;
    if(dur && dur > 0) e.duration = dur;
    else delete e.duration;
    if(cost != null && cost > 0){
      e.cost = cost;
      e.costCurrency = curr || App.settings.defaultCurrency || 'USD';
    } else {
      delete e.cost;
      delete e.costCurrency;
    }
    await saveActive();
    toast('Updated');
    renderCanvas();
  }, e.duration || 0, e.cost, e.costCurrency);
  // overlay an extra "Remove" button into the modal foot
  setTimeout(()=>{
    const acts=document.getElementById('modal-actions');
    if(!acts)return;
    const head=document.querySelector('.modal-head h2');
    if(head && a && b) head.textContent=`${a.name} → ${b.name}`;
    const rm=document.createElement('button');
    rm.className='btn danger';
    rm.textContent='Remove Path';
    rm.style.marginRight='auto';
    rm.onclick=async()=>{
      App.active.edges=App.active.edges.filter(x=>!(x.from===from&&x.to===to));
      await saveActive();
      closeModal();
      renderCanvas();
      toast('Path removed');
    };
    acts.insertBefore(rm, acts.firstChild);
  },20);
}

/* Build the modal body for the current stop, dispatching on the
   stop's type so each layout shows only the relevant fields. */
function buildStopBody(node){
  const t = node.type || 'stop';
  // Shared parts every layout needs at the top
  const nameDesc = `
    <label>Name</label>
    <input type="text" id="nd-name" value="${escapeHtml(node.name)}" maxlength="60">
    <label>Description</label>
    <textarea id="nd-desc" placeholder="notes, address, times, anything…">${escapeHtml(node.description||'')}</textarea>
  `;
  const filesBlock = `
    <label style="display:flex;align-items:center;justify-content:space-between;">
      <span>Documents</span>
      <button class="btn gold" style="padding:6px 12px;font-size:10px;" onclick="addFileToNode()">+ Add</button>
    </label>
    <div class="file-list" id="nd-files">${renderFilesList(node)}</div>
  `;

  let middle = '';
  switch(t){
    case 'airport_arrival':
      middle = renderArrivalDateTime(node) + renderArrivalFlightSection(node);
      break;
    case 'airport_departure':
      middle = renderDepartureDateTime(node) + renderDepartureFlightSection(node);
      break;
    case 'airport_both':
      middle = renderArrivalDateTime(node)
             + renderStayDurationField(node)
             + renderDepartureDateTime(node)
             + renderArrivalFlightSection(node)
             + renderDepartureFlightSection(node);
      break;
    case 'hotel':
      middle = renderHotelDateTimes(node)
             + renderHotelSection(node)
             + renderHotelCostRow(node);
      break;
    case 'train_arrival':
      middle = renderArrivalDateTime(node);
      break;
    case 'train_departure':
      middle = renderDepartureDateTime(node);
      break;
    default:
      // Generic stop — date+time + stay duration
      middle = renderGenericDateTime(node) + renderStayDurationField(node);
      break;
  }
  return nameDesc + middle + filesBlock;
}

function renderFilesList(node){
  const html = (node.files||[]).map(f=>{
    const e=ext(f.name).toUpperCase();
    const klass=e==='PDF'?'pdf':(e==='TXT'?'txt':'');
    const isImg=['JPG','JPEG','PNG','GIF','WEBP'].includes(e);
    return `
      <div class="file-row" data-fid="${f.id}">
        <div class="file-icon ${klass}" data-thumb="${isImg?'1':'0'}" data-fid="${f.id}">${isImg?'':e}</div>
        <div class="file-info" onclick="viewFile('${f.id}')">
          <div class="nm">${escapeHtml(f.name)}</div>
          <div class="sz">${fmtSize(f.size)}</div>
        </div>
        <div class="acts">
          <button onclick="renameFile('${f.id}')" title="Rename">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg>
          </button>
          <button onclick="confirmRemoveFile('${f.id}')" title="Remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
  return html || '<p style="font-family:\'Cormorant Garamond\',serif;font-style:italic;color:var(--ink-muted);margin:8px 0;font-size:15px;">No documents attached.</p>';
}

/* Save-and-stay: writes the form then re-renders the popup
   so the user can keep editing. Used by the Save button. */
async function saveNodeDetailStay(){
  if(!_editingNode) return;
  await commitNodeFromForm();
  await saveActive();
  renderCanvas();
  toast('Saved');
  // Re-render the popup with the saved state
  openNodeDetail(_editingNode.id);
}

/* Build the Type chip element for the popup footer. Tapping it opens
   the type picker; choosing a new type re-opens the stop popup with
   the appropriate conditional section. */
function buildTypeChip(node){
  const info = getNodePinInfo(node.type, '');
  const label = getTypeLabel(node.type);
  const btn = document.createElement('button');
  btn.className = 'type-chip-btn';
  btn.innerHTML = `
    <div class="chip-ico ${info.pinClass} ${info.isImage?'has-image':''}">${info.innerHtml}</div>
    <div class="chip-label">${escapeHtml(label)}</div>
  `;
  btn.onclick = () => openTypePicker(node.type);
  return btn;

/* Type picker as a sub-modal. After selecting a new type, re-open the
   stop detail popup so the body reflects the chosen type's section. */
function openTypePicker(currentType){
  if(!_editingNode) return;
  // Save the in-progress edits before swapping modals
  capturePendingNodeEdits();
  const gridHtml = renderTypeGrid(currentType);
  openModal({
    title:'Choose Type',
    body:`<div class="type-grid" id="nd-types">${gridHtml}</div>`,
    actions:[
      {label:'Cancel', onClick:()=>{ openNodeDetail(_editingNode.id); }},
      {label:'Apply',  cls:'primary', onClick:()=>{
        // _editingNode.type was set live by pickNodeType
        openNodeDetail(_editingNode.id);
      }}
    ]
  });
}

/* Capture form values from the stop popup so we don't lose them when
   swapping to a sub-modal (type picker, library detail view). */
function capturePendingNodeEdits(){
  if(!_editingNode) return;
  // Reuse the commit-from-form writer. It's async but tolerant of being
  // called during a synchronous swap; we don't await it because the
  // form values are read synchronously inside.
  commitNodeFromForm();
}

function toggleTypeCollapsible(){
  const c = document.getElementById('nd-type-coll');
  if(c) c.classList.toggle('open');
}

/* =========================================================
   FLIGHT SECTION (airport_arrival / airport_departure stops)
   Shown inside the stop popup when type is one of those.

   Stop fields touched: airlineId, flightNumber
   The flight's time is the stop's own date/time (per user choice).
   ========================================================= */
/* Generic flight section builder. `kind` is 'arr' or 'dep'.
   - For 'arr': uses node.arrivalAirlineId, node.arrivalFlightNumber, node.arrivalTerminal
   - For 'dep': uses node.departureAirlineId, node.departureFlightNumber, node.departureTerminal
   - Each section has its own picker section ID so two pickers can
     coexist on the same popup (for airport_both / layover stops).
*/
function renderFlightSectionGeneric(node, kind, headerLabel){
  const isArr = kind === 'arr';
  const airlineKey   = isArr ? 'arrivalAirlineId'   : 'departureAirlineId';
  const flightNumKey = isArr ? 'arrivalFlightNumber': 'departureFlightNumber';
  const terminalKey  = isArr ? 'arrivalTerminal'    : 'departureTerminal';
  const costKey      = isArr ? 'arrivalCost'        : 'departureCost';
  const curKey       = isArr ? 'arrivalCostCurrency': 'departureCostCurrency';
  const sectionId    = isArr ? 'nd-arr-airlines-section' : 'nd-dep-airlines-section';

  // Backward compat: legacy single-airline stops stored on node.airlineId
  // are interpreted as the arrival airline for arrival stops and as the
  // departure airline for departure stops. (Only fall back if the new
  // field is unset.)
  let airlineId = node[airlineKey];
  if(!airlineId && node.airlineId &&
     ((isArr && node.type === 'airport_arrival') ||
      (!isArr && node.type === 'airport_departure'))){
    airlineId = node.airlineId;
  }
  const airline = airlineId ? _airlines.find(a => a.id === airlineId) : null;

  const summaryHtml = airline
    ? renderAirlineSummaryGeneric(airline, sectionId)
    : `<div class="lib-section-head" onclick="toggleLibSection('${sectionId}')">
         <div class="head-ico">
           <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-.7 0-1.1.5-1.1 1.2v6L3 13v1.6l7.9-2.3v3.5L9 17v1.2l3-.8 3 .8V17l-1.9-1.2v-3.5L21 14.6V13l-7.9-3.8v-6C13.1 2.5 12.7 2 12 2z"/></svg>
         </div>
         <div class="head-info">
           <div class="lbl-tiny">Airline</div>
           <div class="nm" style="font-style:italic;color:var(--ink-muted);">Tap to choose…</div>
         </div>
         <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
       </div>`;

  const flightNum = node[flightNumKey] || (node.flightNumber && !isArr === (node.type === 'airport_departure') ? node.flightNumber : '');
  const terminal  = node[terminalKey] || '';
  const cost      = node[costKey];
  const cur       = node[curKey];

  // Use the appropriate `kind` (arr/dep) as part of input IDs so two
  // sections on one popup don't collide.
  const idP = isArr ? 'arr' : 'dep';

  // Build a compact summary string shown on the collapsed header so
  // you can see at a glance what's already filled in.
  let collapsedSummary = '';
  if(airline) collapsedSummary += airline.name + (airline.code ? ' · ' + airline.code : '');
  if(flightNum) collapsedSummary += (collapsedSummary ? ' · ' : '') + flightNum;
  if(terminal) collapsedSummary += (collapsedSummary ? ' · ' : '') + 'T' + terminal.replace(/^T\s*/i,'');

  // For single-airport stops (airport_arrival / airport_departure), the
  // section opens by default — it's the main content. For airport_both,
  // both sections start collapsed so the popup stays compact; tap to
  // expand whichever you want to edit.
  const isLayover = node.type === 'airport_both';
  const openByDefault = !isLayover;
  const blockId = `nd-${idP}-flight-block`;

  // The plane icon flips for departure vs arrival
  const iconSvg = isArr
    ? `<svg viewBox="0 0 24 24"><g transform="translate(12 12) rotate(20) translate(-12 -12)"><path d="M12 3c-.7 0-1.1.5-1.1 1.2v5l-7 4v1.7l7-2.1v3.5l-2 1.3v1.2l3.1-.8 3.1.8v-1.2l-2-1.3v-3.5l7 2.1v-1.7l-7-4v-5C13.1 3.5 12.7 3 12 3z"/></g></svg>`
    : `<svg viewBox="0 0 24 24"><g transform="translate(12 12) rotate(-20) translate(-12 -12)"><path d="M12 3c-.7 0-1.1.5-1.1 1.2v5l-7 4v1.7l7-2.1v3.5l-2 1.3v1.2l3.1-.8 3.1.8v-1.2l-2-1.3v-3.5l7 2.1v-1.7l-7-4v-5C13.1 3.5 12.7 3 12 3z"/></g></svg>`;

  return `
    <div class="flight-block ${openByDefault?'open':''}" id="${blockId}">
      <div class="flight-block-head" onclick="toggleFlightBlock('${blockId}')">
        <div class="blk-ico">${iconSvg}</div>
        <div class="blk-title">${escapeHtml(headerLabel)}</div>
        <div class="blk-summary">${escapeHtml(collapsedSummary)}</div>
        <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></div>
      </div>
      <div class="flight-block-body">
        <label style="margin-top:0;">Airline</label>
        <div class="lib-section" id="${sectionId}">
          ${summaryHtml}
          <div class="lib-list" id="${sectionId}-list">
            ${renderAirlinePickerListGeneric(airlineId, kind)}
          </div>
        </div>
        <div class="time-row">
          <div>
            <label>Flight number</label>
            <input type="text" id="nd-${idP}-flight-num" placeholder="e.g. AM 502" maxlength="20" value="${escapeHtml(flightNum||'')}">
          </div>
          <div>
            <label>Terminal</label>
            <input type="text" id="nd-${idP}-terminal" placeholder="e.g. T2" maxlength="20" value="${escapeHtml(terminal||'')}">
          </div>
        </div>
        <label>Cost</label>
        ${renderCostRow('nd-' + idP + '-cost', cost, cur, null)}
      </div>
    </div>
  `;
}

  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');

let _pendingLibImageFile = null; // staged for save

function pickLibImage(prefix){
  const inp = document.getElementById('icon-input');
  if(!inp) return;
  inp.value = '';
  inp.onchange = () => {
    const file = inp.files[0];
    if(!file) return;
    if(file.size > 5*1024*1024){ toast('Image too large (5MB max)'); return; }
    _pendingLibImageFile = file;
    const url = URL.createObjectURL(file);
    const preview = document.getElementById(`${prefix}-img-preview`);
    if(preview) preview.innerHTML = `<img src="${url}" alt="">`;
  };
  inp.click();
}

function clearLibImage(prefix){
  _pendingLibImageFile = '__clear__'; // sentinel: remove existing
  const preview = document.getElementById(`${prefix}-img-preview`);
  if(preview) preview.innerHTML = '<span>No image</span>';
}

async function saveAirlineFromEditor(id){
  const nameEl = document.getElementById('al-name');
  const codeEl = document.getElementById('al-code');
  const name = nameEl ? nameEl.value.trim() : '';
  const code = codeEl ? codeEl.value.trim() : '';
  if(!name){ toast('Name required'); return; }

  let target;
  if(id){
    target = _airlines.find(x => x.id === id);
    if(!target){ toast('Not found'); return; }
  } else {
    target = { id: 'al-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6) };
    _airlines.push(target);
  }
  target.name = name;
  target.code = code || null;

  // Handle pending image: '__clear__' removes, File adds/replaces, null leaves alone
  if(_pendingLibImageFile === '__clear__'){
    if(target.imageFileId){
      const oldUrl = _airlineImgUrls.get(target.id);
      if(oldUrl) URL.revokeObjectURL(oldUrl);
      _airlineImgUrls.delete(target.id);
      try { await dbDel('files', target.imageFileId); } catch(_) {}
      target.imageFileId = null;
    }
  } else if(_pendingLibImageFile instanceof File){
    // delete old if any
    if(target.imageFileId){
      const oldUrl = _airlineImgUrls.get(target.id);
      if(oldUrl) URL.revokeObjectURL(oldUrl);
      try { await dbDel('files', target.imageFileId); } catch(_) {}
    }
    const fid = uuid();
    await dbPut('files', { id:fid, blob:_pendingLibImageFile, type:_pendingLibImageFile.type, name:_pendingLibImageFile.name });
    target.imageFileId = fid;
    _airlineImgUrls.set(target.id, URL.createObjectURL(_pendingLibImageFile));
  }
  _pendingLibImageFile = null;
  await saveAirlines();
  toast('Saved');

  // If we just created a new one and a node is being edited, auto-select it
  // on the correct side (arrival/departure) based on the hint we stashed.
  if(!id && _editingNode){
    const kind = window._pendingAirlineKind;
    const t = _editingNode.type;
    if(kind === 'arr' || t === 'airport_arrival') _editingNode.arrivalAirlineId = target.id;
    else if(kind === 'dep' || t === 'airport_departure') _editingNode.departureAirlineId = target.id;
    else if(t === 'airport_both'){
      // No hint and stop is a layover — pick arrival side by default
      _editingNode.arrivalAirlineId = target.id;
    }
    _editingNode.airlineId = null; // clear legacy field
  }
  window._pendingAirlineKind = null;
  if(_editingNode){
    openNodeDetail(_editingNode.id);
  } else {
    openAirlinesLibrary();
  }
}

function confirmDeleteAirline(id){
  const a = _airlines.find(x => x.id === id);
  if(!a) return;
  openModal({
    title:'Delete Airline?',
    body:`<p style="margin:0;font-size:16px;">Remove <strong>"${escapeHtml(a.name)}"</strong> from your airline library? Stops that referenced it will lose the airline link but keep their flight numbers.</p>`,
    actions:[
      {label:'Cancel', onClick: ()=>openAirlineEditor(id)},
      {label:'Delete', cls:'danger', onClick: async ()=>{
        // delete image file if any
        if(a.imageFileId){
          try { await dbDel('files', a.imageFileId); } catch(_) {}
          const url = _airlineImgUrls.get(a.id);
          if(url) URL.revokeObjectURL(url);
          _airlineImgUrls.delete(a.id);
        }
        _airlines = _airlines.filter(x => x.id !== id);
        await saveAirlines();
        toast('Airline removed');
        // Clear references on stops? Leave them alone — they'll just
        // show as "tap to choose" again because the id won't resolve.
        if(_editingNode) openNodeDetail(_editingNode.id);
        else openAirlinesLibrary();
      }}
    ]
  });
}

function exportLibrary(kind){
  const data = kind === 'airlines'
    ? _airlines.map(a => ({ name:a.name, code:a.code }))
    : _hotels.map(h => ({
        name:h.name, chain:h.chain, address:h.address, phone:h.phone,
        email:h.email, website:h.website, notes:h.notes
      }));
  const blob = new Blob([JSON.stringify({ [kind]: data }, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wayfarer-${kind}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported');
}

function importLibrary(kind){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const file = inp.files[0];
    if(!file) return;
    try {
      const txt = await file.text();
      const data = JSON.parse(txt);
      const list = data[kind];
      if(!Array.isArray(list)) throw new Error('Expected key "' + kind + '" as array');
      let added = 0;
      for(const item of list){
        if(!item || !item.name) continue;
        const idPrefix = kind === 'airlines' ? 'al-' : 'ht-';
        const entry = Object.assign(
          { id: idPrefix + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6) + '-' + added },
          item
        );
        delete entry.imageFileId; // imported entries don't bring images
        if(kind === 'airlines') _airlines.push(entry);
        else _hotels.push(entry);
        added++;
      }
      if(kind === 'airlines') await saveAirlines();
      else await saveHotels();
      toast(`Imported ${added} ${kind}`);
      if(kind === 'airlines') openAirlinesLibrary();
      else openHotelsLibrary();
    } catch(e){
      console.error('Import failed:', e);
      toast('Import failed — invalid JSON');
    }
  };
  inp.click();
}

function renderTypeGrid(currentType){
  let html = '';
  // built-in types — each tile gets edit pencil + may show user-overridden image
  for(const [k,v] of Object.entries(NODE_TYPES)){
    const ovUrl = _typeOverrideUrls.get(k);
    const label = (_typeOverrides[k] && _typeOverrides[k].label) || v.label;
    const icoInner = ovUrl
      ? `<img src="${ovUrl}" alt="">`
      : (v.icon || `<span style="font-family:Cinzel;font-size:13px;font-weight:600;">●</span>`);
    const icoClass = ovUrl ? 'ico has-image' : 'ico';
    html += `<div class="type-opt t-${k} ${currentType===k?'selected':''}" data-type="${k}" onclick="pickNodeType('${k}')">
      <div class="edit-btn" onclick="event.stopPropagation();editBuiltinType('${k}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg></div>
      <div class="${icoClass}">${icoInner}</div>
      <div class="nm">${escapeHtml(label)}</div>
    </div>`;
  }
  // custom icons — each gets pencil (edit) and × (delete)
  for(const ic of _customIcons){
    const url = _customIconUrls.get(ic.id) || '';
    const tk = 'custom_' + ic.id;
    html += `<div class="type-opt t-custom ${currentType===tk?'selected':''}" data-type="${tk}" onclick="pickNodeType('${tk}')">
      <div class="edit-btn" onclick="event.stopPropagation();editCustomIcon('${ic.id}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg></div>
      <div class="x" onclick="event.stopPropagation();confirmDeleteCustomIcon('${ic.id}')">×</div>
      <div class="ico has-image"><img src="${url}" alt=""></div>
      <div class="nm">${escapeHtml(ic.label)}</div>
    </div>`;
  }
  // add new tile
  html += `<div class="type-opt add" onclick="uploadCustomIcon()">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="nm">Add icon</div>
  </div>`;
  return html;
}

let _iconPickCb = null;

  // cb(file|null)
  _iconPickCb = cb;
  const inp = document.getElementById('icon-input');
  inp.value = '';
  inp.onchange = () => {

/* =========================================================
   CUSTOM ICONS — upload, rename, delete
   ========================================================= */
function uploadCustomIcon(){
  pickIconFile(file => {
    if(!file) return;
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); return; }
    const defaultLabel = file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,30);
    promptIconLabel('Label Icon', defaultLabel, async (label) => {
      // After label dialog, always re-open node detail to restore handlers
      const nodeId = _editingNode ? _editingNode.id : null;
      if(label === null){
        if(nodeId) openNodeDetail(nodeId);
        return;
      }
      const trimmed = (label || defaultLabel).trim().slice(0,30);
      if(!trimmed){
        if(nodeId) openNodeDetail(nodeId);
        return;
      }
      const fid = uuid();
      await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
      const id = 'icn-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
      _customIcons.push({ id, label: trimmed, fileId: fid });
      _customIconUrls.set(id, URL.createObjectURL(file));
      await saveCustomIcons();
      // Auto-select the new icon for the current node
      if(_editingNode){
        _editingNode.type = 'custom_' + id;
      }
      toast('Icon added');
      if(nodeId) openNodeDetail(nodeId);
    });
  });
}

/* Edit menu for a custom (library) icon: replace image, rename, delete */
function editCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  openSubMenu({
    title: ic.label,
    items: [
      { label:'Replace image',  onClick: () => replaceCustomIconImage(iconId) },
      { label:'Rename',         onClick: () => renameCustomIcon(iconId) },
      { label:'Delete',         danger: true, onClick: () => confirmDeleteCustomIcon(iconId) }
    ]
  });
}

function replaceCustomIconImage(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  pickIconFile(async (file) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(!file){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); if(nodeId) openNodeDetail(nodeId); return; }
    // delete old file blob
    await dbDel('files', ic.fileId);
    const url = _customIconUrls.get(iconId);
    if(url) URL.revokeObjectURL(url);
    // save new
    const fid = uuid();
    await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
    ic.fileId = fid;
    _customIconUrls.set(iconId, URL.createObjectURL(file));
    await saveCustomIcons();
    toast('Image replaced');
    if(nodeId) openNodeDetail(nodeId);
  });
}

function renameCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  promptIconLabel('Rename Icon', ic.label, async (label) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(label === null){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    const trimmed = (label || ic.label).trim().slice(0,30);
    if(trimmed){
      ic.label = trimmed;
      await saveCustomIcons();
      toast('Renamed');
    }
    if(nodeId) openNodeDetail(nodeId);
  });
}

function confirmDeleteCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  openConfirm({
    title:'Delete Icon?',
    body:`Remove <strong>"${escapeHtml(ic.label)}"</strong> from your icon library?<br>
          <span style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);font-size:14px;">
          Stops currently using this icon will fall back to the numbered style.</span>`,
    okLabel:'Delete',
    okClass:'danger',
    onOk: async () => {
      const url = _customIconUrls.get(iconId);
      if(url) URL.revokeObjectURL(url);
      _customIconUrls.delete(iconId);
      await dbDel('files', ic.fileId);
      _customIcons = _customIcons.filter(x => x.id !== iconId);
      await saveCustomIcons();
      if(_editingNode && _editingNode.type === 'custom_' + iconId){
        _editingNode.type = 'stop';
      }
      toast('Icon removed');
    }
  });
}

/* =========================================================
   BUILT-IN TYPE EDITING — replace icon image, rename, reset
   ========================================================= */
function editBuiltinType(typeKey){
  const def = NODE_TYPES[typeKey];
  if(!def) return;
  const hasOverride = !!_typeOverrides[typeKey];
  const label = (hasOverride && _typeOverrides[typeKey].label) || def.label;
  const items = [
    { label: hasOverride ? 'Replace image' : 'Use custom image', onClick: () => replaceBuiltinIcon(typeKey) },
    { label: 'Rename', onClick: () => renameBuiltinType(typeKey) }
  ];
  if(hasOverride){
    items.push({ label: 'Reset to default', danger: true, onClick: () => resetBuiltinType(typeKey) });
  }
  openSubMenu({ title: label, items });
}

function replaceBuiltinIcon(typeKey){
  pickIconFile(async (file) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(!file){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); if(nodeId) openNodeDetail(nodeId); return; }
    // delete old override file if any
    if(_typeOverrides[typeKey]){
      await dbDel('files', _typeOverrides[typeKey].fileId);
      const oldUrl = _typeOverrideUrls.get(typeKey);
      if(oldUrl) URL.revokeObjectURL(oldUrl);
    }
    const fid = uuid();
    await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
    const existingLabel = _typeOverrides[typeKey] ? _typeOverrides[typeKey].label : null;
    _typeOverrides[typeKey] = { fileId: fid, label: existingLabel };
    _typeOverrideUrls.set(typeKey, URL.createObjectURL(file));
    await saveTypeOverrides();
    toast('Icon replaced');
    if(nodeId) openNodeDetail(nodeId);
  });
}

function renameBuiltinType(typeKey){
  const def = NODE_TYPES[typeKey];
  const current = (_typeOverrides[typeKey] && _typeOverrides[typeKey].label) || def.label;
  promptIconLabel('Rename Type', current, async (label) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(label === null){ if(nodeId) openNodeDetail(nodeId); return; }
    const trimmed = (label || current).trim().slice(0,30);
    if(trimmed && trimmed !== def.label){
      if(!_typeOverrides[typeKey]) _typeOverrides[typeKey] = { fileId: null, label: trimmed };
      else _typeOverrides[typeKey].label = trimmed;
      await saveTypeOverrides();
      toast('Renamed');
    } else if(trimmed === def.label && _typeOverrides[typeKey]){
      // reset label to default — keep image override if any
      _typeOverrides[typeKey].label = null;
      if(!_typeOverrides[typeKey].fileId) delete _typeOverrides[typeKey];
      await saveTypeOverrides();
    }
    if(nodeId) openNodeDetail(nodeId);
  });
}

function resetBuiltinType(typeKey){
  openConfirm({
    title: 'Reset to default?',
    body: `Restore the original icon and label for <strong>"${escapeHtml(NODE_TYPES[typeKey].label)}"</strong>?`,
    okLabel: 'Reset',
    okClass: 'danger',
    onOk: async () => {
      const ov = _typeOverrides[typeKey];
      if(ov && ov.fileId) await dbDel('files', ov.fileId);
      const url = _typeOverrideUrls.get(typeKey);
      if(url) URL.revokeObjectURL(url);
      _typeOverrideUrls.delete(typeKey);
      delete _typeOverrides[typeKey];
      await saveTypeOverrides();
      toast('Reset');
    }
  });
}

/* =========================================================
   GENERIC SUB-MODALS — open menu, confirm, prompt
   These all leave node-detail-restoration to themselves: when
   they close, they re-open the node detail so footer buttons
   keep their JS handlers.
   ========================================================= */
function openSubMenu({title, items}){
  const modal = document.getElementById('modal');
  const itemsHtml = items.map((it,i) => `
    <button data-i="${i}" class="${it.danger?'danger':''}">${escapeHtml(it.label)}</button>
  `).join('');
  modal.innerHTML = `
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body">
      <div class="picker-menu">${itemsHtml}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="sm-cancel">Cancel</button>
    </div>`;
  modal.querySelectorAll('.picker-menu button').forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.i, 10);
      // Caller's onClick is responsible for what happens next
      // (it may open another sub-modal or re-open node detail).
      items[i].onClick();
    };
  });
  const cancel = () => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(nodeId) openNodeDetail(nodeId);
    else closeModal();
  };
  document.getElementById('sm-cancel').onclick = cancel;
}

function openConfirm({title, body, okLabel='OK', okClass='primary', onOk}){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body"><p style="margin:0;font-size:16px;">${body}</p></div>
    <div class="modal-foot">
      <button class="btn" id="cf-cancel">Cancel</button>
      <button class="btn ${okClass}" id="cf-ok">${escapeHtml(okLabel)}</button>
    </div>`;
  const back = () => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(nodeId) openNodeDetail(nodeId);
    else closeModal();
  };
  document.getElementById('cf-cancel').onclick = back;
  document.getElementById('cf-ok').onclick = async () => {

  };
}

/* Returns a sensible number to show in the duration input given a duration
   stored in minutes. We pick the largest unit that gives a clean value. */
function nodeDurValue(durMins){
  if(!durMins || durMins <= 0) return '';
  if(durMins % 1440 === 0) return durMins / 1440;
  if(durMins % 60 === 0)   return durMins / 60;
  return durMins;
}
function nodeDurUnit(durMins){
  if(!durMins || durMins <= 0) return 'h'; // default unit when empty
  if(durMins % 1440 === 0) return 'd';
  if(durMins % 60 === 0)   return 'h';
  return 'm';
}
function durToMinutes(val, unit){
  const n = parseFloat(val);
  if(!n || n <= 0) return 0;
  if(unit === 'd') return Math.round(n * 1440);
  if(unit === 'h') return Math.round(n * 60);
  return Math.round(n);
}

/* Currency dropdown — common ISO codes that cover the trips this app
   is built for. The `default` value is the one selected when the field
   is empty (new cost field). */
const CURRENCY_CODES = ['USD','EUR','GBP','RUB','MXN','VND','JPY','CNY','THB','SGD','CAD','AUD','CHF','HKD'];

function renderCurrencyOptions(selected){
  const sel = selected || App.settings.defaultCurrency || 'USD';
  return CURRENCY_CODES.map(c => `<option value="${c}" ${c===sel?'selected':''}>${c}</option>`).join('');
}

/* Build a cost row: amount input + currency dropdown.
   `idPrefix` namespaces the input IDs so multiple cost rows on one
   popup don't collide (e.g. "nd-cost" vs "edge-cost"). */
function renderCostRow(idPrefix, amount, currency, label){
  const lbl = label ? `<label>${escapeHtml(label)}</label>` : '';
  const amt = (amount != null && amount !== '' && !isNaN(amount)) ? amount : '';
  return `
    ${lbl}
    <div class="duration-row">
      <input type="number" id="${idPrefix}-amt" min="0" step="0.01" placeholder="0" value="${amt}">
      <select id="${idPrefix}-cur">${renderCurrencyOptions(currency)}</select>
    </div>
  `;
}

function readCostRow(idPrefix){
  const amtEl = document.getElementById(idPrefix + '-amt');
  const curEl = document.getElementById(idPrefix + '-cur');
  const amt = amtEl && amtEl.value !== '' ? parseFloat(amtEl.value) : null;
  const cur = curEl ? curEl.value : null;
  if(amt == null || isNaN(amt) || amt <= 0) return { amount:null, currency:null };
  return { amount: amt, currency: cur };
}

function formatCost(amount, currency){
  if(amount == null || amount === '' || isNaN(amount) || amount <= 0) return '';
  const cur = currency || 'USD';
  // Compact format: 1500 → "1,500 USD", 1500.5 → "1,500.50 USD"
  const n = Number(amount);
  const formatted = (n % 1 === 0)
    ? n.toLocaleString('en-US', { maximumFractionDigits:0 })
    : n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return `${formatted} ${cur}`;
}

function clearNodeTime(){
  const d = document.getElementById('nd-date');
  const t = document.getElementById('nd-time');

/* Read all form fields from the current popup and write them onto
   _editingNode, dispatching by type. Does not save to disk or close
   the modal — caller handles that. */
async function commitNodeFromForm(){
  if(!_editingNode) return;
  const n = _editingNode;
  n.name        = (document.getElementById('nd-name')?.value || '').trim() || 'Unnamed';
  n.description = document.getElementById('nd-desc')?.value || '';

  const v = id => document.getElementById(id)?.value || '';

  // Date/time fields — different for each type
  switch(n.type){
    case 'airport_arrival':
      n.arrivalDate = v('nd-arr-date') || null;
      n.arrivalTime = v('nd-arr-time') || null;
      // Keep generic date/time fields in sync so the time oval / sorting
      // still works without special cases
      n.date = n.arrivalDate;
      n.time = n.arrivalTime;
      break;
    case 'airport_departure':
      n.departureDate = v('nd-dep-date') || null;
      n.departureTime = v('nd-dep-time') || null;
      n.date = n.departureDate;
      n.time = n.departureTime;
      break;
    case 'airport_both':
      n.arrivalDate = v('nd-arr-date') || null;
      n.arrivalTime = v('nd-arr-time') || null;
      n.departureDate = v('nd-dep-date') || null;
      n.departureTime = v('nd-dep-time') || null;
      // Stay duration field is present in this layout
      n.duration = durToMinutes(v('nd-dur'), v('nd-dur-unit') || 'h');
      // For sorting/oval purposes, prefer arrival time
      n.date = n.arrivalDate || n.departureDate;
      n.time = n.arrivalTime || n.departureTime;
      break;
    case 'hotel':
      n.checkinDate  = v('nd-checkin-date')  || null;
      n.checkinTime  = v('nd-checkin-time')  || null;
      n.checkoutDate = v('nd-checkout-date') || null;
      n.checkoutTime = v('nd-checkout-time') || null;
      // Auto-compute duration (in minutes) from check-in/out if both set
      n.duration = computeHotelDurationMins(n) || 0;
      n.date = n.checkinDate;
      n.time = n.checkinTime;
      break;
    case 'train_arrival':
      n.arrivalDate = v('nd-arr-date') || null;
      n.arrivalTime = v('nd-arr-time') || null;
      n.date = n.arrivalDate;
      n.time = n.arrivalTime;
      break;
    case 'train_departure':
      n.departureDate = v('nd-dep-date') || null;
      n.departureTime = v('nd-dep-time') || null;
      n.date = n.departureDate;
      n.time = n.departureTime;
      break;
    default:
      n.date = v('nd-date') || null;
      n.time = v('nd-time') || null;
      n.duration = durToMinutes(v('nd-dur'), v('nd-dur-unit') || 'h');
      break;
  }

  // Flight fields: arrival side (used for airport_arrival, airport_both)
  if(n.type === 'airport_arrival' || n.type === 'airport_both'){
    n.arrivalFlightNumber = v('nd-arr-flight-num').trim() || null;
    n.arrivalTerminal     = v('nd-arr-terminal').trim() || null;
    const cost = readCostRow('nd-arr-cost');
    n.arrivalCost = cost.amount;
    n.arrivalCostCurrency = cost.currency;
  }
  // Departure side (used for airport_departure, airport_both)
  if(n.type === 'airport_departure' || n.type === 'airport_both'){
    n.departureFlightNumber = v('nd-dep-flight-num').trim() || null;
    n.departureTerminal     = v('nd-dep-terminal').trim() || null;
    const cost = readCostRow('nd-dep-cost');
    n.departureCost = cost.amount;
    n.departureCostCurrency = cost.currency;
  }
  // Hotel-specific
  if(n.type === 'hotel'){
    const conf  = document.getElementById('nd-hotel-conf');
    const room  = document.getElementById('nd-hotel-room');
    const notes = document.getElementById('nd-hotel-notes');
    n.hotelConfirmation = conf?.value.trim() || null;
    n.hotelRoom         = room?.value.trim() || null;
    n.hotelStayNotes    = notes?.value.trim() || null;
    const cost = readCostRow('nd-cost');
    n.cost = cost.amount;
    n.costCurrency = cost.currency;
  }
}

/* Compute the duration (minutes) between hotel check-in and check-out. */
function computeHotelDurationMins(n){
  if(!n.checkinDate || !n.checkoutDate) return 0;
  const inMin  = minutesFromTime(n.checkinTime)  || 0;
  const outMin = minutesFromTime(n.checkoutTime) || 0;
  const dayDiff = daysBetween(n.checkinDate, n.checkoutDate);
  const total = dayDiff * 1440 + (outMin - inMin);
  return total > 0 ? total : 0;
}

async function viewFile(fid){
  const meta=_editingNode.files.find(x=>x.id===fid);
  const f=await dbGet('files',fid);
  if(!f){toast('File missing');return;}
  const url=URL.createObjectURL(f.blob);
  const fv=document.getElementById('file-viewer');
  const body=document.getElementById('fv-body');
  document.getElementById('fv-name').textContent=meta?meta.name:f.name;
  body.innerHTML='';
  const e=ext(f.name).toLowerCase();
  if(['jpg','jpeg','png','gif','webp'].includes(e) || (f.type||'').startsWith('image/')){
    // Build a zoomable image surface: pinch to zoom, drag to pan,
    // double-tap to toggle between fit and 2x.
    const wrap = document.createElement('div');
    wrap.className = 'fv-zoom-wrap';
    const img = document.createElement('img');
    img.className = 'fv-zoom-img';
    img.src = url;
    wrap.appendChild(img);
    body.appendChild(wrap);
    // Add a "Reset" badge for when the user wants to recenter
    const badge = document.createElement('div');
    badge.className = 'fv-zoom-badge';
    badge.textContent = 'Reset zoom';
    badge.onclick = () => resetImgZoom();
    body.appendChild(badge);
    // Wait for the image to load so we know its dimensions
    img.onload = () => attachImageZoom(wrap, img, badge);
  }else if(e==='pdf' || f.type==='application/pdf'){
    const ifr=document.createElement('iframe');
    ifr.src=url;
    body.appendChild(ifr);
  }else if(e==='txt' || (f.type||'').startsWith('text/')){
    const txt=await f.blob.text();
    const pre=document.createElement('pre');
    pre.textContent=txt;
    body.appendChild(pre);
  }else{
    // download fallback
    const a=document.createElement('a');
    a.href=url;a.download=f.name;a.click();
    toast('Downloading');
    URL.revokeObjectURL(url);
    return;
  }
  fv._url=url;
  fv.classList.add('active');
}

/* Image zoom state (just for the currently open viewer). */
let _zoomState = null;

function attachImageZoom(wrap, img, badge){
  // We keep all state in a single object so resetImgZoom() can poke it.
  const state = {
    scale: 1, baseScale: 1,
    tx: 0, ty: 0,                 // current translate in pixels
    pinchStartDist: 0,
    pinchStartScale: 1,
    pinchCenterX: 0, pinchCenterY: 0,
    panStartX: 0, panStartY: 0,
    panStartTx: 0, panStartTy: 0,
    panning: false,
    lastTapTime: 0,
    wrap, img, badge,
    minScale: 1,
    maxScale: 5
  };
  _zoomState = state;

  // Apply the initial fit-to-screen scale by reading the image's natural
  // size once it has loaded and the wrap is sized.
  const fit = () => {
    const wrapRect = wrap.getBoundingClientRect();
    const iw = img.naturalWidth || 1;
    const ih = img.naturalHeight || 1;
    state.baseScale = Math.min(wrapRect.width / iw, wrapRect.height / ih);
    state.scale = state.baseScale;
    state.minScale = state.baseScale;
    // Center the image
    state.tx = (wrapRect.width  - iw * state.scale) / 2;
    state.ty = (wrapRect.height - ih * state.scale) / 2;
    applyTransform(state);
  };
  fit();

  const dist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  const center = (t1, t2) => ({ x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 });

  wrap.ontouchstart = ev => {
    if(ev.touches.length === 2){
      // Begin pinch
      state.panning = false;
      state.pinchStartDist = dist(ev.touches[0], ev.touches[1]);
      state.pinchStartScale = state.scale;
      const c = center(ev.touches[0], ev.touches[1]);
      const r = wrap.getBoundingClientRect();
      state.pinchCenterX = c.x - r.left;
      state.pinchCenterY = c.y - r.top;
    } else if(ev.touches.length === 1){
      // Begin pan (only useful when zoomed in)
      state.panning = true;
      state.panStartX = ev.touches[0].clientX;
      state.panStartY = ev.touches[0].clientY;
      state.panStartTx = state.tx;
      state.panStartTy = state.ty;
      // double-tap detection
      const now = Date.now();
      if(now - state.lastTapTime < 280){
        // double-tap: toggle between fit and 2x near the tap point
        const r = wrap.getBoundingClientRect();
        const tx = ev.touches[0].clientX - r.left;
        const ty = ev.touches[0].clientY - r.top;
        if(state.scale > state.baseScale * 1.05){
          fit();
        } else {
          zoomAt(state, state.baseScale * 2.5, tx, ty);
        }
        state.lastTapTime = 0;
        ev.preventDefault();
      } else {
        state.lastTapTime = now;
      }
    }
  };
  wrap.ontouchmove = ev => {
    if(ev.touches.length === 2){
      ev.preventDefault();
      const d = dist(ev.touches[0], ev.touches[1]);
      const newScale = Math.max(
        state.minScale * 0.9,
        Math.min(state.maxScale, state.pinchStartScale * (d / state.pinchStartDist))
      );
      zoomAt(state, newScale, state.pinchCenterX, state.pinchCenterY);
    } else if(ev.touches.length === 1 && state.panning && state.scale > state.baseScale * 1.01){
      ev.preventDefault();
      const dx = ev.touches[0].clientX - state.panStartX;
      const dy = ev.touches[0].clientY - state.panStartY;
      state.tx = state.panStartTx + dx;
      state.ty = state.panStartTy + dy;
      applyTransform(state);
    }
  };
  wrap.ontouchend = ev => {
    if(ev.touches.length === 0){
      state.panning = false;
      // If pinch ended below base scale, snap back to fit
      if(state.scale < state.minScale){
        state.scale = state.minScale;
        applyTransform(state);
      }
    }
  };
  wrap.ontouchcancel = () => { state.panning = false; };

  // Mouse fallback for testing on desktop
  wrap.onwheel = ev => {
    ev.preventDefault();
    const r = wrap.getBoundingClientRect();
    const cx = ev.clientX - r.left;
    const cy = ev.clientY - r.top;
    const newScale = Math.max(
      state.minScale * 0.9,
      Math.min(state.maxScale, state.scale * (ev.deltaY < 0 ? 1.15 : 0.85))
    );
    zoomAt(state, newScale, cx, cy);
  };
}

/* Scale around a focal point (cx, cy) measured in wrap-local pixels.
   This keeps the point under the user's fingers (or cursor) anchored
   visually as the image scales. */
function zoomAt(state, newScale, cx, cy){
  const k = newScale / state.scale;
  state.tx = cx - (cx - state.tx) * k;
  state.ty = cy - (cy - state.ty) * k;
  state.scale = newScale;
  applyTransform(state);
}

function applyTransform(state){
  state.img.style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
  // Show/hide the reset badge based on whether we're meaningfully zoomed
  const zoomed = state.scale > state.baseScale * 1.02;
  state.badge.classList.toggle('show', zoomed);
}

function resetImgZoom(){
  if(!_zoomState) return;
  // Recompute fit (handles potential rotation / resize)
  const wrapRect = _zoomState.wrap.getBoundingClientRect();
  const iw = _zoomState.img.naturalWidth || 1;
  const ih = _zoomState.img.naturalHeight || 1;
  _zoomState.baseScale = Math.min(wrapRect.width / iw, wrapRect.height / ih);
  _zoomState.minScale = _zoomState.baseScale;
  _zoomState.scale = _zoomState.baseScale;
  _zoomState.tx = (wrapRect.width  - iw * _zoomState.scale) / 2;
  _zoomState.ty = (wrapRect.height - ih * _zoomState.scale) / 2;
  applyTransform(_zoomState);
}

function showItinerary(){
  const j = App.active;
  if(!j){ toast('No active journey'); return; }
  openModal({
    title: 'Itinerary',
    body: renderItineraryBody(j),
    actions:[{label:'Close', cls:'primary', onClick:closeModal}]
  });

function renderItineraryBody(j){
  if(!j.nodes || j.nodes.length === 0){
    return `<p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);text-align:center;padding:20px 0;font-size:15px;">No stops yet.</p>`;
  }

  // Sort: stops with date+time first (chronologically), undated last (in canvas order)
  const dated = j.nodes
    .filter(n => n.date)
    .slice()
    .sort((a,b) => {
      const dateCmp = a.date.localeCompare(b.date);
      if(dateCmp !== 0) return dateCmp;
      const ta = minutesFromTime(a.time);
      const tb = minutesFromTime(b.time);
      if(ta == null && tb == null) return 0;
      if(ta == null) return 1;
      if(tb == null) return -1;
      return ta - tb;
    });
  const undated = j.nodes.filter(n => !n.date);

  let html = '';
  let lastDate = null;
  for(const n of dated){
    // Day separator
    if(n.date !== lastDate){
      const d = parseISODate(n.date);
      const dayLbl = d ? `${d.getDate()} ${fmtMonthShort(d)} ${d.getFullYear()}` : n.date;
      html += `<div class="iti-day-sep">${escapeHtml(dayLbl)}</div>`;
      lastDate = n.date;
    }
    html += renderItineraryItem(n);
  }
  if(undated.length){
    html += `<div class="iti-day-sep iti-day-undated">No date set</div>`;
    for(const n of undated){
      html += renderItineraryItem(n);
    }
  }
  return `<div class="iti-list">${html}</div>`;
}

function renderItineraryItem(n){
  const info = getNodePinInfo(n.type || 'stop', '');
  const typeLbl = getTypeLabel(n.type || 'stop');
  // Build lines of detail based on type
  const lines = [];
  if(n.time) lines.push(`<strong>${escapeHtml(n.time)}</strong>`);
  if(n.description) lines.push(escapeHtml(n.description));
  if(n.type === 'hotel'){
    const hotel = n.hotelId ? _hotels.find(h => h.id === n.hotelId) : null;
    if(hotel){
      lines.push(`Hotel: ${escapeHtml(hotel.name)}${hotel.chain ? ' · ' + escapeHtml(hotel.chain) : ''}`);
      if(hotel.phone)   lines.push(`Phone: ${escapeHtml(hotel.phone)}`);
      if(hotel.address) lines.push(`${escapeHtml(hotel.address)}`);
    }
    if(n.hotelConfirmation) lines.push(`Confirmation: ${escapeHtml(n.hotelConfirmation)}`);
    if(n.hotelRoom) lines.push(`Room: ${escapeHtml(n.hotelRoom)}`);
    if(n.checkoutDate || n.checkoutTime){
      const d = n.checkoutDate ? parseISODate(n.checkoutDate) : null;
      const dStr = d ? `${d.getDate()} ${fmtMonthShort(d)}` : '';
      lines.push(`Check-out: ${dStr}${n.checkoutTime ? ' ' + n.checkoutTime : ''}`);
    }
    if(n.cost) lines.push(`Cost: ${formatCost(n.cost, n.costCurrency)}`);
  }
  if(n.type === 'airport_arrival' || n.type === 'airport_both'){
    const arr = (n.arrivalAirlineId && _airlines.find(a => a.id === n.arrivalAirlineId)) ||
                (n.airlineId && _airlines.find(a => a.id === n.airlineId));
    if(arr){
      const fn = n.arrivalFlightNumber || n.flightNumber;
      lines.push(`Arrival: ${escapeHtml(arr.name)}${fn ? ' · ' + escapeHtml(fn) : ''}${n.arrivalTerminal ? ' · T' + escapeHtml(n.arrivalTerminal) : ''}`);
    }
    if(n.arrivalCost) lines.push(`Arrival cost: ${formatCost(n.arrivalCost, n.arrivalCostCurrency)}`);
  }
  if(n.type === 'airport_departure' || n.type === 'airport_both'){
    const dep = (n.departureAirlineId && _airlines.find(a => a.id === n.departureAirlineId)) ||
                (n.airlineId && _airlines.find(a => a.id === n.airlineId));
    if(dep){
      const fn = n.departureFlightNumber || n.flightNumber;
      lines.push(`Departure: ${escapeHtml(dep.name)}${fn ? ' · ' + escapeHtml(fn) : ''}${n.departureTerminal ? ' · T' + escapeHtml(n.departureTerminal) : ''}`);
    }
    if(n.departureDate || n.departureTime){
      const d = n.departureDate ? parseISODate(n.departureDate) : null;
      const dStr = d ? `${d.getDate()} ${fmtMonthShort(d)}` : '';
      lines.push(`Departure: ${dStr}${n.departureTime ? ' ' + n.departureTime : ''}`);
    }
    if(n.departureCost) lines.push(`Departure cost: ${formatCost(n.departureCost, n.departureCostCurrency)}`);
  }
  if(n.duration && n.duration > 0 && n.type !== 'hotel'){
    lines.push(`Stay: ${formatDuration(n.duration)}`);
  }
  if((n.files||[]).length){
    lines.push(`${n.files.length} document${n.files.length===1?'':'s'} attached`);
  }
  const linesHtml = lines.map(l => `<div class="iti-line">${l}</div>`).join('');

  return `
    <div class="iti-item" onclick="closeModal();openNodeDetail('${n.id}')">
      <div class="iti-ico ${info.pinClass} ${info.isImage?'has-image':''}">${info.innerHtml}</div>
      <div class="iti-body">
        <div class="iti-head">
          <div class="iti-name">${escapeHtml(n.name)}</div>
          <div class="iti-type">${escapeHtml(typeLbl)}</div>
        </div>
        ${linesHtml}
      </div>
    </div>
  `;
}

/* =========================================================
   MODAL FRAMEWORK
   ========================================================= */
let _modalClose=null;
function openModal({title,body,actions,onClose}){
  const back=document.getElementById('modal-back');
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body scrollarea">${body}</div>
    <div class="modal-foot" id="modal-actions"></div>`;
  const acts=document.getElementById('modal-actions');
  actions.forEach((a,i)=>{
    // Allow either a normal action object {label, cls?, onClick}
    // or a raw HTMLElement to drop in as-is (used for the Type chip).
    if(a instanceof HTMLElement){
      acts.appendChild(a);
      return;
    }
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'');
    b.textContent=a.label;
    b.onclick=a.onClick;
    acts.appendChild(b);
  });
  _modalClose=onClose||null;
  back.classList.add('active');
}

function closeModal(){
  document.getElementById('modal-back').classList.remove('active');
  if(_modalClose){_modalClose();_modalClose=null;}
}

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener('resize',()=>{
  if(App.active){
    sizeStage();
    renderCanvas();
  }
});

/* Single boot function so we can run it from either DOMContentLoaded
   or immediately if the DOM is already ready, without duplicating
   the try/catch. Storage failures (e.g. in restricted iframes) are
   logged but never block the UI from rendering. */
async function boot(){
  try { await openDB(); }
  catch(e){ console.warn('openDB failed:', e); toast('Storage unavailable — data won\'t persist'); }
  try { await loadSettings(); } catch(e){ console.warn('loadSettings failed:', e); }
  try { await loadCustomIcons(); } catch(e){ console.warn('loadCustomIcons failed:', e); }
  try { await loadLibraries(); } catch(e){ console.warn('loadLibraries failed:', e); }
  try { await refreshHome(); } catch(e){ console.warn('refreshHome failed:', e); }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

// Register service worker for offline support and PWA install.
// Failure is non-fatal — the app still runs without offline support.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
