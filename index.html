<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c1810">
<title>Wayfarer · Journey Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ebd7;
  --paper-deep:#ebdfc1;
  --paper-shadow:#d9c89a;
  --ink:#2c1810;
  --ink-soft:#5a3a26;
  --ink-muted:#8b7355;
  --gold:#b8860b;
  --gold-deep:#8a6508;
  --rust:#8b2c1d;
  --rust-deep:#6b1f12;
  --sage:#5d6e4a;
  --shadow:rgba(44,24,16,.18);
  --shadow-strong:rgba(44,24,16,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:'EB Garamond',Georgia,serif;
  font-size:17px;
  line-height:1.5;
  color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(ellipse at top left, rgba(184,134,11,.08), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(139,44,29,.06), transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 100px, rgba(139,115,85,.02) 100px, rgba(139,115,85,.02) 101px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .15 0 0 0 0 .06 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

/* ---------- Screens ---------- */
.screen{
  position:fixed; inset:0;
  display:none; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.screen.active{display:flex;}

/* ---------- Top Bar ---------- */
.topbar{
  display:flex;align-items:center;
  padding:14px 16px 12px;
  border-bottom:1px solid rgba(44,24,16,.12);
  background:linear-gradient(180deg, rgba(44,24,16,.03), transparent);
}
.topbar h1{
  margin:0;flex:1;
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:18px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
  text-align:center;
}
.iconbtn{
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;
  color:var(--ink);
  cursor:pointer;border-radius:50%;
  transition:background .2s;
}
.iconbtn:active{background:rgba(44,24,16,.08);}
.iconbtn svg{width:22px;height:22px;}

/* ---------- Home Screen ---------- */
#home{align-items:center;justify-content:center;padding:24px;}
.home-wrap{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;align-items:center;
  animation:fadein .6s ease;
}
.compass{
  width:120px;height:120px;
  margin-bottom:18px;
  animation:rotate-slow 60s linear infinite;
}
.brand{
  font-family:'Cinzel',serif;
  font-size:34px;font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  margin:0 0 4px;
  text-align:center;
}
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:18px;
  color:var(--ink-soft);
  margin:0 0 32px;
  text-align:center;
}
.divider{
  width:60%;height:1px;
  background:linear-gradient(90deg, transparent, var(--ink-muted), transparent);
  margin:0 0 28px;
  position:relative;
}
.divider::after{
  content:'✦';
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:var(--paper);
  padding:0 10px;
  color:var(--gold);
  font-size:14px;
}
.menu{
  width:100%;display:flex;flex-direction:column;gap:14px;
}
.menubtn{
  width:100%;
  padding:18px 22px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  font-family:'Cinzel',serif;
  font-weight:500;
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  display:flex;align-items:center;gap:14px;
  position:relative;
  box-shadow:0 2px 0 var(--paper-shadow), 0 4px 12px var(--shadow);
  transition:transform .15s, box-shadow .15s;
}
.menubtn:active{
  transform:translateY(2px);
  box-shadow:0 0 0 var(--paper-shadow), 0 2px 6px var(--shadow);
}
.menubtn svg{width:22px;height:22px;flex-shrink:0;color:var(--rust);}
.menubtn.disabled{opacity:.45;pointer-events:none;}
.menubtn .sub{
  display:block;
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-weight:400;
  font-size:13px;
  letter-spacing:0;
  text-transform:none;
  color:var(--ink-soft);
  margin-top:2px;
}

.foot{
  margin-top:32px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:var(--ink-muted);
  text-align:center;
  opacity:.7;
}

/* ---------- Archive ---------- */
.archive-list{flex:1;overflow-y:auto;padding:8px 16px 24px;}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-muted);
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:18px;
}
.empty .ico{font-size:48px;color:var(--gold);margin-bottom:12px;display:block;}
.j-card{
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-left:3px solid var(--rust);
  border-radius:2px;
  padding:16px 18px;
  margin-bottom:12px;
  box-shadow:0 1px 0 var(--paper-shadow), 0 3px 8px var(--shadow);
  position:relative;
}
.j-card.active-j{border-left-color:var(--gold);background:linear-gradient(180deg, var(--paper-deep), rgba(184,134,11,.08));}
.j-card .badge{
  position:absolute;top:10px;right:12px;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;
  padding:3px 7px;background:var(--gold);color:var(--paper);
  border-radius:1px;text-transform:uppercase;
}
.j-card h3{
  margin:0 0 6px;
  font-family:'Cinzel',serif;
  font-weight:500;font-size:16px;
  letter-spacing:.05em;
  padding-right:60px;
  word-wrap:break-word;
}
.j-card .meta{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:var(--ink-muted);
  margin-bottom:12px;
}
.j-card .meta strong{color:var(--ink-soft);font-weight:500;font-style:normal;}
.j-actions{display:flex;flex-wrap:wrap;gap:6px;}
.j-actions button{
  flex:0 1 auto;
  padding:8px 12px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--ink-muted);
  border-radius:1px;
  color:var(--ink);
  cursor:pointer;
}
.j-actions button:active{background:rgba(44,24,16,.06);}
.j-actions button.danger{border-color:var(--rust);color:var(--rust);}
.j-actions button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---------- Journey Canvas ---------- */
#journey{display:none;}
#journey.active{display:flex;}
.canvas-wrap{
  flex:1;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--paper-deep);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(139,115,85,.07) 23px, rgba(139,115,85,.07) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(139,115,85,.07) 23px, rgba(139,115,85,.07) 24px);
  /* allow native vertical pan, block horizontal */
  touch-action:pan-y;
  overscroll-behavior:contain;
  /* leave room at the bottom so the floating toolbar doesn't hide content */
  padding-bottom:90px;
}
/* the stage holds all positioned content; width = wrap width, height = computed */
.canvas-stage{
  position:relative;
  width:100%;
  /* height set by JS via --stage-h CSS variable */
  height:var(--stage-h, 100%);
  min-height:100%;
}
.canvas-bg{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  display:block;
  opacity:.9;
  filter:sepia(.12) contrast(.96);
}
.canvas-svg{
  position:absolute;top:0;left:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}
.canvas-svg .canvas-edge,
.canvas-svg .canvas-edge-hit,
.canvas-svg .edge-label,
.canvas-svg .edge-label-bg{
  pointer-events:auto;
}
.canvas-edge{
  fill:none;
  opacity:.9;
  cursor:pointer;
  stroke-linejoin:round;
  /* default = walk */
  stroke:var(--sage);
  stroke-width:2.4;
  stroke-dasharray:1 5;
  stroke-linecap:round;
}
.canvas-edge.walk{
  stroke:var(--sage);
  stroke-width:2.4;
  stroke-dasharray:1 5;
  stroke-linecap:round;
}
.canvas-edge.taxi{
  stroke:#c8950b;
  stroke-width:2.6;
  stroke-dasharray:9 5;
  stroke-linecap:butt;
}
.canvas-edge.bus{
  stroke:#2c5560;
  stroke-width:3;
  stroke-dasharray:none;
  stroke-linecap:round;
}
.canvas-edge.train{
  stroke:var(--rust-deep);
  stroke-width:4.5;
  stroke-dasharray:2 7;
  stroke-linecap:butt;
}
.canvas-edge.combination{
  stroke:var(--ink);
  stroke-width:2.5;
  stroke-dasharray:11 3 2 3;
  stroke-linecap:butt;
}
/* edge label */
.edge-label{
  fill:var(--paper);
  stroke:none;
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.1em;
  text-anchor:middle;
  font-weight:600;
  text-transform:uppercase;
}
.edge-label-bg{
  fill:var(--ink);
  stroke:none;
  rx:2;
}
.canvas-edge-hit{
  stroke:transparent;
  stroke-width:24;
  fill:none;
  cursor:pointer;
}
.canvas-node{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.canvas-node.dragging{cursor:grabbing;z-index:100;}
.canvas-node.connecting{animation:pulse 1s ease infinite;}
/* Pin size — controlled via CSS vars on canvas-stage. Sizes tuned for
   ~412px phone width.
   Medium: ~5 fit horizontally with spacing, ~7-8 vertically.
   Compact: ~6-7 horizontally, ~10 vertically.
   Large: ~4 horizontally, ~5-6 vertically. */
.canvas-stage{
  --pin-size:62px;
  --pin-icon-size:38px;
  --pin-num-size:18px;
  --pin-border:3px;
  --pin-badge-size:12px;
  --pin-label-font:11px;
  --pin-label-max:130px;
}
.canvas-stage[data-pin-size="compact"]{
  --pin-size:48px;
  --pin-icon-size:30px;
  --pin-num-size:15px;
  --pin-border:2.5px;
  --pin-badge-size:10px;
  --pin-label-font:10px;
  --pin-label-max:100px;
}
.canvas-stage[data-pin-size="medium"]{
  --pin-size:62px;
  --pin-icon-size:38px;
  --pin-num-size:18px;
  --pin-border:3px;
  --pin-badge-size:12px;
  --pin-label-font:11px;
  --pin-label-max:130px;
}
.canvas-stage[data-pin-size="large"]{
  --pin-size:88px;
  --pin-icon-size:54px;
  --pin-num-size:24px;
  --pin-border:3.5px;
  --pin-badge-size:15px;
  --pin-label-font:12px;
  --pin-label-max:160px;
}
.node-pin{
  width:var(--pin-size);
  height:var(--pin-size);
  background:var(--rust);
  border:var(--pin-border) solid var(--paper);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--rust), 0 6px 14px var(--shadow-strong);
  display:flex;align-items:center;justify-content:center;
  color:var(--paper);
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:var(--pin-num-size);
  position:relative;
  overflow:hidden;
}
.node-pin svg{
  width:var(--pin-icon-size);
  height:var(--pin-icon-size);
  color:var(--paper);
  fill:currentColor;
  stroke:currentColor;
}
.node-pin img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  display:block;
}
.node-pin.t-airport_arrival,
.node-pin.t-airport_departure{ background:#2c5560; box-shadow:0 0 0 2px #2c5560, 0 6px 14px var(--shadow-strong); }
.node-pin.t-hotel{ background:var(--gold-deep); box-shadow:0 0 0 2px var(--gold-deep), 0 6px 14px var(--shadow-strong); }
.node-pin.t-train_arrival,
.node-pin.t-train_departure{ background:var(--rust-deep); box-shadow:0 0 0 2px var(--rust-deep), 0 6px 14px var(--shadow-strong); }
.node-pin.t-custom{
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 0 0 2px var(--ink-soft), 0 6px 14px var(--shadow-strong);
}
/* When pin shows a user image, drop the colored ring entirely so the
   artwork is the whole pin — important for pre-designed circular icons. */
.node-pin.has-image{
  background:transparent;
  border-color:transparent;
  box-shadow:0 6px 14px var(--shadow-strong);
}
.canvas-node.selected .node-pin.has-image{
  background:transparent;
  box-shadow:0 0 0 4px var(--gold), 0 0 0 8px rgba(184,134,11,.3), 0 6px 14px var(--shadow-strong);
}
.node-pin.has-files::after{
  content:'';
  position:absolute;top:0;right:0;
  width:var(--pin-badge-size);
  height:var(--pin-badge-size);
  background:var(--gold);
  border:2px solid var(--paper);
  border-radius:50%;
  z-index:2;
}
.canvas-node.selected .node-pin{
  background:var(--gold);
  box-shadow:0 0 0 2px var(--gold), 0 0 0 7px rgba(184,134,11,.3), 0 6px 14px var(--shadow-strong);
}
.node-label{
  font-size:var(--pin-label-font);
  max-width:var(--pin-label-max);
}

/* edit pencil on type tiles */
.type-opt .edit-btn{
  position:absolute;top:-6px;left:-6px;
  width:22px;height:22px;
  background:var(--ink);color:var(--paper);
  border:2px solid var(--paper);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:2;
  box-shadow:0 1px 3px var(--shadow);
}
.type-opt .edit-btn:active{background:var(--rust);}
.type-opt .edit-btn svg{width:11px;height:11px;}
/* image-style ico for tiles where icon is a user image */
.type-opt .ico.has-image{
  background:transparent;
  border:none;
  overflow:hidden;
}
.type-opt .ico.has-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* path flow animations */
@keyframes flow-walk { to { stroke-dashoffset: -12; } }
@keyframes flow-taxi { to { stroke-dashoffset: -28; } }
@keyframes flow-bus  { to { stroke-dashoffset: -38; } }
@keyframes flow-train{ to { stroke-dashoffset: -18; } }
@keyframes flow-combination { to { stroke-dashoffset: -38; } }
.canvas-edge.animated.walk        { animation: flow-walk 1.6s linear infinite; }
.canvas-edge.animated.taxi        { animation: flow-taxi 1.8s linear infinite; }
.canvas-edge.animated.bus         { animation: flow-bus 2.4s linear infinite; stroke-dasharray: 32 6; }
.canvas-edge.animated.train       { animation: flow-train 1.1s linear infinite; }
.canvas-edge.animated.combination { animation: flow-combination 2.6s linear infinite; }

/* note pins on canvas */
.canvas-note-pin{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:5;
}
.canvas-note-pin.dragging{cursor:grabbing;z-index:120;}
.note-shape{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
}
.note-shape svg{width:100%;height:100%;}
/* empty note: small parchment paper icon */
.note-shape.empty .note-paper{
  fill:var(--paper);
  stroke:var(--ink-soft);
  stroke-width:1.4;
}
.note-shape.empty .note-pencil{
  fill:var(--ink-soft);
}
/* filled note: yellow warning triangle */
.note-shape.filled .tri{
  fill:#f5c518;
  stroke:var(--ink);
  stroke-width:1.4;
  stroke-linejoin:round;
}
.note-shape.filled .bang{
  fill:var(--ink);
}
.canvas-note-pin.selected .note-shape{
  filter:drop-shadow(0 0 0 3px rgba(184,134,11,.5)) drop-shadow(0 3px 5px rgba(0,0,0,.4));
}
.canvas-note-pin.dragging .note-shape{
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
  transform:scale(1.1);
}

/* note placement crosshair when in note-mode */
.canvas-wrap.note-mode{cursor:crosshair;}

/* note popup textarea */
.note-textarea{
  width:100%;
  min-height:160px;
  padding:14px 16px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  font-family:'EB Garamond',serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  resize:vertical;
  background-image:repeating-linear-gradient(
    180deg,
    transparent,
    transparent 23px,
    rgba(139,115,85,.18) 23px,
    rgba(139,115,85,.18) 24px
  );
  background-attachment:local;
}
.note-textarea:focus{
  outline:none;
  border-color:var(--rust);
  box-shadow:0 0 0 2px rgba(139,44,29,.18);
}

/* collapsible Type section */
.collapsible{
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  background:var(--paper-deep);
  margin-top:6px;
  overflow:hidden;
}
.collapsible-head{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
}
.collapsible-head:active{background:rgba(44,24,16,.05);}
.collapsible-head .preview-ico{
  width:34px;height:34px;flex-shrink:0;
  border-radius:50%;
  background:var(--rust);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.collapsible-head .preview-ico svg{width:20px;height:20px;color:var(--paper);fill:currentColor;stroke:currentColor;}
.collapsible-head .preview-ico img{width:100%;height:100%;object-fit:contain;}
.collapsible-head .preview-ico.has-image{background:transparent;border:1px solid var(--ink-muted);}
.collapsible-head.t-airport_arrival .preview-ico,
.collapsible-head.t-airport_departure .preview-ico{ background:#2c5560; }
.collapsible-head.t-hotel .preview-ico{ background:var(--gold-deep); }
.collapsible-head.t-train_arrival .preview-ico,
.collapsible-head.t-train_departure .preview-ico{ background:var(--rust-deep); }
.collapsible-head .preview-info{flex:1;min-width:0;}
.collapsible-head .preview-info .lbl-tiny{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.collapsible-head .preview-info .nm{
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
  margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.collapsible-head .chev{
  flex-shrink:0;
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
  transition:transform .25s ease;
}
.collapsible-head .chev svg{width:14px;height:14px;}
.collapsible.open .chev{transform:rotate(180deg);}
.collapsible-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.collapsible.open .collapsible-body{
  max-height:600px;
}
.collapsible-body .pad{padding:10px 12px 14px;}

/* type picker grid */
.type-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:6px;
}
.type-opt{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  cursor:pointer;
  transition:all .15s;
  position:relative;
}
.type-opt.selected{
  border-color:var(--rust);
  background:#fff7e0;
  box-shadow:0 0 0 1px var(--rust);
}
.type-opt:active{transform:scale(.96);}
.type-opt .ico{
  width:42px;height:42px;
  border-radius:50%;
  background:var(--rust);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.type-opt .ico svg{width:26px;height:26px;}
.type-opt .ico img{width:88%;height:88%;object-fit:contain;}
.type-opt.t-airport_arrival .ico, .type-opt.t-airport_departure .ico{ background:#2c5560; }
.type-opt.t-hotel .ico{ background:var(--gold-deep); }
.type-opt.t-train_arrival .ico, .type-opt.t-train_departure .ico{ background:var(--rust-deep); }
.type-opt.t-custom .ico{ background:var(--paper); border:1px solid var(--ink-muted); }
.type-opt .nm{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.2;
}
.type-opt .x{
  position:absolute;top:-6px;right:-6px;
  width:22px;height:22px;
  background:var(--rust);color:var(--paper);
  border:2px solid var(--paper);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;
  cursor:pointer;
  font-family:'EB Garamond',serif;
  font-weight:600;
  z-index:2;
}
.type-opt .x:active{background:var(--rust-deep);}
.type-opt.add{
  background:transparent;
  border:1.5px dashed var(--ink-muted);
}
.type-opt.add .ico{
  background:transparent;
  border:1.5px dashed var(--ink-muted);
  color:var(--ink-muted);
}

/* travel mode picker */
.mode-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.mode-opt{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  cursor:pointer;
}
.mode-opt.selected{
  border-color:var(--ink);
  background:#fff7e0;
  box-shadow:0 0 0 1px var(--ink);
}
.mode-opt:active{background:#f0e4c4;}
.mode-opt .micon{width:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.mode-opt .micon svg{width:26px;height:26px;}
.mode-opt .mtxt{flex:1;}
.mode-opt .mtxt .nm{
  font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
}
.mode-opt .preview{
  width:48px;height:14px;flex-shrink:0;
}
.mode-opt .preview line{stroke-linecap:round;}

/* toggle switch */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;
  border-bottom:1px dashed rgba(44,24,16,.15);
}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .lbl{
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
}
.toggle-row .sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:13px;color:var(--ink-muted);
  letter-spacing:0;text-transform:none;
  margin-top:2px;
}
.tog{
  width:44px;height:24px;
  background:var(--paper-shadow);
  border-radius:14px;
  position:relative;
  cursor:pointer;
  transition:background .2s;
  flex-shrink:0;
}
.tog::after{
  content:'';
  position:absolute;top:2px;left:2px;
  width:20px;height:20px;
  background:var(--paper);
  border-radius:50%;
  box-shadow:0 1px 3px var(--shadow);
  transition:transform .2s;
}
.tog.on{background:var(--rust);}
.tog.on::after{transform:translateX(20px);}

.size-row{
  display:flex;gap:6px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  padding:3px;
}
.size-row button{
  flex:1;
  padding:8px 10px;
  background:transparent;
  border:none;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:1px;
}
.size-row button.active{
  background:var(--ink);
  color:var(--paper);
}
.node-label{
  margin-top:4px;
  padding:2px 8px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.05em;
  white-space:nowrap;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--ink);
  box-shadow:0 1px 3px var(--shadow);
}

/* canvas toolbar */
.canvas-toolbar{
  position:fixed;
  bottom:calc(18px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  display:flex;gap:8px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:60px;
  padding:6px;
  box-shadow:0 4px 14px var(--shadow-strong);
  z-index:50;
}
.tbtn{
  width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--ink);
  cursor:pointer;
  position:relative;
}
.tbtn:active{background:rgba(44,24,16,.08);}
.tbtn.active{background:var(--ink);color:var(--paper);}
.tbtn svg{width:22px;height:22px;}
.tbtn .lab{
  position:absolute;
  bottom:-22px;left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif;
  font-size:8px;letter-spacing:.1em;
  color:var(--ink-muted);
  pointer-events:none;
  white-space:nowrap;
}

.canvas-hint{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 64px);
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:8px 14px;border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  z-index:55;
  animation:fadein .3s ease;
  box-shadow:0 4px 12px var(--shadow-strong);
  pointer-events:none;
}

/* ---------- Modals ---------- */
.modal-back{
  position:fixed;inset:0;
  background:rgba(44,24,16,.55);
  display:none;align-items:center;justify-content:center;
  z-index:1000;
  padding:20px;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.modal-back.active{display:flex;animation:fadein .2s ease;}
.modal{
  background:var(--paper);
  border:1px solid var(--ink-soft);
  border-radius:3px;
  width:100%;max-width:400px;
  max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  position:relative;
  animation:popin .25s cubic-bezier(.2,.9,.3,1.2);
}
.modal::before, .modal::after{
  content:'';position:absolute;
  width:18px;height:18px;
  border:1px solid var(--gold);
}
.modal::before{top:8px;left:8px;border-right:none;border-bottom:none;}
.modal::after{bottom:8px;right:8px;border-left:none;border-top:none;}
.modal-head{
  padding:18px 22px 14px;
  border-bottom:1px dashed var(--ink-muted);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.modal-head h2{
  margin:0;
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink);
  flex:1;
}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1;}
.modal-foot{
  padding:14px 22px 18px;
  border-top:1px dashed var(--ink-muted);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
}

/* form */
label{
  display:block;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:14px 0 6px;
}
label:first-child{margin-top:0;}
input[type=text], textarea{
  width:100%;
  padding:10px 12px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:16px;
  color:var(--ink);
  resize:vertical;
}
input[type=text]:focus, textarea:focus{
  outline:none;border-color:var(--rust);
  box-shadow:0 0 0 2px rgba(139,44,29,.18);
}
textarea{min-height:90px;}

.btn{
  padding:10px 18px;
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--ink-muted);
  border-radius:1px;
  color:var(--ink);
  cursor:pointer;
}
.btn:active{background:rgba(44,24,16,.05);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.primary:active{background:var(--ink-soft);}
.btn.danger{border-color:var(--rust);color:var(--rust);}
.btn.danger:active{background:rgba(139,44,29,.08);}
.btn.gold{background:var(--gold);color:var(--paper);border-color:var(--gold);}

/* file list */
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.file-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.15);
  border-radius:2px;
}
.file-icon{
  width:36px;height:36px;flex-shrink:0;
  border-radius:1px;
  background:var(--rust);
  color:var(--paper);
  font-family:'Cinzel',serif;
  font-size:9px;font-weight:600;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  overflow:hidden;
}
.file-icon.pdf{background:var(--rust);}
.file-icon.txt{background:var(--sage);}
.file-info{flex:1;min-width:0;}
.file-info .nm{
  font-family:'EB Garamond',serif;
  font-size:15px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.file-info .sz{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:13px;color:var(--ink-muted);
}
.file-row .acts{display:flex;gap:4px;}
.file-row .acts button{
  width:32px;height:32px;border:none;background:transparent;
  color:var(--ink-muted);cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.file-row .acts button:active{background:rgba(44,24,16,.08);color:var(--ink);}
.file-row .acts button svg{width:16px;height:16px;}

/* picker menu */
.picker-menu{
  display:flex;flex-direction:column;gap:2px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  overflow:hidden;
}
.picker-menu button{
  text-align:left;
  padding:14px 18px;
  background:transparent;border:none;
  font-family:'Cinzel',serif;font-size:11px;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(44,24,16,.08);
}
.picker-menu button:last-child{border-bottom:none;}
.picker-menu button:active{background:rgba(44,24,16,.06);}
.picker-menu button.danger{color:var(--rust);}
.picker-menu button svg{width:18px;height:18px;}

/* file viewer */
.file-viewer{
  position:fixed;inset:0;
  background:rgba(20,12,6,.95);
  z-index:2000;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.file-viewer.active{display:flex;}
.fv-head{
  position:absolute;top:env(safe-area-inset-top);left:0;right:0;
  display:flex;align-items:center;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
  z-index:5;
}
.fv-head .fv-name{
  flex:1;color:var(--paper);
  font-family:'Cinzel',serif;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 12px;
}
.fv-head .iconbtn{color:var(--paper);}
.fv-body{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:auto;
}
.fv-body img{max-width:100%;max-height:100%;object-fit:contain;}
.fv-body iframe{width:100%;height:100%;border:none;background:#fff;}
.fv-body pre{
  background:var(--paper);color:var(--ink);
  padding:24px;margin:24px;border-radius:2px;
  font-family:'Courier New',monospace;font-size:14px;
  max-width:90%;max-height:90%;overflow:auto;
  white-space:pre-wrap;word-break:break-word;
}

/* toast */
.toast{
  position:fixed;
  bottom:90px;left:50%;
  transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:10px 18px;
  border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;
  z-index:3000;
  box-shadow:0 6px 16px var(--shadow-strong);
  animation:toastin .3s ease, toastout .3s ease 2.2s forwards;
  pointer-events:none;
  max-width:90vw;text-align:center;
}

/* utility */
.row{display:flex;gap:8px;align-items:center;}
.row > *{flex:1;}
.scrollarea{overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* animations */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes rotate-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen active" id="home">
  <div class="home-wrap">
    <svg class="compass" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#2c1810" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#8b7355" stroke-width=".5" stroke-dasharray="2 2"/>
      <circle cx="50" cy="50" r="32" fill="none" stroke="#2c1810" stroke-width=".8"/>
      <g font-family="Cinzel" font-size="6" fill="#2c1810" font-weight="600" text-anchor="middle">
        <text x="50" y="13">N</text><text x="50" y="93">S</text>
        <text x="89" y="53">E</text><text x="11" y="53">W</text>
      </g>
      <polygon points="50,18 54,50 50,82 46,50" fill="#8b2c1d" stroke="#2c1810" stroke-width=".4"/>
      <polygon points="50,18 54,50 50,50" fill="#6b1f12"/>
      <polygon points="18,50 50,46 82,50 50,54" fill="#b8860b" stroke="#2c1810" stroke-width=".4" opacity=".7"/>
      <circle cx="50" cy="50" r="3" fill="#2c1810"/>
      <circle cx="50" cy="50" r="1.2" fill="#b8860b"/>
    </svg>
    <h1 class="brand">Wayfarer</h1>
    <p class="tagline">— a journal of journeys —</p>
    <div class="divider"></div>
    <div class="menu">
      <button class="menubtn" id="btn-current" onclick="openCurrentJourney()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 L12 22 M2 12 L22 12" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
        <span>Current Journey<span class="sub" id="current-sub">no active journey</span></span>
      </button>
      <button class="menubtn" onclick="showNewJourney()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>Begin New Journey<span class="sub">chart a fresh course</span></span>
      </button>
      <button class="menubtn" onclick="showArchive()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16v3H4zM5 10v9h14v-9M10 13h4"/></svg>
        <span>The Archive<span class="sub" id="archive-sub">past expeditions</span></span>
      </button>
      <button class="menubtn" onclick="showSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings<span class="sub">circle size, animations</span></span>
      </button>
    </div>
    <p class="foot">"Not all who wander are lost."</p>
  </div>
</div>

<!-- ============ ARCHIVE ============ -->
<div class="screen" id="archive">
  <div class="topbar">
    <button class="iconbtn" onclick="showHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>The Archive</h1>
    <button class="iconbtn" onclick="showNewJourney()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="archive-list scrollarea" id="archive-list"></div>
</div>

<!-- ============ JOURNEY CANVAS ============ -->
<div class="screen" id="journey">
  <div class="topbar">
    <div class="iconbtn" style="visibility:hidden;" aria-hidden="true"></div>
    <h1 id="journey-title">Journey</h1>
    <button class="iconbtn" onclick="showJourneyMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </div>
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas-stage" id="canvas-stage">
      <img class="canvas-bg" id="canvas-bg" alt="">
      <svg class="canvas-svg" id="canvas-svg"></svg>
      <div id="canvas-nodes"></div>
    </div>
  </div>
  <div class="canvas-toolbar">
    <button class="tbtn" id="tb-add" onclick="addNodeAtCenter()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lab">Add</span>
    </button>
    <button class="tbtn" id="tb-connect" onclick="toggleConnectMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8 l8 8" stroke-dasharray="2 2"/></svg>
      <span class="lab">Connect</span>
    </button>
    <button class="tbtn" id="tb-note" onclick="toggleNoteMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
      <span class="lab">Note</span>
    </button>
    <button class="tbtn" onclick="showBgMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 16l4-4 4 4 4-4 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
      <span class="lab">Map</span>
    </button>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-back" id="modal-back" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<!-- ============ FILE VIEWER ============ -->
<div class="file-viewer" id="file-viewer">
  <div class="fv-head">
    <button class="iconbtn" onclick="closeFileViewer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="fv-name" id="fv-name"></div>
  </div>
  <div class="fv-body" id="fv-body"></div>
</div>

<input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.txt,image/*,application/pdf,text/plain" style="display:none">
<input type="file" id="bg-input" accept="image/*" style="display:none">
<input type="file" id="icon-input" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/*" style="display:none">

<script>
/* =========================================================
   NODE TYPES & TRAVEL MODES — visual definitions
   ========================================================= */
const NODE_TYPES = {
  stop:               { label:'Stop',                icon:null },
  airport_arrival:    { label:'Airport · Arrival',   icon:`<svg viewBox="0 0 32 32"><g transform="translate(16 16) rotate(20) translate(-16 -16)"><path d="M16 4c-.9 0-1.4.7-1.4 1.6v7l-9.6 5.4v2.4l9.6-2.9v4.7l-2.7 1.8v1.6l4.1-1.1 4.1 1.1v-1.6l-2.7-1.8v-4.7l9.6 2.9v-2.4l-9.6-5.4v-7c0-.9-.5-1.6-1.4-1.6z"/></g><rect x="3" y="27.5" width="26" height="1.6" rx=".8"/></svg>` },
  airport_departure:  { label:'Airport · Departure', icon:`<svg viewBox="0 0 32 32"><g transform="translate(16 16) rotate(-20) translate(-16 -16)"><path d="M16 4c-.9 0-1.4.7-1.4 1.6v7l-9.6 5.4v2.4l9.6-2.9v4.7l-2.7 1.8v1.6l4.1-1.1 4.1 1.1v-1.6l-2.7-1.8v-4.7l9.6 2.9v-2.4l-9.6-5.4v-7c0-.9-.5-1.6-1.4-1.6z"/></g><rect x="3" y="27.5" width="26" height="1.6" rx=".8"/></svg>` },
  hotel:              { label:'Hotel',               icon:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 27V7h13v20"/><path d="M18 14h9v13"/><path d="M3 27h26"/><rect x="8" y="11" width="3" height="3" fill="currentColor" stroke="none"/><rect x="13" y="11" width="3" height="3" fill="currentColor" stroke="none"/><rect x="8" y="17" width="3" height="3" fill="currentColor" stroke="none"/><rect x="13" y="17" width="3" height="3" fill="currentColor" stroke="none"/><rect x="21" y="18" width="3" height="3" fill="currentColor" stroke="none"/></svg>` },
  train_arrival:      { label:'Train · Arrival',     icon:`<svg viewBox="0 0 32 32"><path d="M3 13l4-5h18v14H7l-4-2z"/><rect x="9" y="11" width="4" height="4" fill="var(--paper-deep)"/><rect x="17" y="11" width="4" height="4" fill="var(--paper-deep)"/><circle cx="11" cy="25" r="2.2"/><circle cx="20" cy="25" r="2.2"/><path d="M30 16l-4-3v6z"/></svg>` },
  train_departure:    { label:'Train · Departure',   icon:`<svg viewBox="0 0 32 32"><path d="M29 13l-4-5H7v14h18l4-2z"/><rect x="11" y="11" width="4" height="4" fill="var(--paper-deep)"/><rect x="19" y="11" width="4" height="4" fill="var(--paper-deep)"/><circle cx="12" cy="25" r="2.2"/><circle cx="21" cy="25" r="2.2"/><path d="M2 16l4-3v6z"/></svg>` }
};

const TRAVEL_MODES = {
  walk:        { label:'Walk',        icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M11 21l1-7-3-3 2-5 4 3 3 1"/><path d="M9 11l-2 4M14 14l3 4"/></svg>`, prevColor:'#5d6e4a', prevDash:'1 5', prevWidth:2.4 },
  taxi:        { label:'Taxi',        icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17V11l2-4h10l2 4v6"/><circle cx="8" cy="17" r="2" fill="currentColor"/><circle cx="16" cy="17" r="2" fill="currentColor"/><path d="M9 4h6M5 11h14"/></svg>`, prevColor:'#c8950b', prevDash:'9 5', prevWidth:2.6 },
  bus:         { label:'Bus',         icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="14" rx="2"/><path d="M4 13h16M9 18v2M15 18v2"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg>`, prevColor:'#2c5560', prevDash:'0', prevWidth:3 },
  train:       { label:'Train',       icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="2"/><path d="M5 10h14M9 17l-2 4M15 17l2 4"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/></svg>`, prevColor:'#6b1f12', prevDash:'2 7', prevWidth:4.5 },
  combination: { label:'Combination', icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8h18M3 12h18M3 16h18" stroke-dasharray="4 2"/><circle cx="6" cy="8" r="1.2" fill="currentColor"/><circle cx="18" cy="16" r="1.2" fill="currentColor"/></svg>`, prevColor:'#2c1810', prevDash:'11 3 2 3', prevWidth:2.5 }
};

/* =========================================================
   STORAGE — IndexedDB wrapper
   ========================================================= */
const DB_NAME='WayfarerDB', DB_VER=1;
let _db;

/* Custom icon library — global, shared across all journeys */
let _customIcons = []; // [{id, label, fileId}]
const _customIconUrls = new Map();

/* Built-in type overrides — global. Replaces the built-in SVG icon
   (and label, optionally) for a given type key. Each override has
   {fileId, label?}. */
let _typeOverrides = {}; // { airport_arrival: {fileId, label}, ... }
const _typeOverrideUrls = new Map();

async function loadCustomIcons(){
  _customIcons = (await Meta.get('customIcons')) || [];
  for(const ic of _customIcons){
    if(_customIconUrls.has(ic.id)) continue;
    const f = await dbGet('files', ic.fileId);
    if(f && f.blob){
      _customIconUrls.set(ic.id, URL.createObjectURL(f.blob));
    }
  }
  _typeOverrides = (await Meta.get('typeOverrides')) || {};
  for(const [key, ov] of Object.entries(_typeOverrides)){
    if(_typeOverrideUrls.has(key)) continue;
    const f = await dbGet('files', ov.fileId);
    if(f && f.blob){
      _typeOverrideUrls.set(key, URL.createObjectURL(f.blob));
    }
  }
}

async function saveCustomIcons(){
  await Meta.set('customIcons', _customIcons);
}
async function saveTypeOverrides(){
  await Meta.set('typeOverrides', _typeOverrides);
}

/* Returns {pinClass, innerHtml, isImage} for a node of the given type. */
function getNodePinInfo(type, num){
  // 1. Built-in type with user override → image fills pin
  if(NODE_TYPES[type] && _typeOverrides[type]){
    const url = _typeOverrideUrls.get(type);
    if(url){
      return { pinClass: 'has-image', innerHtml: `<img src="${url}" alt="">`, isImage: true };
    }
  }
  // 2. Custom icon from library → image fills pin
  if(type && type.startsWith('custom_')){
    const iconId = type.slice(7);
    const url = _customIconUrls.get(iconId);
    if(url){
      return { pinClass: 'has-image', innerHtml: `<img src="${url}" alt="">`, isImage: true };
    }
    // fallback if icon was deleted
    return { pinClass: 't-stop', innerHtml: `<span class="node-num">${num}</span>`, isImage: false };
  }
  // 3. Built-in type with default SVG
  const tdef = NODE_TYPES[type] || NODE_TYPES.stop;
  const inner = tdef.icon || `<span class="node-num">${num}</span>`;
  return { pinClass: 't-' + (type || 'stop'), innerHtml: inner, isImage: false };
}

/* Return the user-facing label for a type (respecting override rename). */
function getTypeLabel(typeKey){
  if(typeKey && typeKey.startsWith('custom_')){
    const iconId = typeKey.slice(7);
    const ic = _customIcons.find(x => x.id === iconId);
    return ic ? ic.label : 'Custom';
  }
  if(_typeOverrides[typeKey] && _typeOverrides[typeKey].label){
    return _typeOverrides[typeKey].label;
  }
  return (NODE_TYPES[typeKey] && NODE_TYPES[typeKey].label) || 'Stop';
}
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const req=indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('journeys')) db.createObjectStore('journeys',{keyPath:'id'});
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess=()=>{_db=req.result;res(_db);};
    req.onerror=()=>rej(req.error);
  });
}
function tx(store, mode='readonly'){
  return openDB().then(db=>db.transaction(store,mode).objectStore(store));
}
async function dbGet(store,key){
  const s=await tx(store);
  return new Promise((res,rej)=>{const r=s.get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
}
async function dbPut(store,val){
  const s=await tx(store,'readwrite');
  return new Promise((res,rej)=>{const r=s.put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error);});
}
async function dbDel(store,key){
  const s=await tx(store,'readwrite');
  return new Promise((res,rej)=>{const r=s.delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
}
async function dbAll(store){
  const s=await tx(store);
  return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
}

const Meta={
  async get(k){const r=await dbGet('meta',k);return r?r.value:null;},
  async set(k,v){return dbPut('meta',{key:k,value:v});}
};

/* =========================================================
   STATE
   ========================================================= */
const App={
  journeys:[],
  active:null,         // current open journey object
  drag:null,
  connectMode:false,
  connectFrom:null,
  noteMode:false,
  selectedNode:null,
  selectedNote:null,
  bgUrl:null,          // object URL for current bg
  // Global settings (shared across all journeys), loaded from Meta on boot.
  settings:{
    pinSize:'medium',       // 'compact' | 'medium' | 'large'
    pathsAnimated:true
  },
  // Cached stage dimensions, updated by sizeStage()
  _stageW:0,
  _stageH:0,
  _wrapH:0
};

async function loadSettings(){
  const stored = await Meta.get('settings');
  if(stored && typeof stored === 'object'){
    Object.assign(App.settings, stored);
  }
}
async function saveSettings(){
  await Meta.set('settings', App.settings);
}

/* =========================================================
   UTILITIES
   ========================================================= */
function uuid(){return 'j-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-US',{year:'numeric',month:'long'});
}
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function ext(name){
  const i=name.lastIndexOf('.');
  return i<0?'':name.slice(i+1).toLowerCase();
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2700);
}

/* =========================================================
   SCREEN NAVIGATION
   ========================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showHome(){
  exitJourney();
  showScreen('home');
  refreshHome();
}
async function showArchive(){
  showScreen('archive');
  await renderArchive();
}

/* =========================================================
   HOME
   ========================================================= */
async function refreshHome(){
  App.journeys=await dbAll('journeys');
  const activeId=await Meta.get('activeId');
  const active=App.journeys.find(j=>j.id===activeId);
  const sub=document.getElementById('current-sub');
  const btn=document.getElementById('btn-current');
  if(active){
    sub.textContent=active.name;
    btn.classList.remove('disabled');
  }else{
    sub.textContent='no active journey';
    btn.classList.add('disabled');
  }
  document.getElementById('archive-sub').textContent=
    App.journeys.length+(App.journeys.length===1?' expedition':' expeditions');
}

async function openCurrentJourney(){
  const activeId=await Meta.get('activeId');
  if(!activeId) return;
  const j=await dbGet('journeys',activeId);
  if(!j){toast('Active journey not found');return;}
  await openJourney(j);
}

/* =========================================================
   NEW JOURNEY
   ========================================================= */
function showNewJourney(){
  openModal({
    title:'New Journey',
    body:`
      <label>Journey Name</label>
      <input type="text" id="nj-name" placeholder="e.g. Mexico, May 2026" maxlength="80">
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:14px 0 0;font-size:14px;">
        A new chart will be drawn. You may rename or remove it later.
      </p>
    `,
    actions:[
      {label:'Cancel',cls:'',onClick:closeModal},
      {label:'Save',cls:'primary',onClick:async()=>{
        const name=document.getElementById('nj-name').value.trim();
        if(!name){toast('Please enter a name');return;}
        const j={
          id:uuid(),
          name,
          createdAt:new Date().toISOString(),
          updatedAt:new Date().toISOString(),
          backgroundFileId:null,
          nodes:[],
          edges:[],
          notes:[]
        };
        await dbPut('journeys',j);
        await Meta.set('activeId',j.id);
        closeModal();
        toast('Journey created');
        await openJourney(j);
      }}
    ]
  });
  setTimeout(()=>document.getElementById('nj-name').focus(),100);
}

/* =========================================================
   ARCHIVE LIST
   ========================================================= */
async function renderArchive(){
  App.journeys=await dbAll('journeys');
  App.journeys.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  const activeId=await Meta.get('activeId');
  const list=document.getElementById('archive-list');
  if(App.journeys.length===0){
    list.innerHTML=`
      <div class="empty">
        <span class="ico">⚜</span>
        No journeys yet.<br>
        Begin a new one to start charting.
      </div>`;
    return;
  }
  list.innerHTML=App.journeys.map(j=>{
    const isActive=j.id===activeId;
    return `
      <div class="j-card ${isActive?'active-j':''}">
        ${isActive?'<span class="badge">Current</span>':''}
        <h3>${escapeHtml(j.name)}</h3>
        <div class="meta">
          <strong>Begun</strong> ${fmtDate(j.createdAt)} · <strong>Last touched</strong> ${fmtDate(j.updatedAt)}<br>
          <strong>${j.nodes.length}</strong> node${j.nodes.length===1?'':'s'}, <strong>${j.edges.length}</strong> connection${j.edges.length===1?'':'s'}
        </div>
        <div class="j-actions">
          <button class="primary" onclick="openJourneyById('${j.id}')">Open</button>
          ${!isActive?`<button onclick="setActive('${j.id}')">Make Current</button>`:''}
          <button onclick="renameJourney('${j.id}')">Rename</button>
          <button class="danger" onclick="confirmDeleteJourney('${j.id}')">Delete</button>
        </div>
      </div>`;
  }).join('');
}

async function openJourneyById(id){
  const j=await dbGet('journeys',id);
  if(!j){toast('Journey not found');return;}
  await Meta.set('activeId',id);
  await openJourney(j);
}

async function setActive(id){
  await Meta.set('activeId',id);
  toast('Set as current');
  await renderArchive();
}

function renameJourney(id){
  const j=App.journeys.find(x=>x.id===id);
  if(!j)return;
  openModal({
    title:'Rename Journey',
    body:`<label>New Name</label><input type="text" id="rn" value="${escapeHtml(j.name)}" maxlength="80">`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Save',cls:'primary',onClick:async()=>{
        const n=document.getElementById('rn').value.trim();
        if(!n)return;
        j.name=n;j.updatedAt=new Date().toISOString();
        await dbPut('journeys',j);
        closeModal();
        await renderArchive();
        toast('Renamed');
      }}
    ]
  });
  setTimeout(()=>{const el=document.getElementById('rn');el.focus();el.select();},100);
}

function confirmDeleteJourney(id){
  const j=App.journeys.find(x=>x.id===id);
  if(!j)return;
  openModal({
    title:'Delete Journey?',
    body:`<p style="margin:0;font-size:16px;">This will permanently remove <strong>"${escapeHtml(j.name)}"</strong> and all of its nodes, descriptions, and attached files. This cannot be undone.</p>`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Delete',cls:'danger',onClick:async()=>{
        // delete attached files
        for(const node of j.nodes){
          for(const f of (node.files||[])){
            await dbDel('files',f.id);
          }
        }
        if(j.backgroundFileId) await dbDel('files',j.backgroundFileId);
        await dbDel('journeys',j.id);
        const activeId=await Meta.get('activeId');
        if(activeId===j.id) await Meta.set('activeId',null);
        closeModal();
        await renderArchive();
        toast('Journey deleted');
      }}
    ]
  });
}

/* =========================================================
   JOURNEY CANVAS — vertical-scroll model (mobile-first)

   Coordinate system: every node and note has
     fx  — fraction of stage width (0..1, may slightly exceed bounds)
     y   — pixels from top of stage
   Stage width = canvas-wrap clientWidth.
   Stage height = max(wrap clientHeight, image height when scaled to width).

   No zoom. Pan is native vertical scroll on canvas-wrap.
   ========================================================= */
async function openJourney(j){
  App.active=j;
  if(!j.notes) j.notes = [];
  // migrate old absolute (x,y) pixel coords to (fx,y)
  migrateLegacyCoords(j);

  App.connectMode=false;
  App.connectFrom=null;
  App.noteMode=false;
  App.selectedNode=null;
  App.selectedNote=null;
  document.getElementById('journey-title').textContent=j.name;
  showScreen('journey');
  await loadBackground();
  await sizeStage();
  renderCanvas();
  attachCanvasGestures();
  // reset scroll to top
  document.getElementById('canvas-wrap').scrollTop = 0;
}

function migrateLegacyCoords(j){
  const ASSUMED_OLD_WIDTH = 400; // most users were on ~400px when old data was created
  let migrated = false;
  for(const n of j.nodes){
    if(typeof n.fx !== 'number'){
      const px = (typeof n.x === 'number') ? n.x : ASSUMED_OLD_WIDTH/2;
      n.fx = Math.max(0.05, Math.min(0.95, px / ASSUMED_OLD_WIDTH));
      delete n.x;
      migrated = true;
    }
    if(typeof n.y !== 'number') n.y = 100;
  }
  for(const note of (j.notes||[])){
    if(typeof note.fx !== 'number'){
      const px = (typeof note.x === 'number') ? note.x : ASSUMED_OLD_WIDTH/2;
      note.fx = Math.max(0.05, Math.min(0.95, px / ASSUMED_OLD_WIDTH));
      delete note.x;
      migrated = true;
    }
    if(typeof note.y !== 'number') note.y = 200;
  }
  if(migrated){
    // save quietly in background
    dbPut('journeys', j);
  }
}

function exitJourney(){
  App.active=null;
  if(App.bgUrl){URL.revokeObjectURL(App.bgUrl);App.bgUrl=null;}
  document.getElementById('canvas-bg').src='';
  document.getElementById('canvas-bg').style.display='none';
}

async function saveActive(){
  if(!App.active)return;
  App.active.updatedAt=new Date().toISOString();
  await dbPut('journeys',App.active);
}

async function loadBackground(){
  const j=App.active;
  const bg=document.getElementById('canvas-bg');
  if(App.bgUrl){URL.revokeObjectURL(App.bgUrl);App.bgUrl=null;}
  if(!j.backgroundFileId){
    bg.src='';
    bg.style.display='none';
    j._bgRatio = null;
    return;
  }
  const f=await dbGet('files',j.backgroundFileId);
  if(!f){
    bg.src='';
    bg.style.display='none';
    j._bgRatio = null;
    return;
  }
  App.bgUrl=URL.createObjectURL(f.blob);
  bg.src=App.bgUrl;
  bg.style.display='block';
  // compute and cache ratio = naturalHeight / naturalWidth so we can size stage
  await new Promise(res => {
    if(bg.complete && bg.naturalWidth){
      j._bgRatio = bg.naturalHeight / bg.naturalWidth;
      res();
    } else {
      bg.onload = () => {
        j._bgRatio = bg.naturalHeight / bg.naturalWidth;
        res();
      };
      bg.onerror = () => { j._bgRatio = null; res(); };
    }
  });
}

/* Set the stage element's height. With image: scale image to width, stage
   height = image height. Without image: stage = exactly one screen tall. */
function sizeStage(){
  const j = App.active;
  if(!j) return;
  const wrap = document.getElementById('canvas-wrap');
  const stage = document.getElementById('canvas-stage');
  // wrap content area (height = available viewport for the canvas, after topbar)
  const wrapH = wrap.clientHeight;
  const stageW = wrap.clientWidth;
  let stageH;
  if(j._bgRatio && stageW > 0){
    // scale image to fill width
    stageH = stageW * j._bgRatio;
    // if image is shorter than the screen (landscape), still use full screen
    // height so the bottom of the screen has the parchment behind it.
    if(stageH < wrapH) stageH = wrapH;
  } else {
    stageH = wrapH;
  }
  stage.style.setProperty('--stage-h', stageH + 'px');
  // remember stage dims for hit-testing without forced reflow
  App._stageW = stageW;
  App._stageH = stageH;
  App._wrapH = wrapH;
}

function renderCanvas(){
  const j=App.active;
  if(!j)return;
  if(!j.notes) j.notes = [];
  const stage=document.getElementById('canvas-stage');
  // pin size — read from global settings, not from the journey
  stage.dataset.pinSize = App.settings.pinSize || 'medium';

  const W = App._stageW || stage.clientWidth || 1;
  const H = App._stageH || stage.clientHeight || 1;

  const animated = App.settings.pathsAnimated !== false;

  // edges
  const svg=document.getElementById('canvas-svg');
  // give the svg its absolute pixel viewBox so coords match
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let svgHtml='';
  for(const e of j.edges){
    const a=j.nodes.find(n=>n.id===e.from);
    const b=j.nodes.find(n=>n.id===e.to);
    if(!a||!b)continue;
    const ax=a.fx*W, ay=a.y;
    const bx=b.fx*W, by=b.y;
    const dx=bx-ax, dy=by-ay;
    const len=Math.hypot(dx,dy)||1;
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const nx=-dy/len, ny=dx/len;
    const bend = Math.min(60, len*0.18);
    const sign = (hashStr(e.from + e.to) & 1) ? 1 : -1;
    const cx=mx + nx*bend*sign;
    const cy=my + ny*bend*sign;
    const dpath=`M${ax},${ay} Q${cx},${cy} ${bx},${by}`;
    const cls=e.type||'walk';
    const animCls = animated ? ' animated' : '';
    svgHtml+=`<path class="canvas-edge-hit" d="${dpath}" data-edge="${e.from}|${e.to}"/>`;
    svgHtml+=`<path class="canvas-edge ${cls}${animCls}" d="${dpath}"/>`;
    const lmx = 0.25*ax + 0.5*cx + 0.25*bx;
    const lmy = 0.25*ay + 0.5*cy + 0.25*by;
    const lab=(TRAVEL_MODES[cls]?TRAVEL_MODES[cls].label:'').toUpperCase();
    const labW=Math.max(28, lab.length*6 + 10);
    svgHtml+=`<rect class="edge-label-bg" x="${lmx-labW/2}" y="${lmy-7}" width="${labW}" height="14" rx="2" pointer-events="none"/>`;
    svgHtml+=`<text class="edge-label" x="${lmx}" y="${lmy+3}" pointer-events="none">${lab}</text>`;
  }
  svg.innerHTML=svgHtml;
  svg.querySelectorAll('.canvas-edge-hit').forEach(p=>{
    p.addEventListener('click',ev=>{
      ev.stopPropagation();
      const [from,to]=p.dataset.edge.split('|');
      editEdge(from,to);
    });
  });

  // nodes + notes
  const nc=document.getElementById('canvas-nodes');
  nc.innerHTML='';
  j.nodes.forEach((n,i)=>{
    const el=document.createElement('div');
    el.className='canvas-node';
    if(App.connectFrom===n.id) el.classList.add('connecting');
    if(App.selectedNode===n.id) el.classList.add('selected');
    el.style.left=(n.fx*W)+'px';
    el.style.top=(n.y)+'px';
    el.dataset.id=n.id;
    const hasFiles=(n.files||[]).length>0;
    const type=n.type||'stop';
    const info = getNodePinInfo(type, i+1);
    el.innerHTML=`
      <div class="node-pin ${info.pinClass} ${hasFiles?'has-files':''}">${info.innerHtml}</div>
      <div class="node-label">${escapeHtml(n.name)}</div>`;
    nc.appendChild(el);
    attachNodeHandlers(el,n);
  });

  for(const note of j.notes){
    const el=document.createElement('div');
    el.className='canvas-note-pin';
    if(App.selectedNote===note.id) el.classList.add('selected');
    el.style.left=(note.fx*W)+'px';
    el.style.top=(note.y)+'px';
    el.dataset.id=note.id;
    const filled = note.text && note.text.trim().length>0;
    if(filled){
      el.innerHTML=`<div class="note-shape filled">
        <svg viewBox="0 0 36 36">
          <path class="tri" d="M18 4 L33 30 L3 30 Z"/>
          <rect class="bang" x="16.6" y="13" width="2.8" height="9" rx="1.2"/>
          <circle class="bang" cx="18" cy="26" r="1.6"/>
        </svg>
      </div>`;
    } else {
      el.innerHTML=`<div class="note-shape empty">
        <svg viewBox="0 0 36 36">
          <path class="note-paper" d="M9 5 L23 5 L29 11 L29 31 L9 31 Z"/>
          <path class="note-paper" d="M23 5 L23 11 L29 11" fill="none"/>
          <rect class="note-pencil" x="13" y="16" width="11" height="1.4" rx=".7"/>
          <rect class="note-pencil" x="13" y="20" width="13" height="1.4" rx=".7"/>
          <rect class="note-pencil" x="13" y="24" width="8" height="1.4" rx=".7"/>
        </svg>
      </div>`;
    }
    nc.appendChild(el);
    attachNotePinHandlers(el, note);
  }
}

function hashStr(s){
  let h=0;
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; }
  return h;
}




/* =========================================================
   NODE INTERACTIONS
   ========================================================= */
function attachNodeHandlers(el, node){
  let pressing=false, dragging=false;
  let startX=0, startY=0, startFx=0, startNodeY=0, startTime=0;
  const MOVE_THRESH=6;
  const TAP_MAX_MS=350;

  const onDown=ev=>{
    ev.stopPropagation();
    const t=ev.touches?ev.touches[0]:ev;
    startX=t.clientX; startY=t.clientY;
    startFx=node.fx; startNodeY=node.y;
    startTime=Date.now();
    pressing=true; dragging=false;
  };
  const onMove=ev=>{
    if(!pressing)return;
    const t=ev.touches?ev.touches[0]:ev;
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(!dragging && Math.hypot(dx,dy)>MOVE_THRESH){
      if(App.connectMode){pressing=false;return;}
      dragging=true;
      el.classList.add('dragging');
      navigator.vibrate&&navigator.vibrate(15);
    }
    if(dragging){
      ev.preventDefault();
      const W = App._stageW || 1;
      // Convert horizontal pixel delta to fraction-of-width delta.
      // Clamp fx so circles can't go off screen.
      let newFx = startFx + dx / W;
      newFx = Math.max(0.05, Math.min(0.95, newFx));
      let newY = startNodeY + dy;
      // clamp y so nodes stay inside the stage
      newY = Math.max(0, Math.min((App._stageH || 1) - 1, newY));
      node.fx = newFx;
      node.y = newY;
      renderCanvas();
    }
  };
  const onUp=async ev=>{
    if(!pressing)return;
    pressing=false;
    el.classList.remove('dragging');
    if(dragging){
      dragging=false;
      await saveActive();
    }else{
      const dur=Date.now()-startTime;
      if(dur<=TAP_MAX_MS+250){
        if(App.connectMode){
          handleConnectTap(node.id);
        }else{
          openNodeDetail(node.id);
        }
      }
    }
  };

  el.addEventListener('mousedown',onDown);
  el.addEventListener('touchstart',onDown,{passive:true});
  el.addEventListener('mousemove',onMove);
  el.addEventListener('touchmove',onMove,{passive:false});
  el.addEventListener('mouseup',onUp);
  el.addEventListener('touchend',onUp);
  el.addEventListener('mouseleave',()=>{if(pressing && !dragging){pressing=false;}});
  el.addEventListener('touchcancel',()=>{
    pressing=false; dragging=false;
    el.classList.remove('dragging');
  });
}

/* =========================================================
   NOTE PIN INTERACTIONS — drag to move, tap to edit
   ========================================================= */
function attachNotePinHandlers(el, note){
  let pressing=false, dragging=false;
  let startX=0, startY=0, startFx=0, startNoteY=0, startTime=0;
  const MOVE_THRESH=6;

  const onDown = ev => {
    ev.stopPropagation();
    const t = ev.touches ? ev.touches[0] : ev;
    startX=t.clientX; startY=t.clientY;
    startFx=note.fx; startNoteY=note.y;
    startTime=Date.now();
    pressing=true; dragging=false;
  };
  const onMove = ev => {
    if(!pressing) return;
    const t = ev.touches ? ev.touches[0] : ev;
    const dx = t.clientX-startX, dy = t.clientY-startY;
    if(!dragging && Math.hypot(dx,dy) > MOVE_THRESH){
      dragging=true;
      el.classList.add('dragging');
      navigator.vibrate && navigator.vibrate(15);
    }
    if(dragging){
      ev.preventDefault();
      const W = App._stageW || 1;
      let newFx = startFx + dx / W;
      newFx = Math.max(0.04, Math.min(0.96, newFx));
      let newY = startNoteY + dy;
      newY = Math.max(0, Math.min((App._stageH || 1) - 1, newY));
      note.fx = newFx;
      note.y = newY;
      renderCanvas();
    }
  };
  const onUp = async ev => {
    if(!pressing) return;
    pressing=false;
    el.classList.remove('dragging');
    if(dragging){
      dragging=false;
      await saveActive();
    } else {
      openNoteEditor(note.id);
    }
  };

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, {passive:true});
  el.addEventListener('mousemove', onMove);
  el.addEventListener('touchmove', onMove, {passive:false});
  el.addEventListener('mouseup', onUp);
  el.addEventListener('touchend', onUp);
  el.addEventListener('mouseleave', () => { if(pressing && !dragging) pressing=false; });
  el.addEventListener('touchcancel', () => {
    pressing=false; dragging=false;
    el.classList.remove('dragging');
  });
}

/* =========================================================
   CANVAS GESTURES — only one job left: detect a tap on empty
   canvas to drop a note when in note-mode. Native scroll handles
   panning, and there is no zoom.
   ========================================================= */
function attachCanvasGestures(){
  const wrap=document.getElementById('canvas-wrap');
  const stage=document.getElementById('canvas-stage');
  let tapStartX=0, tapStartY=0, tapStartTime=0, tapMoved=false, tapActive=false;
  const TAP_MAX_MS=400;
  const TAP_MOVE_THRESH=10;

  const isInteractive = el => el.closest('.canvas-node, .canvas-note-pin, .canvas-edge-hit');

  // We attach to the stage so we get coordinates relative to it (not the
  // wrap) — that way scrolling doesn't change our reference frame.
  stage.ontouchstart=ev=>{
    if(ev.touches.length!==1 || isInteractive(ev.target)) {
      tapActive=false; return;
    }
    tapStartX=ev.touches[0].clientX;
    tapStartY=ev.touches[0].clientY;
    tapStartTime=Date.now();
    tapMoved=false; tapActive=true;
  };
  stage.ontouchmove=ev=>{
    if(!tapActive || ev.touches.length!==1) return;
    const t=ev.touches[0];
    if(Math.hypot(t.clientX-tapStartX, t.clientY-tapStartY)>TAP_MOVE_THRESH){
      tapMoved=true;
    }
  };
  stage.ontouchend=ev=>{
    if(!tapActive) return;
    if(!tapMoved && (Date.now()-tapStartTime)<TAP_MAX_MS && App.noteMode){
      // convert client coordinates to stage coordinates
      const r=stage.getBoundingClientRect();
      placeNoteAt(tapStartX - r.left, tapStartY - r.top);
    }
    tapActive=false;
  };

  // mouse fallback
  stage.onmousedown=ev=>{
    if(isInteractive(ev.target)) {tapActive=false; return;}
    tapStartX=ev.clientX; tapStartY=ev.clientY;
    tapStartTime=Date.now();
    tapMoved=false; tapActive=true;
  };
  stage.onmousemove=ev=>{
    if(!tapActive) return;
    if(Math.hypot(ev.clientX-tapStartX, ev.clientY-tapStartY)>TAP_MOVE_THRESH){
      tapMoved=true;
    }
  };
  stage.onmouseup=ev=>{
    if(!tapActive) return;
    if(!tapMoved && (Date.now()-tapStartTime)<TAP_MAX_MS && App.noteMode){
      const r=stage.getBoundingClientRect();
      placeNoteAt(tapStartX - r.left, tapStartY - r.top);
    }
    tapActive=false;
  };
  stage.onmouseleave=()=>{tapActive=false;};
}

/* =========================================================
   ADD NODE — new stops drop near the top of the visible area
   ========================================================= */
function addNodeAtCenter(){
  if(!App.active)return;
  openModal({
    title:'New Stop',
    body:`<label>Name this stop</label>
          <input type="text" id="nn-name" placeholder="e.g. Hotel · Hanoi" maxlength="60">`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Place',cls:'primary',onClick:async()=>{
        const name=document.getElementById('nn-name').value.trim();
        if(!name){toast('Name required');return;}
        const wrap=document.getElementById('canvas-wrap');
        const stage=document.getElementById('canvas-stage');
        const stageW = stage.clientWidth || App._stageW || 412;
        const stageH = App._stageH || stage.clientHeight || 600;
        // Place near the center of the currently visible area
        const visibleCenterY = wrap.scrollTop + wrap.clientHeight / 2;
        // small offset so successive nodes don't stack exactly
        const i = App.active.nodes.length;
        const offset = i * 22;
        const fx = 0.5 + ((i % 2 === 0) ? 0 : 0.04) * (i % 4 < 2 ? 1 : -1);
        const y = Math.max(40, Math.min(stageH-40, visibleCenterY + offset - 100));
        App.active.nodes.push({
          id:uuid(), name,
          type:'stop',
          fx: Math.max(0.1, Math.min(0.9, fx)),
          y,
          description:'', files:[]
        });
        await saveActive();
        closeModal();
        renderCanvas();
      }}
    ]
  });
  setTimeout(()=>document.getElementById('nn-name').focus(),100);
}

function setNoteMode(on){
  App.noteMode = !!on;
  document.getElementById('tb-note').classList.toggle('active', App.noteMode);
  document.getElementById('canvas-wrap').classList.toggle('note-mode', App.noteMode);

    App.connectMode=false;
    App.connectFrom=null;
    document.getElementById('tb-connect').classList.remove('active');
  }
  setNoteMode(!App.noteMode);

/* screenX/screenY are coordinates relative to the canvas-stage */
async function placeNoteAt(stageX, stageY){
  if(!App.active) return;
  const W = App._stageW || 1;
  const H = App._stageH || 1;
  const fx = Math.max(0.04, Math.min(0.96, stageX / W));
  const y  = Math.max(0, Math.min(H - 1, stageY));
  const note = {
    id: uuid(),
    fx, y,
    text: '',
    createdAt: new Date().toISOString()
  };
  if(!App.active.notes) App.active.notes = [];
  App.active.notes.push(note);
  await saveActive();
  setNoteMode(false);
  renderCanvas();
  openNoteEditor(note.id);
}

let _hintEl=null;
function showHint(text){
  if(_hintEl){_hintEl.remove();_hintEl=null;}
  if(!text)return;
  _hintEl=document.createElement('div');
  _hintEl.className='canvas-hint';
  _hintEl.textContent=text;
  document.getElementById('canvas-wrap').appendChild(_hintEl);
}

async function handleConnectTap(nodeId){
  if(!App.connectFrom){
    App.connectFrom=nodeId;
    showHint('Now tap the destination');
    renderCanvas();
    return;
  }
  if(App.connectFrom===nodeId){
    App.connectFrom=null;
    showHint('Tap two stops to link them');
    renderCanvas();
    return;
  }
  // about to create edge — verify it doesn't exist
  const from=App.connectFrom, to=nodeId;
  const exists=App.active.edges.some(e=>
    (e.from===from && e.to===to)||(e.from===to && e.to===from));
  if(exists){
    toast('Already linked');
    App.connectFrom=null;
    showHint('Tap two stops to link them');
    renderCanvas();
    return;
  }
  // turn off connect mode and ask travel mode
  App.connectFrom=null;
  App.connectMode=false;
  document.getElementById('tb-connect').classList.remove('active');
  showHint(null);
  pickTravelMode(null, async (mode)=>{
    if(mode===null){renderCanvas();return;}  // cancelled
    App.active.edges.push({from,to,type:mode});
    await saveActive();
    toast('Path drawn');
    renderCanvas();
  });
}

function pickTravelMode(currentMode, onPick){
  const optsHtml=Object.entries(TRAVEL_MODES).map(([k,v])=>{
    const sel=currentMode===k?'selected':'';
    // preview svg line matching the actual edge style
    const prev=`<svg class="preview" viewBox="0 0 48 14"><line x1="3" y1="7" x2="45" y2="7" stroke="${v.prevColor}" stroke-width="${v.prevWidth}" stroke-dasharray="${v.prevDash==='0'?'':v.prevDash}" stroke-linecap="${k==='walk'||k==='bus'?'round':'butt'}"/></svg>`;
    return `<div class="mode-opt ${sel}" data-mode="${k}" onclick="window._modePicked='${k}';document.querySelectorAll('.mode-opt').forEach(e=>e.classList.toggle('selected',e.dataset.mode==='${k}'));">
      <div class="micon">${v.icon}</div>
      <div class="mtxt"><div class="nm">${v.label}</div></div>
      ${prev}
    </div>`;
  }).join('');
  window._modePicked=currentMode;
  openModal({
    title:'Travel Mode',
    body:`<p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:0 0 4px;font-size:14px;">How is this leg of the journey travelled?</p>
          <div class="mode-list">${optsHtml}</div>`,
    actions:[
      {label:'Cancel',onClick:()=>{closeModal();onPick(null);}},
      {label:'Save',cls:'primary',onClick:()=>{closeModal();onPick(window._modePicked||'walk');}}
    ]
  });
}

function editEdge(from,to){
  const e=App.active.edges.find(x=>x.from===from && x.to===to);
  if(!e)return;
  const a=App.active.nodes.find(n=>n.id===from);
  const b=App.active.nodes.find(n=>n.id===to);
  pickTravelMode(e.type||'walk', async (mode)=>{
    if(mode===null){renderCanvas();return;}
    e.type=mode;
    await saveActive();
    toast('Updated');
    renderCanvas();
  });
  // overlay an extra "Remove" button into the modal foot
  setTimeout(()=>{
    const acts=document.getElementById('modal-actions');
    if(!acts)return;
    const head=document.querySelector('.modal-head h2');
    if(head && a && b) head.textContent=`${a.name} → ${b.name}`;
    const rm=document.createElement('button');
    rm.className='btn danger';
    rm.textContent='Remove Path';
    rm.style.marginRight='auto';
    rm.onclick=async()=>{
      App.active.edges=App.active.edges.filter(x=>!(x.from===from&&x.to===to));
      await saveActive();
      closeModal();
      renderCanvas();
      toast('Path removed');
    };
    acts.insertBefore(rm, acts.firstChild);
  },20);
}

      {label:'Delete Stop',cls:'danger',onClick:confirmDeleteNode},

    ],

      _editingNode=null;
