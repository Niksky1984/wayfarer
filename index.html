<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2c1810">
<title>Wayfarer · Journey Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ebd7;
  --paper-deep:#ebdfc1;
  --paper-shadow:#d9c89a;
  --ink:#2c1810;
  --ink-soft:#5a3a26;
  --ink-muted:#8b7355;
  --gold:#b8860b;
  --gold-deep:#8a6508;
  --rust:#8b2c1d;
  --rust-deep:#6b1f12;
  --sage:#5d6e4a;
  --shadow:rgba(44,24,16,.18);
  --shadow-strong:rgba(44,24,16,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:'EB Garamond',Georgia,serif;
  font-size:17px;
  line-height:1.5;
  color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(ellipse at top left, rgba(184,134,11,.08), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(139,44,29,.06), transparent 50%),
    repeating-linear-gradient(45deg, transparent, transparent 100px, rgba(139,115,85,.02) 100px, rgba(139,115,85,.02) 101px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .15 0 0 0 0 .06 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

/* ---------- Screens ---------- */
.screen{
  position:fixed; inset:0;
  display:none; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.screen.active{display:flex;}

/* ---------- Top Bar ---------- */
.topbar{
  display:flex;align-items:center;
  padding:14px 16px 12px;
  border-bottom:1px solid rgba(44,24,16,.12);
  background:linear-gradient(180deg, rgba(44,24,16,.03), transparent);
}
.topbar h1{
  margin:0;flex:1;
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:18px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
  text-align:center;
}
.iconbtn{
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;
  color:var(--ink);
  cursor:pointer;border-radius:50%;
  transition:background .2s;
}
.iconbtn:active{background:rgba(44,24,16,.08);}
.iconbtn svg{width:22px;height:22px;}

/* ---------- Home Screen ---------- */
#home{align-items:center;justify-content:center;padding:24px;}
.home-wrap{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;align-items:center;
  animation:fadein .6s ease;
}
.compass{
  width:120px;height:120px;
  margin-bottom:18px;
  animation:rotate-slow 60s linear infinite;
}
.brand{
  font-family:'Cinzel',serif;
  font-size:34px;font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  margin:0 0 4px;
  text-align:center;
}
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:18px;
  color:var(--ink-soft);
  margin:0 0 32px;
  text-align:center;
}
.divider{
  width:60%;height:1px;
  background:linear-gradient(90deg, transparent, var(--ink-muted), transparent);
  margin:0 0 28px;
  position:relative;
}
.divider::after{
  content:'✦';
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:var(--paper);
  padding:0 10px;
  color:var(--gold);
  font-size:14px;
}
.menu{
  width:100%;display:flex;flex-direction:column;gap:14px;
}
.menubtn{
  width:100%;
  padding:18px 22px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  font-family:'Cinzel',serif;
  font-weight:500;
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink);
  cursor:pointer;
  text-align:left;
  display:flex;align-items:center;gap:14px;
  position:relative;
  box-shadow:0 2px 0 var(--paper-shadow), 0 4px 12px var(--shadow);
  transition:transform .15s, box-shadow .15s;
}
.menubtn:active{
  transform:translateY(2px);
  box-shadow:0 0 0 var(--paper-shadow), 0 2px 6px var(--shadow);
}
.menubtn svg{width:22px;height:22px;flex-shrink:0;color:var(--rust);}
.menubtn.disabled{opacity:.45;pointer-events:none;}
.menubtn .sub{
  display:block;
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-weight:400;
  font-size:13px;
  letter-spacing:0;
  text-transform:none;
  color:var(--ink-soft);
  margin-top:2px;
}

.foot{
  margin-top:32px;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:var(--ink-muted);
  text-align:center;
  opacity:.7;
}

/* ---------- Archive ---------- */
.archive-list{flex:1;overflow-y:auto;padding:8px 16px 24px;}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-muted);
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:18px;
}
.empty .ico{font-size:48px;color:var(--gold);margin-bottom:12px;display:block;}
.j-card{
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-left:3px solid var(--rust);
  border-radius:2px;
  padding:16px 18px;
  margin-bottom:12px;
  box-shadow:0 1px 0 var(--paper-shadow), 0 3px 8px var(--shadow);
  position:relative;
}
.j-card.active-j{border-left-color:var(--gold);background:linear-gradient(180deg, var(--paper-deep), rgba(184,134,11,.08));}
.j-card .badge{
  position:absolute;top:10px;right:12px;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;
  padding:3px 7px;background:var(--gold);color:var(--paper);
  border-radius:1px;text-transform:uppercase;
}
.j-card h3{
  margin:0 0 6px;
  font-family:'Cinzel',serif;
  font-weight:500;font-size:16px;
  letter-spacing:.05em;
  padding-right:60px;
  word-wrap:break-word;
}
.j-card .meta{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:14px;
  color:var(--ink-muted);
  margin-bottom:12px;
}
.j-card .meta strong{color:var(--ink-soft);font-weight:500;font-style:normal;}
.j-actions{display:flex;flex-wrap:wrap;gap:6px;}
.j-actions button{
  flex:0 1 auto;
  padding:8px 12px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--ink-muted);
  border-radius:1px;
  color:var(--ink);
  cursor:pointer;
}
.j-actions button:active{background:rgba(44,24,16,.06);}
.j-actions button.danger{border-color:var(--rust);color:var(--rust);}
.j-actions button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ---------- Journey Canvas ---------- */
#journey{display:none;}
#journey.active{display:flex;}
.canvas-wrap{
  flex:1;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--paper-deep);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(139,115,85,.07) 23px, rgba(139,115,85,.07) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(139,115,85,.07) 23px, rgba(139,115,85,.07) 24px);
  /* allow native vertical pan, block horizontal */
  touch-action:pan-y;
  overscroll-behavior:contain;
  /* leave room at the bottom so the floating toolbar doesn't hide content */
  padding-bottom:90px;
}
/* the stage holds all positioned content; width = wrap width, height = computed */
.canvas-stage{
  position:relative;
  width:100%;
  /* height set by JS via --stage-h CSS variable */
  height:var(--stage-h, 100%);
  min-height:100%;
}
.canvas-bg{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  display:block;
  opacity:.9;
  filter:sepia(.12) contrast(.96);
}
.canvas-svg{
  position:absolute;top:0;left:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}
.canvas-svg .canvas-edge,
.canvas-svg .canvas-edge-hit,
.canvas-svg .edge-label,
.canvas-svg .edge-label-bg{
  pointer-events:auto;
}
.canvas-edge{
  fill:none;
  opacity:.9;
  cursor:pointer;
  stroke-linejoin:round;
  /* default = walk */
  stroke:var(--sage);
  stroke-width:2.4;
  stroke-dasharray:1 5;
  stroke-linecap:round;
}
.canvas-edge.walk{
  stroke:var(--sage);
  stroke-width:2.4;
  stroke-dasharray:1 5;
  stroke-linecap:round;
}
.canvas-edge.taxi{
  stroke:#c8950b;
  stroke-width:2.6;
  stroke-dasharray:9 5;
  stroke-linecap:butt;
}
.canvas-edge.bus{
  stroke:#2c5560;
  stroke-width:3;
  stroke-dasharray:none;
  stroke-linecap:round;
}
.canvas-edge.train{
  stroke:var(--rust-deep);
  stroke-width:4.5;
  stroke-dasharray:2 7;
  stroke-linecap:butt;
}
.canvas-edge.flight{
  stroke:#3a6a8c;
  stroke-width:2.6;
  stroke-dasharray:14 4 2 4;
  stroke-linecap:butt;
}
.canvas-edge.ferry{
  stroke:#1f6b6e;
  stroke-width:3;
  stroke-dasharray:6 3 1 3;
  stroke-linecap:butt;
}
.canvas-edge.combination{
  stroke:var(--ink);
  stroke-width:2.5;
  stroke-dasharray:11 3 2 3;
  stroke-linecap:butt;
}
/* edge label */
.edge-label{
  fill:var(--paper);
  stroke:none;
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.1em;
  text-anchor:middle;
  font-weight:600;
  text-transform:uppercase;
}
.edge-label-bg{
  fill:var(--ink);
  stroke:none;
  rx:2;
}
.canvas-edge-hit{
  stroke:transparent;
  stroke-width:24;
  fill:none;
  cursor:pointer;
}
.canvas-node{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.canvas-node.dragging{cursor:grabbing;z-index:100;}
/* Connect-mode "selected first node" — beige/gold glow pulse */
.canvas-node.connecting .node-pin{
  box-shadow:
    0 0 0 4px #f4d678,
    0 0 0 10px rgba(244, 214, 120, .55),
    0 0 22px 4px rgba(244, 214, 120, .65),
    0 6px 14px var(--shadow-strong) !important;
  animation: connect-glow 1.1s ease-in-out infinite;
}
@keyframes connect-glow {
  0%, 100% {
    box-shadow:
      0 0 0 4px #f4d678,
      0 0 0 10px rgba(244, 214, 120, .55),
      0 0 22px 4px rgba(244, 214, 120, .65),
      0 6px 14px var(--shadow-strong);
  }
  50% {
    box-shadow:
      0 0 0 5px #ffe18c,
      0 0 0 14px rgba(244, 214, 120, .35),
      0 0 32px 8px rgba(244, 214, 120, .85),
      0 6px 14px var(--shadow-strong);
  }
}
/* =========================================================
   TIME AXIS — vertical timeline ruler
   The axis is a thin column rendered alongside the canvas. It shows
   day bands (with the date as a label) and hour ticks within each
   day. Stops have a Y coordinate that maps to a date/time.
   ========================================================= */
.canvas-axis{
  position:absolute;
  top:0;
  width:54px;
  height:100%;
  z-index:3;
  pointer-events:none; /* user can scroll the canvas through it */
  font-family:'EB Garamond',serif;
  color:var(--ink-soft);
}
.canvas-axis.left{ left:0; border-right:1px solid rgba(44,24,16,.18); }
.canvas-axis.right{ right:0; border-left:1px solid rgba(44,24,16,.18); }
.canvas-axis-bg{
  position:absolute;
  inset:0;
  background:rgba(244, 235, 215, .82);
  -webkit-backdrop-filter:blur(1px);
  backdrop-filter:blur(1px);
}
.axis-day-band{
  position:absolute;
  left:0; right:0;
  border-top:1px dashed var(--gold);
  border-bottom:1px dashed var(--gold);
}
.axis-day-label{
  position:absolute;
  left:0; right:0;
  text-align:center;
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--ink);
  padding:4px 0;
  background:rgba(184, 134, 11, .12);
  border-top:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
}
.axis-day-label .date-num{
  display:block;
  font-size:13px;
  font-family:'EB Garamond',serif;
  font-weight:600;
  letter-spacing:0;
  line-height:1.1;
}
.axis-day-label .date-mo{
  display:block;
  font-size:8px;
  margin-top:1px;
}
.axis-hour-tick{
  position:absolute;
  left:0; right:0;
  height:0;
  border-top:1px solid rgba(44,24,16,.10);
}
.axis-hour-tick .lbl{
  position:absolute;
  left:0; right:0;
  top:-7px;
  text-align:center;
  font-size:9px;
  color:var(--ink-muted);
  font-family:'EB Garamond',serif;
}
/* When axis is on the right, push canvas-content left of it, and vice versa.
   We do this by adding inner padding to the stage via a class. */
.canvas-stage.axis-left{ padding-left:54px; }
.canvas-stage.axis-right{ padding-right:54px; }

/* Stop time-badge attached to lower-right of pin */
.node-time-badge{
  position:absolute;
  bottom:-8px;
  right:-4px;
  background:var(--ink);
  color:var(--paper);
  font-family:'Cinzel',serif;
  font-size:9px;
  letter-spacing:.06em;
  padding:2px 6px;
  border-radius:8px;
  border:1.5px solid var(--paper);
  box-shadow:0 1px 3px var(--shadow);
  white-space:nowrap;
  z-index:1;
}

/* Edge duration label */
.edge-duration-bg{
  fill:var(--paper);
  stroke:var(--ink-muted);
  stroke-width:.5;
  rx:2;
}
.edge-duration{
  fill:var(--ink);
  stroke:none;
  font-family:'EB Garamond',serif;
  font-style:italic;
  font-size:10px;
  text-anchor:middle;
}

/* Total summary in topbar */
.topbar h1 .trip-stats{
  display:block;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:11px;
  letter-spacing:.05em;
  color:var(--ink-muted);
  text-transform:none;
  margin-top:1px;
  font-weight:400;
}

/* Time section in stop detail popup */
.time-row{
  display:flex;
  gap:8px;
  align-items:center;
}
.time-row > * { flex:1; }
.time-row input[type=date],
.time-row input[type=time]{
  width:100%;
  padding:8px 10px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
}
.duration-row{
  display:flex;
  gap:8px;
  align-items:center;
}
.duration-row input[type=number]{
  flex:1;
  padding:8px 10px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
  min-width:0;
}
.duration-row select{
  flex:1;
  padding:8px 10px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
}
.tiny-clear{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-muted);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:4px 8px;
  text-decoration:underline;
}

/* =========================================================
   Pin size — controlled via CSS vars on canvas-stage. Sizes tuned for
   ~412px phone width.
   Medium: ~5 fit horizontally with spacing, ~7-8 vertically.
   Compact: ~6-7 horizontally, ~10 vertically.
   Large: ~4 horizontally, ~5-6 vertically. */
.canvas-stage{
  --pin-size:62px;
  --pin-icon-size:38px;
  --pin-num-size:18px;
  --pin-border:3px;
  --pin-badge-size:12px;
  --pin-label-font:11px;
  --pin-label-max:130px;
}
.canvas-stage[data-pin-size="compact"]{
  --pin-size:48px;
  --pin-icon-size:30px;
  --pin-num-size:15px;
  --pin-border:2.5px;
  --pin-badge-size:10px;
  --pin-label-font:10px;
  --pin-label-max:100px;
}
.canvas-stage[data-pin-size="medium"]{
  --pin-size:62px;
  --pin-icon-size:38px;
  --pin-num-size:18px;
  --pin-border:3px;
  --pin-badge-size:12px;
  --pin-label-font:11px;
  --pin-label-max:130px;
}
.canvas-stage[data-pin-size="large"]{
  --pin-size:88px;
  --pin-icon-size:54px;
  --pin-num-size:24px;
  --pin-border:3.5px;
  --pin-badge-size:15px;
  --pin-label-font:12px;
  --pin-label-max:160px;
}
.node-pin{
  width:var(--pin-size);
  height:var(--pin-size);
  background:var(--rust);
  border:var(--pin-border) solid var(--paper);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--rust), 0 6px 14px var(--shadow-strong);
  display:flex;align-items:center;justify-content:center;
  color:var(--paper);
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:var(--pin-num-size);
  position:relative;
  overflow:hidden;
}
.node-pin svg{
  width:var(--pin-icon-size);
  height:var(--pin-icon-size);
  color:var(--paper);
  fill:currentColor;
  stroke:currentColor;
}
.node-pin img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  display:block;
}
.node-pin.t-airport_arrival,
.node-pin.t-airport_departure{ background:#2c5560; box-shadow:0 0 0 2px #2c5560, 0 6px 14px var(--shadow-strong); }
.node-pin.t-hotel{ background:var(--gold-deep); box-shadow:0 0 0 2px var(--gold-deep), 0 6px 14px var(--shadow-strong); }
.node-pin.t-train_arrival,
.node-pin.t-train_departure{ background:var(--rust-deep); box-shadow:0 0 0 2px var(--rust-deep), 0 6px 14px var(--shadow-strong); }
.node-pin.t-custom{
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 0 0 2px var(--ink-soft), 0 6px 14px var(--shadow-strong);
}
/* When pin shows a user image, drop the colored ring entirely so the
   artwork is the whole pin — important for pre-designed circular icons. */
.node-pin.has-image{
  background:transparent;
  border-color:transparent;
  box-shadow:0 6px 14px var(--shadow-strong);
}
.canvas-node.selected .node-pin.has-image{
  background:transparent;
  box-shadow:0 0 0 4px var(--gold), 0 0 0 8px rgba(184,134,11,.3), 0 6px 14px var(--shadow-strong);
}
.node-pin.has-files::after{
  content:'';
  position:absolute;top:0;right:0;
  width:var(--pin-badge-size);
  height:var(--pin-badge-size);
  background:var(--gold);
  border:2px solid var(--paper);
  border-radius:50%;
  z-index:2;
}
.canvas-node.selected .node-pin{
  background:var(--gold);
  box-shadow:0 0 0 2px var(--gold), 0 0 0 7px rgba(184,134,11,.3), 0 6px 14px var(--shadow-strong);
}
.node-label{
  font-size:var(--pin-label-font);
  max-width:var(--pin-label-max);
}

/* edit pencil on type tiles */
.type-opt .edit-btn{
  position:absolute;top:-6px;left:-6px;
  width:22px;height:22px;
  background:var(--ink);color:var(--paper);
  border:2px solid var(--paper);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:2;
  box-shadow:0 1px 3px var(--shadow);
}
.type-opt .edit-btn:active{background:var(--rust);}
.type-opt .edit-btn svg{width:11px;height:11px;}
/* image-style ico for tiles where icon is a user image */
.type-opt .ico.has-image{
  background:transparent;
  border:none;
  overflow:hidden;
}
.type-opt .ico.has-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* path flow animations */
@keyframes flow-walk { to { stroke-dashoffset: -12; } }
@keyframes flow-taxi { to { stroke-dashoffset: -28; } }
@keyframes flow-bus  { to { stroke-dashoffset: -38; } }
@keyframes flow-train{ to { stroke-dashoffset: -18; } }
@keyframes flow-flight { to { stroke-dashoffset: -48; } }
@keyframes flow-ferry  { to { stroke-dashoffset: -26; } }
@keyframes flow-combination { to { stroke-dashoffset: -38; } }
.canvas-edge.animated.walk        { animation: flow-walk 1.6s linear infinite; }
.canvas-edge.animated.taxi        { animation: flow-taxi 1.8s linear infinite; }
.canvas-edge.animated.bus         { animation: flow-bus 2.4s linear infinite; stroke-dasharray: 32 6; }
.canvas-edge.animated.train       { animation: flow-train 1.1s linear infinite; }
.canvas-edge.animated.flight      { animation: flow-flight 1.4s linear infinite; }
.canvas-edge.animated.ferry       { animation: flow-ferry 2.0s linear infinite; }
.canvas-edge.animated.combination { animation: flow-combination 2.6s linear infinite; }

/* note pins on canvas */
.canvas-note-pin{
  position:absolute;
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:5;
}
.canvas-note-pin.dragging{cursor:grabbing;z-index:120;}
.note-shape{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
}
.note-shape svg{width:100%;height:100%;}
/* empty note: small parchment paper icon */
.note-shape.empty .note-paper{
  fill:var(--paper);
  stroke:var(--ink-soft);
  stroke-width:1.4;
}
.note-shape.empty .note-pencil{
  fill:var(--ink-soft);
}
/* filled note: yellow warning triangle */
.note-shape.filled .tri{
  fill:#f5c518;
  stroke:var(--ink);
  stroke-width:1.4;
  stroke-linejoin:round;
}
.note-shape.filled .bang{
  fill:var(--ink);
}
.canvas-note-pin.selected .note-shape{
  filter:drop-shadow(0 0 0 3px rgba(184,134,11,.5)) drop-shadow(0 3px 5px rgba(0,0,0,.4));
}
.canvas-note-pin.dragging .note-shape{
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
  transform:scale(1.1);
}

/* note placement crosshair when in note-mode */
.canvas-wrap.note-mode{cursor:crosshair;}

/* note popup textarea */
.note-textarea{
  width:100%;
  min-height:160px;
  max-height:60vh;
  padding:14px 16px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  font-family:'EB Garamond',serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  /* resize:both lets the user drag the bottom-right corner to make
     the textarea both wider (up to its container) and taller. The
     browser draws a small grip handle in that corner automatically. */
  resize:both;
  overflow:auto;
  background-image:repeating-linear-gradient(
    180deg,
    transparent,
    transparent 1.5em,
    rgba(139,115,85,.18) 1.5em,
    rgba(139,115,85,.18) calc(1.5em + 1px)
  );
  background-attachment:local;
}
/* Text-size variants. The line-spacing of the ruled paper is in
   em units (1.5em) so the ruled lines scale with the font size. */
.note-textarea.size-small  { font-size:13px; min-height:140px; }
.note-textarea.size-medium { font-size:16px; min-height:160px; }
.note-textarea.size-large  { font-size:20px; min-height:200px; }
.note-textarea:focus{
  outline:none;
  border-color:var(--rust);
  box-shadow:0 0 0 2px rgba(139,44,29,.18);
}

/* Text-size selector for the note popup */
.note-size-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 0 6px;
}
.note-size-row .lbl{
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.note-size-row .sizes{
  display:flex;
  gap:4px;
  margin-left:auto;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  padding:2px;
}
.note-size-row .sizes button{
  padding:5px 10px;
  background:transparent;
  border:none;
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:1px;
}
.note-size-row .sizes button.active{
  background:var(--ink);
  color:var(--paper);
}

/* Hint about resizing the note */
.note-resize-hint{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:var(--ink-muted);
  font-size:13px;
  margin:6px 0 0;
}

/* collapsible Type section */
.collapsible{
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  background:var(--paper-deep);
  margin-top:6px;
  overflow:hidden;
}
.collapsible-head{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  cursor:pointer;
  user-select:none;
  transition:background .15s;
}
.collapsible-head:active{background:rgba(44,24,16,.05);}
.collapsible-head .preview-ico{
  width:34px;height:34px;flex-shrink:0;
  border-radius:50%;
  background:var(--rust);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.collapsible-head .preview-ico svg{width:20px;height:20px;color:var(--paper);fill:currentColor;stroke:currentColor;}
.collapsible-head .preview-ico img{width:100%;height:100%;object-fit:contain;}
.collapsible-head .preview-ico.has-image{background:transparent;border:1px solid var(--ink-muted);}
.collapsible-head.t-airport_arrival .preview-ico,
.collapsible-head.t-airport_departure .preview-ico{ background:#2c5560; }
.collapsible-head.t-hotel .preview-ico{ background:var(--gold-deep); }
.collapsible-head.t-train_arrival .preview-ico,
.collapsible-head.t-train_departure .preview-ico{ background:var(--rust-deep); }
.collapsible-head .preview-info{flex:1;min-width:0;}
.collapsible-head .preview-info .lbl-tiny{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.collapsible-head .preview-info .nm{
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
  margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.collapsible-head .chev{
  flex-shrink:0;
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
  transition:transform .25s ease;
}
.collapsible-head .chev svg{width:14px;height:14px;}
.collapsible.open .chev{transform:rotate(180deg);}
.collapsible-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.collapsible.open .collapsible-body{
  max-height:600px;
}
.collapsible-body .pad{padding:10px 12px 14px;}

/* type picker grid */
.type-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:6px;
}
.type-opt{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  cursor:pointer;
  transition:all .15s;
  position:relative;
}
.type-opt.selected{
  border-color:var(--rust);
  background:#fff7e0;
  box-shadow:0 0 0 1px var(--rust);
}
.type-opt:active{transform:scale(.96);}
.type-opt .ico{
  width:42px;height:42px;
  border-radius:50%;
  background:var(--rust);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.type-opt .ico svg{width:26px;height:26px;}
.type-opt .ico img{width:88%;height:88%;object-fit:contain;}
.type-opt.t-airport_arrival .ico, .type-opt.t-airport_departure .ico{ background:#2c5560; }
.type-opt.t-hotel .ico{ background:var(--gold-deep); }
.type-opt.t-train_arrival .ico, .type-opt.t-train_departure .ico{ background:var(--rust-deep); }
.type-opt.t-custom .ico{ background:var(--paper); border:1px solid var(--ink-muted); }
.type-opt .nm{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  text-align:center;
  line-height:1.2;
}
.type-opt .x{
  position:absolute;top:-6px;right:-6px;
  width:22px;height:22px;
  background:var(--rust);color:var(--paper);
  border:2px solid var(--paper);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;line-height:1;
  cursor:pointer;
  font-family:'EB Garamond',serif;
  font-weight:600;
  z-index:2;
}
.type-opt .x:active{background:var(--rust-deep);}
.type-opt.add{
  background:transparent;
  border:1.5px dashed var(--ink-muted);
}
.type-opt.add .ico{
  background:transparent;
  border:1.5px dashed var(--ink-muted);
  color:var(--ink-muted);
}

/* travel mode picker */
.mode-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.mode-opt{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  cursor:pointer;
}
.mode-opt.selected{
  border-color:var(--ink);
  background:#fff7e0;
  box-shadow:0 0 0 1px var(--ink);
}
.mode-opt:active{background:#f0e4c4;}
.mode-opt .micon{width:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.mode-opt .micon svg{width:26px;height:26px;}
.mode-opt .mtxt{flex:1;}
.mode-opt .mtxt .nm{
  font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
}
.mode-opt .preview{
  width:48px;height:14px;flex-shrink:0;
}
.mode-opt .preview line{stroke-linecap:round;}

/* toggle switch */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;
  border-bottom:1px dashed rgba(44,24,16,.15);
}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .lbl{
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
}
.toggle-row .sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:13px;color:var(--ink-muted);
  letter-spacing:0;text-transform:none;
  margin-top:2px;
}
.tog{
  width:44px;height:24px;
  background:var(--paper-shadow);
  border-radius:14px;
  position:relative;
  cursor:pointer;
  transition:background .2s;
  flex-shrink:0;
}
.tog::after{
  content:'';
  position:absolute;top:2px;left:2px;
  width:20px;height:20px;
  background:var(--paper);
  border-radius:50%;
  box-shadow:0 1px 3px var(--shadow);
  transition:transform .2s;
}
.tog.on{background:var(--rust);}
.tog.on::after{transform:translateX(20px);}

.size-row{
  display:flex;gap:6px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:2px;
  padding:3px;
}
.size-row button{
  flex:1;
  padding:8px 10px;
  background:transparent;
  border:none;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:1px;
}
.size-row button.active{
  background:var(--ink);
  color:var(--paper);
}
.node-label{
  margin-top:4px;
  padding:2px 8px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'Cinzel',serif;
  font-size:11px;
  letter-spacing:.05em;
  white-space:nowrap;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--ink);
  box-shadow:0 1px 3px var(--shadow);
}

/* canvas toolbar */
.canvas-toolbar{
  position:fixed;
  bottom:calc(18px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  display:flex;gap:8px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  border-radius:60px;
  padding:6px;
  box-shadow:0 4px 14px var(--shadow-strong);
  z-index:50;
}
.tbtn{
  width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:transparent;
  border:none;
  color:var(--ink);
  cursor:pointer;
  position:relative;
}
.tbtn:active{background:rgba(44,24,16,.08);}
.tbtn.active{background:var(--ink);color:var(--paper);}
.tbtn svg{width:22px;height:22px;}
.tbtn .lab{
  position:absolute;
  bottom:-22px;left:50%;
  transform:translateX(-50%);
  font-family:'Cinzel',serif;
  font-size:8px;letter-spacing:.1em;
  color:var(--ink-muted);
  pointer-events:none;
  white-space:nowrap;
}

.canvas-hint{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 64px);
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:8px 14px;border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  z-index:55;
  animation:fadein .3s ease;
  box-shadow:0 4px 12px var(--shadow-strong);
  pointer-events:none;
}

/* ---------- Modals ---------- */
.modal-back{
  position:fixed;inset:0;
  background:rgba(44,24,16,.55);
  display:none;align-items:center;justify-content:center;
  z-index:1000;
  padding:20px;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
.modal-back.active{display:flex;animation:fadein .2s ease;}
.modal{
  background:var(--paper);
  border:1px solid var(--ink-soft);
  border-radius:3px;
  width:100%;max-width:400px;
  max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  position:relative;
  animation:popin .25s cubic-bezier(.2,.9,.3,1.2);
}
.modal::before, .modal::after{
  content:'';position:absolute;
  width:18px;height:18px;
  border:1px solid var(--gold);
}
.modal::before{top:8px;left:8px;border-right:none;border-bottom:none;}
.modal::after{bottom:8px;right:8px;border-left:none;border-top:none;}
.modal-head{
  padding:18px 22px 14px;
  border-bottom:1px dashed var(--ink-muted);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.modal-head h2{
  margin:0;
  font-family:'Cinzel',serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink);
  flex:1;
}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1;}
.modal-foot{
  padding:14px 22px 18px;
  border-top:1px dashed var(--ink-muted);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
}

/* Type chip button in footer of stop detail.
   Sits at the left of the footer, shows the current type's icon + label,
   tapping it opens the type picker. */
.type-chip-btn{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px 6px 6px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:24px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
  cursor:pointer;
  margin-right:auto; /* pin to left, rest of buttons stay on right */
  max-width:48%;
  overflow:hidden;
}
.type-chip-btn:active{background:rgba(44,24,16,.05);}
.type-chip-btn .chip-ico{
  width:28px;height:28px;flex-shrink:0;
  border-radius:50%;
  background:var(--rust);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.type-chip-btn .chip-ico svg{width:18px;height:18px;color:var(--paper);fill:currentColor;stroke:currentColor;}
.type-chip-btn .chip-ico img{width:100%;height:100%;object-fit:contain;}
.type-chip-btn .chip-ico.has-image{background:transparent;}
.type-chip-btn .chip-ico.t-airport_arrival,
.type-chip-btn .chip-ico.t-airport_departure{ background:#2c5560; }
.type-chip-btn .chip-ico.t-hotel{ background:var(--gold-deep); }
.type-chip-btn .chip-ico.t-train_arrival,
.type-chip-btn .chip-ico.t-train_departure{ background:var(--rust-deep); }
.type-chip-btn .chip-label{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Library picker — collapsible list of saved airlines/hotels with
   an "Add new" entry at the bottom. */
.lib-section{
  margin-top:10px;
  border:1px solid rgba(44,24,16,.18);
  border-radius:2px;
  background:var(--paper-deep);
  overflow:hidden;
}
.lib-section-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  cursor:pointer;
  user-select:none;
  background:rgba(184,134,11,.06);
  border-bottom:1px dashed rgba(44,24,16,.18);
}
.lib-section-head:active{background:rgba(184,134,11,.12);}
.lib-section-head .head-ico{
  width:30px;height:30px;flex-shrink:0;
  border-radius:50%;
  background:var(--ink-soft);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.lib-section-head .head-ico svg{width:18px;height:18px;}
.lib-section-head .head-ico img{width:100%;height:100%;object-fit:contain;}
.lib-section-head .head-info{flex:1;min-width:0;}
.lib-section-head .lbl-tiny{
  font-family:'Cinzel',serif;
  font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.lib-section-head .nm{
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lib-section-head .chev{
  flex-shrink:0;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
  transition:transform .25s ease;
}
.lib-section-head .chev svg{width:14px;height:14px;}
.lib-section.open .chev{transform:rotate(180deg);}
.lib-list{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.lib-section.open .lib-list{
  max-height:360px;
  overflow-y:auto;
}
.lib-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-bottom:1px solid rgba(44,24,16,.06);
  cursor:pointer;
  background:var(--paper);
}
.lib-row:hover{background:#fff7e0;}
.lib-row.selected{background:rgba(184,134,11,.10);border-left:3px solid var(--gold);padding-left:11px;}
.lib-row .row-ico{
  width:34px;height:34px;flex-shrink:0;
  border-radius:50%;
  background:var(--ink-soft);
  color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:11px;font-weight:600;
  letter-spacing:.04em;
  overflow:hidden;
}
.lib-row .row-ico img{width:100%;height:100%;object-fit:contain;}
.lib-row .row-info{flex:1;min-width:0;}
.lib-row .row-name{
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lib-row .row-sub{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:12px;
  color:var(--ink-muted);
}
.lib-row .row-detail{
  width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-muted);
  border-radius:50%;
}
.lib-row .row-detail:active{background:rgba(44,24,16,.08);color:var(--ink);}
.lib-row .row-detail svg{width:16px;height:16px;}
.lib-row.add-new{
  background:transparent;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--rust);
  justify-content:center;
  border-top:1px dashed var(--ink-muted);
  border-bottom:none;
}
.lib-row.add-new .row-ico{
  width:22px;height:22px;background:transparent;
  border:1.5px dashed var(--rust);color:var(--rust);
}
.lib-row.add-new .row-ico svg{width:14px;height:14px;}

/* Library editor (Settings) */
.lib-mgmt-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--ink-muted);
}
.lib-mgmt-row .btn{padding:7px 12px;font-size:10px;}

/* Field grid used in airline/hotel detail forms */
.field-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.field-grid label{margin-top:0;}
.field-grid input[type=text],
.field-grid input[type=email],
.field-grid input[type=tel],
.field-grid input[type=url],
.field-grid textarea{
  width:100%;
  padding:9px 11px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:15px;
  color:var(--ink);
}
.field-grid textarea{min-height:60px;resize:vertical;}
.field-grid input:focus, .field-grid textarea:focus{
  outline:none;border-color:var(--rust);
  box-shadow:0 0 0 2px rgba(139,44,29,.18);
}

/* Image picker / preview area in library forms */
.lib-image-row{
  display:flex;align-items:center;gap:14px;
  padding:12px;
  background:var(--paper-deep);
  border:1px dashed var(--ink-muted);
  border-radius:2px;
}
.lib-image-preview{
  width:64px;height:64px;flex-shrink:0;
  border-radius:4px;
  background:var(--paper);
  border:1px solid var(--ink-muted);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-muted);
  overflow:hidden;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;
  text-align:center;
}
.lib-image-preview img{width:100%;height:100%;object-fit:cover;}
.lib-image-row .lib-image-actions{display:flex;flex-direction:column;gap:6px;}
.lib-image-row .lib-image-actions .btn{padding:5px 10px;font-size:9px;}

/* form */
label{
  display:block;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:14px 0 6px;
}
label:first-child{margin-top:0;}
input[type=text], textarea{
  width:100%;
  padding:10px 12px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  font-family:'EB Garamond',serif;
  font-size:16px;
  color:var(--ink);
  resize:vertical;
}
input[type=text]:focus, textarea:focus{
  outline:none;border-color:var(--rust);
  box-shadow:0 0 0 2px rgba(139,44,29,.18);
}
textarea{min-height:90px;}

.btn{
  padding:10px 18px;
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;
  background:transparent;
  border:1px solid var(--ink-muted);
  border-radius:1px;
  color:var(--ink);
  cursor:pointer;
}
.btn:active{background:rgba(44,24,16,.05);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.primary:active{background:var(--ink-soft);}
.btn.danger{border-color:var(--rust);color:var(--rust);}
.btn.danger:active{background:rgba(139,44,29,.08);}
.btn.gold{background:var(--gold);color:var(--paper);border-color:var(--gold);}

/* file list */
.file-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.file-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--paper-deep);
  border:1px solid rgba(44,24,16,.15);
  border-radius:2px;
}
.file-icon{
  width:36px;height:36px;flex-shrink:0;
  border-radius:1px;
  background:var(--rust);
  color:var(--paper);
  font-family:'Cinzel',serif;
  font-size:9px;font-weight:600;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  overflow:hidden;
}
.file-icon.pdf{background:var(--rust);}
.file-icon.txt{background:var(--sage);}
.file-info{flex:1;min-width:0;}
.file-info .nm{
  font-family:'EB Garamond',serif;
  font-size:15px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.file-info .sz{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:13px;color:var(--ink-muted);
}
.file-row .acts{display:flex;gap:4px;}
.file-row .acts button{
  width:32px;height:32px;border:none;background:transparent;
  color:var(--ink-muted);cursor:pointer;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.file-row .acts button:active{background:rgba(44,24,16,.08);color:var(--ink);}
.file-row .acts button svg{width:16px;height:16px;}

/* picker menu */
.picker-menu{
  display:flex;flex-direction:column;gap:2px;
  background:var(--paper-deep);
  border:1px solid var(--ink-muted);
  border-radius:1px;
  overflow:hidden;
}
.picker-menu button{
  text-align:left;
  padding:14px 18px;
  background:transparent;border:none;
  font-family:'Cinzel',serif;font-size:11px;
  letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(44,24,16,.08);
}
.picker-menu button:last-child{border-bottom:none;}
.picker-menu button:active{background:rgba(44,24,16,.06);}
.picker-menu button.danger{color:var(--rust);}
.picker-menu button svg{width:18px;height:18px;}

/* file viewer */
.file-viewer{
  position:fixed;inset:0;
  background:rgba(20,12,6,.95);
  z-index:2000;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.file-viewer.active{display:flex;}
.fv-head{
  position:absolute;top:env(safe-area-inset-top);left:0;right:0;
  display:flex;align-items:center;
  padding:14px 16px;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
  z-index:5;
}
.fv-head .fv-name{
  flex:1;color:var(--paper);
  font-family:'Cinzel',serif;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 12px;
}
.fv-head .iconbtn{color:var(--paper);}
.fv-body{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
}
/* Image is wrapped in a zoom container that we transform with JS.
   touch-action:none lets us own all gestures so the browser doesn't
   accidentally interpret a pinch as page zoom. */
.fv-zoom-wrap{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fv-zoom-img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transform-origin:0 0;
  will-change:transform;
  -webkit-user-drag:none;
  pointer-events:none;
}
.fv-body > img:not(.fv-zoom-img){max-width:100%;max-height:100%;object-fit:contain;}
.fv-body iframe{width:100%;height:100%;border:none;background:#fff;}
.fv-body pre{
  background:var(--paper);color:var(--ink);
  padding:24px;margin:24px;border-radius:2px;
  font-family:'Courier New',monospace;font-size:14px;
  max-width:90%;max-height:90%;overflow:auto;
  white-space:pre-wrap;word-break:break-word;
}
/* Floating zoom-reset hint that appears while zoomed in on an image */
.fv-zoom-badge{
  position:absolute;
  bottom:18px;left:50%;
  transform:translateX(-50%);
  background:rgba(20,12,6,.78);
  color:var(--paper);
  padding:8px 16px;
  border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;
  z-index:6;
  pointer-events:auto;
  cursor:pointer;
  border:1px solid rgba(244,235,215,.25);
  opacity:0;
  transition:opacity .2s;
}
.fv-zoom-badge.show{opacity:1;}

/* toast */
.toast{
  position:fixed;
  bottom:90px;left:50%;
  transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:10px 18px;
  border-radius:30px;
  font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;
  z-index:3000;
  box-shadow:0 6px 16px var(--shadow-strong);
  animation:toastin .3s ease, toastout .3s ease 2.2s forwards;
  pointer-events:none;
  max-width:90vw;text-align:center;
}

/* utility */
.row{display:flex;gap:8px;align-items:center;}
.row > *{flex:1;}
.scrollarea{overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* animations */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes rotate-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="screen active" id="home">
  <div class="home-wrap">
    <svg class="compass" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#2c1810" stroke-width="1.2"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#8b7355" stroke-width=".5" stroke-dasharray="2 2"/>
      <circle cx="50" cy="50" r="32" fill="none" stroke="#2c1810" stroke-width=".8"/>
      <g font-family="Cinzel" font-size="6" fill="#2c1810" font-weight="600" text-anchor="middle">
        <text x="50" y="13">N</text><text x="50" y="93">S</text>
        <text x="89" y="53">E</text><text x="11" y="53">W</text>
      </g>
      <polygon points="50,18 54,50 50,82 46,50" fill="#8b2c1d" stroke="#2c1810" stroke-width=".4"/>
      <polygon points="50,18 54,50 50,50" fill="#6b1f12"/>
      <polygon points="18,50 50,46 82,50 50,54" fill="#b8860b" stroke="#2c1810" stroke-width=".4" opacity=".7"/>
      <circle cx="50" cy="50" r="3" fill="#2c1810"/>
      <circle cx="50" cy="50" r="1.2" fill="#b8860b"/>
    </svg>
    <h1 class="brand">Wayfarer</h1>
    <p class="tagline">— a journal of journeys —</p>
    <div class="divider"></div>
    <div class="menu">
      <button class="menubtn" id="btn-current" onclick="openCurrentJourney()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 L12 22 M2 12 L22 12" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
        <span>Current Journey<span class="sub" id="current-sub">no active journey</span></span>
      </button>
      <button class="menubtn" onclick="showNewJourney()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>Begin New Journey<span class="sub">chart a fresh course</span></span>
      </button>
      <button class="menubtn" onclick="showArchive()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16v3H4zM5 10v9h14v-9M10 13h4"/></svg>
        <span>The Archive<span class="sub" id="archive-sub">past expeditions</span></span>
      </button>
      <button class="menubtn" onclick="showSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings<span class="sub">circle size, animations</span></span>
      </button>
    </div>
    <p class="foot">"Not all who wander are lost."</p>
  </div>
</div>

<!-- ============ ARCHIVE ============ -->
<div class="screen" id="archive">
  <div class="topbar">
    <button class="iconbtn" onclick="showHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>The Archive</h1>
    <button class="iconbtn" onclick="showNewJourney()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="archive-list scrollarea" id="archive-list"></div>
</div>

<!-- ============ JOURNEY CANVAS ============ -->
<div class="screen" id="journey">
  <div class="topbar">
    <div class="iconbtn" style="visibility:hidden;" aria-hidden="true"></div>
    <h1 id="journey-title">Journey</h1>
    <button class="iconbtn" onclick="showJourneyMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </div>
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas-stage" id="canvas-stage">
      <img class="canvas-bg" id="canvas-bg" alt="">
      <div class="canvas-axis" id="canvas-axis" style="display:none;"></div>
      <svg class="canvas-svg" id="canvas-svg"></svg>
      <div id="canvas-nodes"></div>
    </div>
  </div>
  <div class="canvas-toolbar">
    <button class="tbtn" id="tb-add" onclick="addNodeAtCenter()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lab">Add</span>
    </button>
    <button class="tbtn" id="tb-connect" onclick="toggleConnectMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 8 l8 8" stroke-dasharray="2 2"/></svg>
      <span class="lab">Connect</span>
    </button>
    <button class="tbtn" id="tb-note" onclick="toggleNoteMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
      <span class="lab">Note</span>
    </button>
    <button class="tbtn" onclick="showBgMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 16l4-4 4 4 4-4 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
      <span class="lab">Map</span>
    </button>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-back" id="modal-back" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<!-- ============ FILE VIEWER ============ -->
<div class="file-viewer" id="file-viewer">
  <div class="fv-head">
    <button class="iconbtn" onclick="closeFileViewer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="fv-name" id="fv-name"></div>
  </div>
  <div class="fv-body" id="fv-body"></div>
</div>

<input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png,.txt,image/*,application/pdf,text/plain" style="display:none">
<input type="file" id="bg-input" accept="image/*" style="display:none">
<input type="file" id="icon-input" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/*" style="display:none">

<script>
/* =========================================================
   NODE TYPES & TRAVEL MODES — visual definitions
   ========================================================= */
const NODE_TYPES = {
  stop:               { label:'Stop',                icon:null },
  airport_arrival:    { label:'Airport · Arrival',   icon:`<svg viewBox="0 0 32 32"><g transform="translate(16 16) rotate(20) translate(-16 -16)"><path d="M16 4c-.9 0-1.4.7-1.4 1.6v7l-9.6 5.4v2.4l9.6-2.9v4.7l-2.7 1.8v1.6l4.1-1.1 4.1 1.1v-1.6l-2.7-1.8v-4.7l9.6 2.9v-2.4l-9.6-5.4v-7c0-.9-.5-1.6-1.4-1.6z"/></g><rect x="3" y="27.5" width="26" height="1.6" rx=".8"/></svg>` },
  airport_departure:  { label:'Airport · Departure', icon:`<svg viewBox="0 0 32 32"><g transform="translate(16 16) rotate(-20) translate(-16 -16)"><path d="M16 4c-.9 0-1.4.7-1.4 1.6v7l-9.6 5.4v2.4l9.6-2.9v4.7l-2.7 1.8v1.6l4.1-1.1 4.1 1.1v-1.6l-2.7-1.8v-4.7l9.6 2.9v-2.4l-9.6-5.4v-7c0-.9-.5-1.6-1.4-1.6z"/></g><rect x="3" y="27.5" width="26" height="1.6" rx=".8"/></svg>` },
  hotel:              { label:'Hotel',               icon:`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 27V7h13v20"/><path d="M18 14h9v13"/><path d="M3 27h26"/><rect x="8" y="11" width="3" height="3" fill="currentColor" stroke="none"/><rect x="13" y="11" width="3" height="3" fill="currentColor" stroke="none"/><rect x="8" y="17" width="3" height="3" fill="currentColor" stroke="none"/><rect x="13" y="17" width="3" height="3" fill="currentColor" stroke="none"/><rect x="21" y="18" width="3" height="3" fill="currentColor" stroke="none"/></svg>` },
  train_arrival:      { label:'Train · Arrival',     icon:`<svg viewBox="0 0 32 32"><path d="M3 13l4-5h18v14H7l-4-2z"/><rect x="9" y="11" width="4" height="4" fill="var(--paper-deep)"/><rect x="17" y="11" width="4" height="4" fill="var(--paper-deep)"/><circle cx="11" cy="25" r="2.2"/><circle cx="20" cy="25" r="2.2"/><path d="M30 16l-4-3v6z"/></svg>` },
  train_departure:    { label:'Train · Departure',   icon:`<svg viewBox="0 0 32 32"><path d="M29 13l-4-5H7v14h18l4-2z"/><rect x="11" y="11" width="4" height="4" fill="var(--paper-deep)"/><rect x="19" y="11" width="4" height="4" fill="var(--paper-deep)"/><circle cx="12" cy="25" r="2.2"/><circle cx="21" cy="25" r="2.2"/><path d="M2 16l4-3v6z"/></svg>` }
};

const TRAVEL_MODES = {
  walk:        { label:'Walk',        icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M11 21l1-7-3-3 2-5 4 3 3 1"/><path d="M9 11l-2 4M14 14l3 4"/></svg>`, prevColor:'#5d6e4a', prevDash:'1 5', prevWidth:2.4 },
  taxi:        { label:'Taxi',        icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17V11l2-4h10l2 4v6"/><circle cx="8" cy="17" r="2" fill="currentColor"/><circle cx="16" cy="17" r="2" fill="currentColor"/><path d="M9 4h6M5 11h14"/></svg>`, prevColor:'#c8950b', prevDash:'9 5', prevWidth:2.6 },

const DB_NAME='WayfarerDB', DB_VER=1;
let _db;

/* Custom icon library — global, shared across all journeys */
let _customIcons = []; // [{id, label, fileId}]
const _customIconUrls = new Map();

/* Built-in type overrides — global. Replaces the built-in SVG icon
   (and label, optionally) for a given type key. Each override has
   {fileId, label?}. */
let _typeOverrides = {}; // { airport_arrival: {fileId, label}, ... }
const _typeOverrideUrls = new Map();

/* Airlines library — list of {id, name, code, imageFileId?}.
   Shared across journeys. */
let _airlines = [];
const _airlineImgUrls = new Map();

/* Hotels library — list of {id, name, chain, address, phone, email,
   website, notes, imageFileId?}. Shared across journeys. */
let _hotels = [];
const _hotelImgUrls = new Map();

async function loadCustomIcons(){
  _customIcons = (await Meta.get('customIcons')) || [];
  for(const ic of _customIcons){
    if(_customIconUrls.has(ic.id)) continue;
    const f = await dbGet('files', ic.fileId);
    if(f && f.blob){
      _customIconUrls.set(ic.id, URL.createObjectURL(f.blob));
    }
  }
  _typeOverrides = (await Meta.get('typeOverrides')) || {};
  for(const [key, ov] of Object.entries(_typeOverrides)){
    if(_typeOverrideUrls.has(key)) continue;
    const f = await dbGet('files', ov.fileId);
    if(f && f.blob){
      _typeOverrideUrls.set(key, URL.createObjectURL(f.blob));
    }
  }
}

async function loadLibraries(){
  _airlines = (await Meta.get('airlines')) || [];
  for(const a of _airlines){
    if(a.imageFileId && !_airlineImgUrls.has(a.id)){
      const f = await dbGet('files', a.imageFileId);
      if(f && f.blob) _airlineImgUrls.set(a.id, URL.createObjectURL(f.blob));
    }
  }
  _hotels = (await Meta.get('hotels')) || [];
  for(const h of _hotels){
    if(h.imageFileId && !_hotelImgUrls.has(h.id)){
      const f = await dbGet('files', h.imageFileId);
      if(f && f.blob) _hotelImgUrls.set(h.id, URL.createObjectURL(f.blob));
    }
  }
}

async function saveHotels()  { await Meta.set('hotels', _hotels); }

/* Returns {pinClass, innerHtml, isImage} for a node of the given type. */
function getNodePinInfo(type, num){
  // 1. Built-in type with user override → image fills pin
  if(NODE_TYPES[type] && _typeOverrides[type]){
    const url = _typeOverrideUrls.get(type);
    if(url){
      return { pinClass: 'has-image', innerHtml: `<img src="${url}" alt="">`, isImage: true };
    }
  }
  // 2. Custom icon from library → image fills pin
  if(type && type.startsWith('custom_')){
    const iconId = type.slice(7);
    const url = _customIconUrls.get(iconId);
    if(url){
      return { pinClass: 'has-image', innerHtml: `<img src="${url}" alt="">`, isImage: true };
    }
    // fallback if icon was deleted
    return { pinClass: 't-stop', innerHtml: `<span class="node-num">${num}</span>`, isImage: false };
  }
  // 3. Built-in type with default SVG
  const tdef = NODE_TYPES[type] || NODE_TYPES.stop;
  const inner = tdef.icon || `<span class="node-num">${num}</span>`;
  return { pinClass: 't-' + (type || 'stop'), innerHtml: inner, isImage: false };
}

/* Return the user-facing label for a type (respecting override rename). */
function getTypeLabel(typeKey){
  if(typeKey && typeKey.startsWith('custom_')){
    const iconId = typeKey.slice(7);
    const ic = _customIcons.find(x => x.id === iconId);
    return ic ? ic.label : 'Custom';
  }
  if(_typeOverrides[typeKey] && _typeOverrides[typeKey].label){
    return _typeOverrides[typeKey].label;
  }
  return (NODE_TYPES[typeKey] && NODE_TYPES[typeKey].label) || 'Stop';
}
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const req=indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('journeys')) db.createObjectStore('journeys',{keyPath:'id'});
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess=()=>{_db=req.result;res(_db);};
    req.onerror=()=>rej(req.error);
  });
}
function tx(store, mode='readonly'){
  return openDB().then(db=>db.transaction(store,mode).objectStore(store));
}
async function dbGet(store,key){
  const s=await tx(store);
  return new Promise((res,rej)=>{const r=s.get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
}
async function dbPut(store,val){
  const s=await tx(store,'readwrite');
  return new Promise((res,rej)=>{const r=s.put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error);});
}
async function dbDel(store,key){
  const s=await tx(store,'readwrite');
  return new Promise((res,rej)=>{const r=s.delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
}
async function dbAll(store){
  const s=await tx(store);
  return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
}

const Meta={
  async get(k){const r=await dbGet('meta',k);return r?r.value:null;},
  async set(k,v){return dbPut('meta',{key:k,value:v});}
};

/* =========================================================
   TIMELINE HELPERS

   A "datetime" on a stop = { date: "YYYY-MM-DD", time: "HH:MM" }.
   When both are present, the stop has a concrete moment in time.
   The journey's timeline covers all days from min-date to max-date.

   Layout convention (because the user chose "bottom = earliest"):
     - Day band 0 (= first day, earliest) sits at the BOTTOM of the stage.
     - Subsequent days stack upward.
     - Within a day, time 00:00 is at the BOTTOM of that day's band,
       and 23:59 is at the TOP of that day's band.

   So: stage_y_for(date, time) = stageH - (dayIndex + 1) * pxPerDay
                                + (1 - minuteOfDay/1440) * pxPerDay
   Equivalently:
     y_from_top = stageH - (dayIndex * pxPerDay + (1 - minuteOfDay/1440) * pxPerDay)
   ========================================================= */
const MINUTES_PER_DAY = 1440;

function isoDate(d){
  // Accepts a Date or YYYY-MM-DD string; returns YYYY-MM-DD.
  if(typeof d === 'string') return d;
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseISODate(s){
  // Returns a Date at local midnight of that day, or null if invalid.
  if(!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
}
function daysBetween(a, b){
  // Days from a to b (b - a), as an integer; a and b are YYYY-MM-DD strings.
  const da = parseISODate(a), db = parseISODate(b);
  if(!da || !db) return 0;
  return Math.round((db - da) / 86400000);
}
function minutesFromTime(s){
  // "HH:MM" → minutes since midnight, or null if invalid.
  if(!s || typeof s !== 'string') return null;
  const m = s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  if(h<0||h>23||mi<0||mi>59) return null;
  return h*60 + mi;
}
function formatDuration(mins){
  // mins → "1h 30m", "45m", "2d", "1d 3h", ""
  if(!mins || mins <= 0) return '';
  if(mins < 60) return mins + 'm';
  const totalH = Math.floor(mins / 60);
  const remM = mins % 60;
  if(totalH < 24){
    return remM ? `${totalH}h ${remM}m` : `${totalH}h`;
  }
  const days = Math.floor(totalH / 24);
  const hrs = totalH % 24;
  if(!hrs && !remM) return `${days}d`;
  return remM ? `${days}d ${hrs}h ${remM}m` : `${days}d ${hrs}h`;
}
function fmtMonthShort(date){
  // Three-letter month, e.g. "May", "Dec"
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][date.getMonth()];
}

/* Inspect the active journey's stops to figure out the timeline span. */
function getTimelineRange(j){
  if(!j || !j.nodes) return null;
  const dated = j.nodes.filter(n => n.date);
  if(dated.length === 0) return null;
  let minD = dated[0].date, maxD = dated[0].date;
  for(const n of dated){
    if(n.date < minD) minD = n.date;
    if(n.date > maxD) maxD = n.date;
  }
  const dayCount = daysBetween(minD, maxD) + 1;
  return { minDate: minD, maxDate: maxD, dayCount };
}

/* Convert a stop's date+time to its target Y coordinate on the stage,
   using the bottom-is-earliest convention. Returns null if the stop
   doesn't have a date set (no time → can't position). */
function stopTargetY(node, range, stageH, pxPerDay){
  if(!node.date || !range) return null;
  const dayIdx = daysBetween(range.minDate, node.date); // 0-based
  const mins = minutesFromTime(node.time);
  // If no time given, place it at noon of that day as a sane default
  const frac = mins == null ? 0.5 : (mins / MINUTES_PER_DAY);
  // Bottom of stage = day 0, top of day 0's band = day 1's bottom
  // y_from_top = stageH - dayIdx*pxPerDay - (1 - frac)*pxPerDay - pxPerDay
  // wait — simpler: each day occupies pxPerDay px starting from the bottom.
  // The bottom edge of day i is at y = stageH - i*pxPerDay
  // The top edge of day i is at y = stageH - (i+1)*pxPerDay
  // Within day i, frac=0 (midnight) is at the bottom, frac=1 (end of day) at the top.
  const dayBottomY = stageH - dayIdx * pxPerDay;
  return dayBottomY - frac * pxPerDay;
}

/* Compute travel duration between two connected stops (in minutes),
   or null if either lacks a date. */
function edgeDurationMinutes(a, b){
  if(!a.date || !b.date) return null;
  const aMin = minutesFromTime(a.time);
  const bMin = minutesFromTime(b.time);
  // If only date is set, treat as 12:00
  const aTotal = daysBetween(a.date, b.date) * MINUTES_PER_DAY;
  const aT = aMin == null ? 720 : aMin;
  const bT = bMin == null ? 720 : bMin;
  const diff = aTotal + (bT - aT);
  if(diff <= 0) return null;
  // Subtract stay duration at the FROM stop (if set)
  const stay = (a.duration && a.duration > 0) ? a.duration : 0;
  const travel = diff - stay;
  return travel > 0 ? travel : null;
}
