function toggleTypeCollapsible(){
  const c = document.getElementById('nd-type-coll');
  if(c) c.classList.toggle('open');
}

function renderTypeGrid(currentType){
  let html = '';
  // built-in types — each tile gets edit pencil + may show user-overridden image
  for(const [k,v] of Object.entries(NODE_TYPES)){
    const ovUrl = _typeOverrideUrls.get(k);
    const label = (_typeOverrides[k] && _typeOverrides[k].label) || v.label;
    const icoInner = ovUrl
      ? `<img src="${ovUrl}" alt="">`
      : (v.icon || `<span style="font-family:Cinzel;font-size:13px;font-weight:600;">●</span>`);
    const icoClass = ovUrl ? 'ico has-image' : 'ico';
    html += `<div class="type-opt t-${k} ${currentType===k?'selected':''}" data-type="${k}" onclick="pickNodeType('${k}')">
      <div class="edit-btn" onclick="event.stopPropagation();editBuiltinType('${k}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg></div>
      <div class="${icoClass}">${icoInner}</div>
      <div class="nm">${escapeHtml(label)}</div>
    </div>`;
  }
  // custom icons — each gets pencil (edit) and × (delete)
  for(const ic of _customIcons){
    const url = _customIconUrls.get(ic.id) || '';
    const tk = 'custom_' + ic.id;
    html += `<div class="type-opt t-custom ${currentType===tk?'selected':''}" data-type="${tk}" onclick="pickNodeType('${tk}')">
      <div class="edit-btn" onclick="event.stopPropagation();editCustomIcon('${ic.id}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg></div>
      <div class="x" onclick="event.stopPropagation();confirmDeleteCustomIcon('${ic.id}')">×</div>
      <div class="ico has-image"><img src="${url}" alt=""></div>
      <div class="nm">${escapeHtml(ic.label)}</div>
    </div>`;
  }
  // add new tile
  html += `<div class="type-opt add" onclick="uploadCustomIcon()">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="nm">Add icon</div>
  </div>`;
  return html;
}

function pickNodeType(type){
  if(!_editingNode)return;
  _editingNode.type=type;
  document.querySelectorAll('#nd-types .type-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.type===type);
  });
  // Update the collapsible header preview
  const head = document.querySelector('#nd-type-coll .collapsible-head');
  const ico = document.getElementById('nd-type-preview-ico');
  const nm = document.getElementById('nd-type-preview-name');
  if(head && ico && nm){
    const info = getNodePinInfo(type, '');
    // remove old t-* classes
    head.className = 'collapsible-head ' + info.pinClass;
    ico.className = 'preview-ico ' + (info.isImage ? 'has-image' : '');
    ico.innerHTML = info.innerHtml;
    nm.textContent = getTypeLabel(type);
  }
}

/* Re-render the type grid in the open node-detail modal (preserves footer handlers). */
function refreshTypeGrid(){
  if(!_editingNode) return;
  const grid = document.getElementById('nd-types');
  if(grid) grid.innerHTML = renderTypeGrid(_editingNode.type);
}

/* =========================================================
   ICON FILE PICKER — uses the persistent #icon-input element
   so the file picker opens reliably on Android.
   ========================================================= */
let _iconPickCb = null;
function pickIconFile(cb){
  // cb(file|null)
  _iconPickCb = cb;
  const inp = document.getElementById('icon-input');
  inp.value = '';
  inp.onchange = () => {
    const file = inp.files[0];
    const cb2 = _iconPickCb;
    _iconPickCb = null;
    if(cb2) cb2(file || null);
  };
  inp.click();
}

/* =========================================================
   CUSTOM ICONS — upload, rename, delete
   ========================================================= */
function uploadCustomIcon(){
  pickIconFile(file => {
    if(!file) return;
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); return; }
    const defaultLabel = file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,30);
    promptIconLabel('Label Icon', defaultLabel, async (label) => {
      // After label dialog, always re-open node detail to restore handlers
      const nodeId = _editingNode ? _editingNode.id : null;
      if(label === null){
        if(nodeId) openNodeDetail(nodeId);
        return;
      }
      const trimmed = (label || defaultLabel).trim().slice(0,30);
      if(!trimmed){
        if(nodeId) openNodeDetail(nodeId);
        return;
      }
      const fid = uuid();
      await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
      const id = 'icn-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
      _customIcons.push({ id, label: trimmed, fileId: fid });
      _customIconUrls.set(id, URL.createObjectURL(file));
      await saveCustomIcons();
      // Auto-select the new icon for the current node
      if(_editingNode){
        _editingNode.type = 'custom_' + id;
      }
      toast('Icon added');
      if(nodeId) openNodeDetail(nodeId);
    });
  });
}

/* Edit menu for a custom (library) icon: replace image, rename, delete */
function editCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  openSubMenu({
    title: ic.label,
    items: [
      { label:'Replace image',  onClick: () => replaceCustomIconImage(iconId) },
      { label:'Rename',         onClick: () => renameCustomIcon(iconId) },
      { label:'Delete',         danger: true, onClick: () => confirmDeleteCustomIcon(iconId) }
    ]
  });
}

function replaceCustomIconImage(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  pickIconFile(async (file) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(!file){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); if(nodeId) openNodeDetail(nodeId); return; }
    // delete old file blob
    await dbDel('files', ic.fileId);
    const url = _customIconUrls.get(iconId);
    if(url) URL.revokeObjectURL(url);
    // save new
    const fid = uuid();
    await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
    ic.fileId = fid;
    _customIconUrls.set(iconId, URL.createObjectURL(file));
    await saveCustomIcons();
    toast('Image replaced');
    if(nodeId) openNodeDetail(nodeId);
  });
}

function renameCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  promptIconLabel('Rename Icon', ic.label, async (label) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(label === null){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    const trimmed = (label || ic.label).trim().slice(0,30);
    if(trimmed){
      ic.label = trimmed;
      await saveCustomIcons();
      toast('Renamed');
    }
    if(nodeId) openNodeDetail(nodeId);
  });
}

function confirmDeleteCustomIcon(iconId){
  const ic = _customIcons.find(x => x.id === iconId);
  if(!ic) return;
  openConfirm({
    title:'Delete Icon?',
    body:`Remove <strong>"${escapeHtml(ic.label)}"</strong> from your icon library?<br>
          <span style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);font-size:14px;">
          Stops currently using this icon will fall back to the numbered style.</span>`,
    okLabel:'Delete',
    okClass:'danger',
    onOk: async () => {
      const url = _customIconUrls.get(iconId);
      if(url) URL.revokeObjectURL(url);
      _customIconUrls.delete(iconId);
      await dbDel('files', ic.fileId);
      _customIcons = _customIcons.filter(x => x.id !== iconId);
      await saveCustomIcons();
      if(_editingNode && _editingNode.type === 'custom_' + iconId){
        _editingNode.type = 'stop';
      }
      toast('Icon removed');
    }
  });
}

/* =========================================================
   BUILT-IN TYPE EDITING — replace icon image, rename, reset
   ========================================================= */
function editBuiltinType(typeKey){
  const def = NODE_TYPES[typeKey];
  if(!def) return;
  const hasOverride = !!_typeOverrides[typeKey];
  const label = (hasOverride && _typeOverrides[typeKey].label) || def.label;
  const items = [
    { label: hasOverride ? 'Replace image' : 'Use custom image', onClick: () => replaceBuiltinIcon(typeKey) },
    { label: 'Rename', onClick: () => renameBuiltinType(typeKey) }
  ];
  if(hasOverride){
    items.push({ label: 'Reset to default', danger: true, onClick: () => resetBuiltinType(typeKey) });
  }
  openSubMenu({ title: label, items });
}

function replaceBuiltinIcon(typeKey){
  pickIconFile(async (file) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(!file){
      if(nodeId) openNodeDetail(nodeId);
      return;
    }
    if(file.size > 5*1024*1024){ toast('Icon too large (5MB max)'); if(nodeId) openNodeDetail(nodeId); return; }
    // delete old override file if any
    if(_typeOverrides[typeKey]){
      await dbDel('files', _typeOverrides[typeKey].fileId);
      const oldUrl = _typeOverrideUrls.get(typeKey);
      if(oldUrl) URL.revokeObjectURL(oldUrl);
    }
    const fid = uuid();
    await dbPut('files', { id:fid, blob:file, type:file.type, name:file.name });
    const existingLabel = _typeOverrides[typeKey] ? _typeOverrides[typeKey].label : null;
    _typeOverrides[typeKey] = { fileId: fid, label: existingLabel };
    _typeOverrideUrls.set(typeKey, URL.createObjectURL(file));
    await saveTypeOverrides();
    toast('Icon replaced');
    if(nodeId) openNodeDetail(nodeId);
  });
}

function renameBuiltinType(typeKey){
  const def = NODE_TYPES[typeKey];
  const current = (_typeOverrides[typeKey] && _typeOverrides[typeKey].label) || def.label;
  promptIconLabel('Rename Type', current, async (label) => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(label === null){ if(nodeId) openNodeDetail(nodeId); return; }
    const trimmed = (label || current).trim().slice(0,30);
    if(trimmed && trimmed !== def.label){
      if(!_typeOverrides[typeKey]) _typeOverrides[typeKey] = { fileId: null, label: trimmed };
      else _typeOverrides[typeKey].label = trimmed;
      await saveTypeOverrides();
      toast('Renamed');
    } else if(trimmed === def.label && _typeOverrides[typeKey]){
      // reset label to default — keep image override if any
      _typeOverrides[typeKey].label = null;
      if(!_typeOverrides[typeKey].fileId) delete _typeOverrides[typeKey];
      await saveTypeOverrides();
    }
    if(nodeId) openNodeDetail(nodeId);
  });
}

function resetBuiltinType(typeKey){
  openConfirm({
    title: 'Reset to default?',
    body: `Restore the original icon and label for <strong>"${escapeHtml(NODE_TYPES[typeKey].label)}"</strong>?`,
    okLabel: 'Reset',
    okClass: 'danger',
    onOk: async () => {
      const ov = _typeOverrides[typeKey];
      if(ov && ov.fileId) await dbDel('files', ov.fileId);
      const url = _typeOverrideUrls.get(typeKey);
      if(url) URL.revokeObjectURL(url);
      _typeOverrideUrls.delete(typeKey);
      delete _typeOverrides[typeKey];
      await saveTypeOverrides();
      toast('Reset');
    }
  });
}

/* =========================================================
   GENERIC SUB-MODALS — open menu, confirm, prompt
   These all leave node-detail-restoration to themselves: when
   they close, they re-open the node detail so footer buttons
   keep their JS handlers.
   ========================================================= */
function openSubMenu({title, items}){
  const modal = document.getElementById('modal');
  const itemsHtml = items.map((it,i) => `
    <button data-i="${i}" class="${it.danger?'danger':''}">${escapeHtml(it.label)}</button>
  `).join('');
  modal.innerHTML = `
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body">
      <div class="picker-menu">${itemsHtml}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="sm-cancel">Cancel</button>
    </div>`;
  modal.querySelectorAll('.picker-menu button').forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.i, 10);
      // Caller's onClick is responsible for what happens next
      // (it may open another sub-modal or re-open node detail).
      items[i].onClick();
    };
  });
  const cancel = () => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(nodeId) openNodeDetail(nodeId);
    else closeModal();
  };
  document.getElementById('sm-cancel').onclick = cancel;
}

function openConfirm({title, body, okLabel='OK', okClass='primary', onOk}){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body"><p style="margin:0;font-size:16px;">${body}</p></div>
    <div class="modal-foot">
      <button class="btn" id="cf-cancel">Cancel</button>
      <button class="btn ${okClass}" id="cf-ok">${escapeHtml(okLabel)}</button>
    </div>`;
  const back = () => {
    const nodeId = _editingNode ? _editingNode.id : null;
    if(nodeId) openNodeDetail(nodeId);
    else closeModal();
  };
  document.getElementById('cf-cancel').onclick = back;
  document.getElementById('cf-ok').onclick = async () => {
    if(onOk) await onOk();
    back();
  };
}

function promptIconLabel(title, defaultName, cb){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body">
      <label>Name</label>
      <input type="text" id="il-name" value="${escapeHtml(defaultName)}" maxlength="30">
    </div>
    <div class="modal-foot">
      <button class="btn" id="il-cancel">Cancel</button>
      <button class="btn primary" id="il-ok">Save</button>
    </div>`;
  document.getElementById('il-cancel').onclick = () => cb(null);
  document.getElementById('il-ok').onclick = () => {
    const v = document.getElementById('il-name').value.trim();
    cb(v || defaultName);
  };
  setTimeout(()=>{const el=document.getElementById('il-name');el.focus();el.select();},80);
}

async function loadFileThumbs(){
  const icons=document.querySelectorAll('.file-icon[data-thumb="1"]');
  for(const ic of icons){
    const fid=ic.dataset.fid;
    const f=await dbGet('files',fid);
    if(f && f.blob){
      const url=URL.createObjectURL(f.blob);
      ic.style.backgroundImage=`url(${url})`;
    }
  }
}

async function saveNodeDetail(){
  if(!_editingNode)return;
  _editingNode.name=document.getElementById('nd-name').value.trim()||'Unnamed';
  _editingNode.description=document.getElementById('nd-desc').value;
  await saveActive();
  closeModal();
  renderCanvas();
  toast('Saved');
}

function confirmDeleteNode(){
  const node=_editingNode;
  if(!node)return;
  openModal({
    title:'Delete Stop?',
    body:`<p style="margin:0;font-size:16px;">Remove <strong>"${escapeHtml(node.name)}"</strong> and all its attached documents?</p>`,
    actions:[
      {label:'Cancel',onClick:()=>openNodeDetail(node.id)},
      {label:'Delete',cls:'danger',onClick:async()=>{
        // remove files
        for(const f of (node.files||[])) await dbDel('files',f.id);
        // remove node
        App.active.nodes=App.active.nodes.filter(n=>n.id!==node.id);
        // remove edges referencing it
        App.active.edges=App.active.edges.filter(e=>e.from!==node.id && e.to!==node.id);
        await saveActive();
        _editingNode=null;
        App.selectedNode=null;
        closeModal();
        renderCanvas();
        toast('Stop removed');
      }}
    ]
  });
}

/* =========================================================
   FILES (ATTACH / VIEW / RENAME / REMOVE)
   ========================================================= */
function addFileToNode(){
  const inp=document.getElementById('file-input');
  inp.value='';
  inp.onchange=async()=>{
    const file=inp.files[0];
    if(!file)return;
    if(file.size>50*1024*1024){toast('File over 50MB skipped');return;}
    const fid=uuid();
    await dbPut('files',{id:fid,blob:file,type:file.type,name:file.name});
    _editingNode.files=_editingNode.files||[];
    // ask for label
    promptFileLabel(file.name, async label=>{
      _editingNode.files.push({id:fid,name:label||file.name,size:file.size,type:file.type});
      await saveActive();
      // re-open detail to reflect
      openNodeDetail(_editingNode.id);
    });
  };
  inp.click();
}

function promptFileLabel(defaultName, cb){
  // open as a sub-modal: replace current modal content briefly
  const modal=document.getElementById('modal');
  const prev=modal.innerHTML;
  modal.innerHTML=`
    <div class="modal-head"><h2>Document Label</h2></div>
    <div class="modal-body">
      <label>How should this be labelled?</label>
      <input type="text" id="fl-name" value="${escapeHtml(defaultName)}" maxlength="80">
    </div>
    <div class="modal-foot">
      <button class="btn" id="fl-cancel">Skip</button>
      <button class="btn primary" id="fl-ok">Save</button>
    </div>`;

  document.getElementById('fl-ok').onclick=()=>{
    const v=document.getElementById('fl-name').value.trim();
    cb(v||defaultName);
  };
  setTimeout(()=>{const el=document.getElementById('fl-name');el.focus();el.select();},50);
}

function renameFile(fid){
  const f=_editingNode.files.find(x=>x.id===fid);
  if(!f)return;
  const modal=document.getElementById('modal');
  const prev=modal.innerHTML;
  modal.innerHTML=`
    <div class="modal-head"><h2>Rename</h2></div>
    <div class="modal-body">
      <label>Document Label</label>
      <input type="text" id="rf-name" value="${escapeHtml(f.name)}" maxlength="80">
    </div>
    <div class="modal-foot">
      <button class="btn" id="rf-cancel">Cancel</button>
      <button class="btn primary" id="rf-ok">Save</button>
    </div>`;

}

function confirmRemoveFile(fid){
  const f=_editingNode.files.find(x=>x.id===fid);
  if(!f)return;
  const modal=document.getElementById('modal');
  const prev=modal.innerHTML;
  modal.innerHTML=`
    <div class="modal-head"><h2>Remove Document?</h2></div>
    <div class="modal-body"><p style="margin:0;font-size:16px;">Remove <strong>"${escapeHtml(f.name)}"</strong> from this stop?</p></div>
    <div class="modal-foot">
      <button class="btn" id="rmf-cancel">Cancel</button>
      <button class="btn danger" id="rmf-ok">Remove</button>
    </div>`;
  document.getElementById('rmf-cancel').onclick=()=>openNodeDetail(_editingNode.id);
  document.getElementById('rmf-ok').onclick=async()=>{
    await dbDel('files',fid);
    _editingNode.files=_editingNode.files.filter(x=>x.id!==fid);
    await saveActive();
    openNodeDetail(_editingNode.id);
    toast('Removed');
  };
}

async function viewFile(fid){
  const meta=_editingNode.files.find(x=>x.id===fid);
  const f=await dbGet('files',fid);
  if(!f){toast('File missing');return;}
  const url=URL.createObjectURL(f.blob);
  const fv=document.getElementById('file-viewer');
  const body=document.getElementById('fv-body');
  document.getElementById('fv-name').textContent=meta?meta.name:f.name;
  body.innerHTML='';
  const e=ext(f.name).toLowerCase();
  if(['jpg','jpeg','png','gif','webp'].includes(e) || (f.type||'').startsWith('image/')){
    const img=document.createElement('img');
    img.src=url;
    body.appendChild(img);
  }else if(e==='pdf' || f.type==='application/pdf'){
    const ifr=document.createElement('iframe');
    ifr.src=url;
    body.appendChild(ifr);
  }else if(e==='txt' || (f.type||'').startsWith('text/')){
    const txt=await f.blob.text();
    const pre=document.createElement('pre');
    pre.textContent=txt;
    body.appendChild(pre);
  }else{
    // download fallback
    const a=document.createElement('a');
    a.href=url;a.download=f.name;a.click();
    toast('Downloading');
    URL.revokeObjectURL(url);
    return;
  }
  fv._url=url;
  fv.classList.add('active');
}

function closeFileViewer(){
  const fv=document.getElementById('file-viewer');
  if(fv._url){URL.revokeObjectURL(fv._url);fv._url=null;}
  fv.classList.remove('active');
  document.getElementById('fv-body').innerHTML='';
}

function addBackground(){

async function removeBackground(){
  if(App.active.backgroundFileId) await dbDel('files',App.active.backgroundFileId);
  App.active.backgroundFileId=null;
  await saveActive();
  await loadBackground();
  closeModal();
  renderCanvas();
  toast('Background removed');
}

/* =========================================================
   JOURNEY MENU (3-dot)
   ========================================================= */
function showJourneyMenu(){
  const j = App.active;
  openModal({
    title:j.name,
    body:`
      <div class="picker-menu">
        <button onclick="renameActive()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M4 20l4-1 12-12-3-3L5 16l-1 4z"/></svg>
          Rename Journey
        </button>
        <button onclick="closeModal();showBgMenu();">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 16l4-4 4 4 4-4 4 4"/></svg>
          Map background
        </button>
        <button onclick="closeModal();showSettings();">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </button>
        <button onclick="closeModal();showHome();">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
          Back to Home
        </button>
        <button onclick="closeModal();showArchive();">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v3H4zM5 10v9h14v-9"/></svg>
          Open Archive
        </button>
      </div>
    `,
    actions:[{label:'Close',onClick:closeModal}]
  });
}

/* Settings is shown as a modal so it works from both the home screen
   and the in-journey menu. Pin size, animations: global preferences. */
function showSettings(){
  const size = App.settings.pinSize || 'medium';
  const animOn = App.settings.pathsAnimated !== false;
  openModal({
    title:'Settings',
    body:`
      <div class="toggle-row">
        <div>
          <div class="lbl">Pin size</div>
          <div class="sub">size of stops on every map</div>
        </div>
      </div>
      <div class="size-row" style="margin:0 0 18px;">
        <button class="${size==='compact'?'active':''}" onclick="setPinSize('compact', this)">Compact</button>
        <button class="${size==='medium'?'active':''}" onclick="setPinSize('medium', this)">Medium</button>
        <button class="${size==='large'?'active':''}" onclick="setPinSize('large', this)">Large</button>
      </div>
      <div class="toggle-row">
        <div>
          <div class="lbl">Animate paths</div>
          <div class="sub">flowing dashes along each route</div>
        </div>
        <div class="tog ${animOn?'on':''}" id="tog-anim" onclick="toggleAnim()"></div>
      </div>
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-muted);margin:18px 0 0;font-size:13px;text-align:center;">
        Settings apply to every journey, current and future.
      </p>
    `,
    actions:[{label:'Close',cls:'primary',onClick:closeModal}]
  });
}

async function toggleAnim(){
  App.settings.pathsAnimated = App.settings.pathsAnimated === false ? true : false;
  await saveSettings();
  const t = document.getElementById('tog-anim');
  if(t) t.classList.toggle('on', App.settings.pathsAnimated !== false);
  if(App.active) renderCanvas();
}

async function setPinSize(size, btn){
  App.settings.pinSize = size;
  await saveSettings();
  document.querySelectorAll('.size-row button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(App.active) renderCanvas();
}

function renameActive(){
  closeModal();
  const j=App.active;
  openModal({
    title:'Rename Journey',
    body:`<label>New Name</label><input type="text" id="ra-name" value="${escapeHtml(j.name)}" maxlength="80">`,
    actions:[
      {label:'Cancel',onClick:closeModal},
      {label:'Save',cls:'primary',onClick:async()=>{
        j.name=document.getElementById('ra-name').value.trim()||j.name;
        await saveActive();
        document.getElementById('journey-title').textContent=j.name;
        closeModal();
        toast('Renamed');
      }}
    ]
  });
  setTimeout(()=>{const el=document.getElementById('ra-name');el.focus();el.select();},100);
}

/* =========================================================
   MODAL FRAMEWORK
   ========================================================= */
let _modalClose=null;
function openModal({title,body,actions,onClose}){
  const back=document.getElementById('modal-back');
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="modal-head"><h2>${escapeHtml(title)}</h2></div>
    <div class="modal-body scrollarea">${body}</div>
    <div class="modal-foot" id="modal-actions"></div>`;
  const acts=document.getElementById('modal-actions');
  actions.forEach((a,i)=>{
    const b=document.createElement('button');
    b.className='btn '+(a.cls||'');
    b.textContent=a.label;
    b.onclick=a.onClick;
    acts.appendChild(b);
  });
  _modalClose=onClose||null;
  back.classList.add('active');
}

function closeModal(){
  document.getElementById('modal-back').classList.remove('active');
  if(_modalClose){_modalClose();_modalClose=null;}
}

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener('resize',()=>{
  if(App.active){
    sizeStage();
    renderCanvas();
  }
});
document.addEventListener('DOMContentLoaded',async()=>{
  await openDB();
  await loadSettings();
  await loadCustomIcons();
  await refreshHome();
});
// also fire if DOM already ready
if(document.readyState!=='loading'){
  (async()=>{await openDB();await loadSettings();await loadCustomIcons();await refreshHome();})();
}

// Register service worker for offline support and PWA install
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
